 class=\"katex-inline\">\\mathcal F[e^{-a\\lvert x\\rvert}]<\/span> 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> <span class=\"katex-inline\">\\frac{2a}{a^2+k^2}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> <span class=\"katex-inline\">\\frac{1}{a+ik}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> <span class=\"katex-inline\">\\frac{2}{a^2+k^2}<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c503' data-chapter='ch05'><p class='quiz-q'><b>Q2.<\/b> <span class=\"katex-inline\">\\mathcal F[f&#x27;(x)]<\/span> 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> <span class=\"katex-inline\">ikF(k)<\/span><\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> <span class=\"katex-inline\">-ikF(k)<\/span><\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> <span class=\"katex-inline\">k^2F(k)<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：拉普拉斯变换<\/h1><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c602' data-chapter='ch06'><p class='quiz-q'><b>Q1.<\/b> <span class=\"katex-inline\">\\mathcal L[f&#x27;&#x27;]<\/span> 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> <span class=\"katex-inline\">s^2F-sf(0)-f&#x27;(0)<\/span><\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> <span class=\"katex-inline\">s^2F<\/span><\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> <span class=\"katex-inline\">sF-f(0)<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single' data-concept='c601' data-chapter='ch06'><p class='quiz-q'><b>Q2.<\/b> <span class=\"katex-inline\">\\frac{1}{s-a}<\/span> 的收敛域是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> <span class=\"katex-inline\">\\operatorname{Re}s&gt;a<\/span><\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> <span class=\"katex-inline\">\\operatorname{Re}s&lt;a<\/span><\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> 全平面<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：方程的建立与定解条件<\/h1><div class='quiz-item' data-qid='q15' data-type='single' data-concept='c702' data-chapter='ch07'><p class='quiz-q'><b>Q1.<\/b> 一维热传导方程需要几个初始条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> <span class=\"katex-inline\">1<\/span> 个<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> <span class=\"katex-inline\">2<\/span> 个<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> <span class=\"katex-inline\">0<\/span> 个<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q16' data-type='single' data-concept='c702' data-chapter='ch07'><p class='quiz-q'><b>Q2.<\/b> <span class=\"katex-inline\">u_x(0,t)=0<\/span> 属于哪类边界条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> Dirichlet<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> Neumann<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> Robin<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：分离变量法<\/h1><div class='quiz-item' data-qid='q17' data-type='single' data-concept='c802' data-chapter='ch08'><p class='quiz-q'><b>Q1.<\/b> 齐次 Dirichlet 边界 <span class=\"katex-inline\">X(0)=X(l)=0<\/span> 的本征函数是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> <span class=\"katex-inline\">\\sin\\frac{n\\pi x}{l}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> <span class=\"katex-inline\">\\cos\\frac{n\\pi x}{l}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> <span class=\"katex-inline\">e^{n\\pi x/l}<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single' data-concept='c803' data-chapter='ch08'><p class='quiz-q'><b>Q2.<\/b> 非齐次边界条件下直接分离变量，问题出在：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 边界不齐次，本征值问题无离散谱<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 方程次数太高<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 初始条件不够<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch09__": "<h1>测验：第 9 章：行波法与积分变换法<\/h1><div class='quiz-item' data-qid='q19' data-type='single' data-concept='c901' data-chapter='ch09'><p class='quiz-q'><b>Q1.<\/b> 达朗贝尔公式中初始速度项的系数是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> <span class=\"katex-inline\">\\frac{1}{2a}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> <span class=\"katex-inline\">\\frac{1}{a}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> <span class=\"katex-inline\">\\frac{1}{2}<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='single' data-concept='c903' data-chapter='ch09'><p class='quiz-q'><b>Q2.<\/b> 固定端 <span class=\"katex-inline\">u(0,t)=0<\/span> 的反射用哪种延拓？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> 奇延拓<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> 偶延拓<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> 周期延拓<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章：格林函数法<\/h1><div class='quiz-item' data-qid='q21' data-type='single' data-concept='c1001' data-chapter='ch10'><p class='quiz-q'><b>Q1.<\/b> 三维泊松方程的基本解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q21' value='0'> <span class=\"katex-inline\">\\frac{1}{4\\pi r}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q21' value='1'> <span class=\"katex-inline\">\\frac{1}{2\\pi}\\ln r<\/span><\/label><label class='quiz-opt'><input type='radio' name='q21' value='2'> <span class=\"katex-inline\">\\frac{\\lvert x\\rvert}{2}<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q22' data-type='single' data-concept='c1003' data-chapter='ch10'><p class='quiz-q'><b>Q2.<\/b> 波动格林函数中 <span class=\"katex-inline\">\\delta(t-t&#x27;-r/a)<\/span> 的作用是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q22' value='0'> 保证因果性，传播需要时间<\/label><label class='quiz-opt'><input type='radio' name='q22' value='1'> 表示源的空间分布<\/label><label class='quiz-opt'><input type='radio' name='q22' value='2'> 表示边界反射<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章：勒让德多项式与球谐函数<\/h1><div class='quiz-item' data-qid='q23' data-type='single' data-concept='c1102' data-chapter='ch11'><p class='quiz-q'><b>Q1.<\/b> <span class=\"katex-inline\">P_2(x)<\/span> 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q23' value='0'> <span class=\"katex-inline\">\\frac{3x^2-1}{2}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q23' value='1'> <span class=\"katex-inline\">\\frac{5x^3-3x}{2}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q23' value='2'> <span class=\"katex-inline\">x^2<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q24' data-type='single' data-concept='c1101' data-chapter='ch11'><p class='quiz-q'><b>Q2.<\/b> 球坐标分离变量中 <span class=\"katex-inline\">l<\/span> 取整数的原因是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q24' value='0'> 解在极点 <span class=\"katex-inline\">\\theta=0,\\pi<\/span> 要有界<\/label><label class='quiz-opt'><input type='radio' name='q24' value='1'> 初始条件要求<\/label><label class='quiz-opt'><input type='radio' name='q24' value='2'> 径向边界要求<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch12__": "<h1>测验：第 12 章：贝塞尔函数<\/h1><div class='quiz-item' data-qid='q25' data-type='single' data-concept='c1202' data-chapter='ch12'><p class='quiz-q'><b>Q1.<\/b> 圆柱内部解为什么只保留 <span class=\"katex-inline\">J_\\nu<\/span>？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q25' value='0'> <span class=\"katex-inline\">Y_\\nu<\/span> 在原点发散<\/label><label class='quiz-opt'><input type='radio' name='q25' value='1'> <span class=\"katex-inline\">J_\\nu<\/span> 更简单<\/label><label class='quiz-opt'><input type='radio' name='q25' value='2'> <span class=\"katex-inline\">Y_\\nu<\/span> 不满足边界<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q26' data-type='single' data-concept='c1203' data-chapter='ch12'><p class='quiz-q'><b>Q2.<\/b> 傅里叶–贝塞尔展开的正交积分权重是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q26' value='0'> <span class=\"katex-inline\">r<\/span><\/label><label class='quiz-opt'><input type='radio' name='q26' value='1'> <span class=\"katex-inline\">1<\/span><\/label><label class='quiz-opt'><input type='radio' name='q26' value='2'> <span class=\"katex-inline\">\\sin\\theta<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch13__": "<h1>测验：第 13 章：变分法初步<\/h1><div class='quiz-item' data-qid='q27' data-type='single' data-concept='c1302' data-chapter='ch13'><p class='quiz-q'><b>Q1.<\/b> 欧拉–拉格朗日方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q27' value='0'> <span class=\"katex-inline\">\\frac{d}{dx}F_{y&#x27;}-F_y=0<\/span><\/label><label class='quiz-opt'><input type='radio' name='q27' value='1'> <span class=\"katex-inline\">F_y=0<\/span><\/label><label class='quiz-opt'><input type='radio' name='q27' value='2'> <span class=\"katex-inline\">\\frac{d}{dx}F_y-F_{y&#x27;}=0<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q28' data-type='single' data-concept='c1304' data-chapter='ch13'><p class='quiz-q'><b>Q2.<\/b> 瑞利–里兹法给出的本征值近似是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q28' value='0'> 上界<\/label><label class='quiz-opt'><input type='radio' name='q28' value='1'> 下界<\/label><label class='quiz-opt'><input type='radio' name='q28' value='2'> 精确值<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='复数'>复数 — 形如 $x+iy$ 的数，也是复平面上的点/向量。 <span class=glossary-ref>（第 1 章：复数与复变函数）<\/span><\/li><li data-term='模与辐角'>模与辐角 — 复数到原点的距离 $r$，以及与正实轴的夹角 $\\theta$；$z=re^{i\\theta}$。 <span class=glossary-ref>（第 1 章：复数与复变函数）<\/span><\/li><li data-term='共轭复数'>共轭复数 — $z=x+iy$ 的共轭是 $\\bar z=x-iy$，且 $z\\bar z=\\lvert z\\rvert^2$。 <span class=glossary-ref>（第 1 章：复数与复变函数）<\/span><\/li><li data-term='复变函数'>复变函数 — 定义域和值域都在复平面上的函数 $w=f(z)$。 <span class=glossary-ref>（第 1 章：复数与复变函数）<\/span><\/li><li data-term='支点'>支点 — 绕一圈后函数值不复原的点，如 $\\sqrt z$、$\\ln z$ 的 $0$ 与 $\\infty$。 <span class=glossary-ref>（第 1 章：复数与复变函数）<\/span><\/li><li data-term='分支切割'>分支切割 — 从支点引出的割线，切开平面后才能选出单值分支。 <span class=glossary-ref>（第 1 章：复数与复变函数）<\/span><\/li><li data-term='解析函数'>解析函数 — 在一点的邻域内处处可导的函数；解析比可导要求更强。 <span class=glossary-ref>（第 2 章：解析函数）<\/span><\/li><li data-term='柯西–黎曼方程'>柯西–黎曼方程 — $u_x=v_y$、$u_y=-v_x$，复可导的充要条件之一。 <span class=glossary-ref>（第 2 章：解析函数）<\/span><\/li><li data-term='调和函数'>调和函数 — 满足 $\\Delta u=0$ 的函数；解析函数的实部与虚部都是。 <span class=glossary-ref>（第 2 章：解析函数）<\/span><\/li><li data-term='保角映射'>保角映射 — 导数非零的解析映射，局部保持角度大小与方向。 <span class=glossary-ref>（第 2 章：解析函数）<\/span><\/li><li data-term='柯西积分定理'>柯西积分定理 — 单连通区域内解析函数的闭路积分为零。 <span class=glossary-ref>（第 3 章：复变积分）<\/span><\/li><li data-term='柯西积分公式'>柯西积分公式 — $f(z_0)=\\frac{1}{2\\pi i}\\oint_C\\frac{f(z)}{z-z_0}dz$。 <span class=glossary-ref>（第 3 章：复变积分）<\/span><\/li><li data-term='刘维尔定理'>刘维尔定理 — 全平面解析且有界的函数必为常数。 <span class=glossary-ref>（第 3 章：复变积分）<\/span><\/li><li data-term='最大模原理'>最大模原理 — 非常数解析函数的模最大值只能在边界取到。 <span class=glossary-ref>（第 3 章：复变积分）<\/span><\/li><li data-term='泰勒级数'>泰勒级数 — 解析点附近的幂级数，收敛半径到最近奇点。 <span class=glossary-ref>（第 4 章：级数展开与留数）<\/span><\/li><li data-term='洛朗级数'>洛朗级数 — 环形区域内允许负幂项的展开。 <span class=glossary-ref>（第 4 章：级数展开与留数）<\/span><\/li><li data-term='孤立奇点'>孤立奇点 — $f$ 在 $z_0$ 附近解析但 $z_0$ 本身不解析；分可去、极点、本性。 <span class=glossary-ref>（第 4 章：级数展开与留数）<\/span><\/li><li data-term='留数'>留数 — 洛朗展开中 $\\frac{1}{z-z_0}$ 项的系数 $a_{-1}$。 <span class=glossary-ref>（第 4 章：级数展开与留数）<\/span><\/li><li data-term='留数定理'>留数定理 — 闭路积分等于 $2\\pi i$ 乘围道内留数之和。 <span class=glossary-ref>（第 4 章：级数展开与留数）<\/span><\/li><li data-term='辐角原理'>辐角原理 — $\\frac{1}{2\\pi i}\\oint\\frac{f&#x27;}{f}dz$ 等于零点数减极点数。 <span class=glossary-ref>（第 4 章：级数展开与留数）<\/span><\/li><li data-term='傅里叶级数'>傅里叶级数 — 周期函数展开成三角函数的级数。 <span class=glossary-ref>（第 5 章：傅里叶变换）<\/span><\/li><li data-term='傅里叶变换'>傅里叶变换 — $F(k)=\\int f(x)e^{-ikx}dx$，把空间描述换成频率描述。 <span class=glossary-ref>（第 5 章：傅里叶变换）<\/span><\/li><li data-term='卷积'>卷积 — $(f*g)(x)=\\int f(\\xi)g(x-\\xi)d\\xi$；频域里是乘法。 <span class=glossary-ref>（第 5 章：傅里叶变换）<\/span><\/li><li data-term='δ函数'>δ函数 — 单位脉冲，$\\int\\delta(x)\\phi(x)dx=\\phi(0)$。 <span class=glossary-ref>（第 5 章：傅里叶变换）<\/span><\/li><li data-term='拉普拉斯变换'>拉普拉斯变换 — $F(s)=\\int_0^{\\infty}f(t)e^{-st}dt$，用于初值问题。 <span class=glossary-ref>（第 6 章：拉普拉斯变换）<\/span><\/li><li data-term='收敛域'>收敛域 — 拉普拉斯积分收敛的 $s$ 范围，通常是右半平面。 <span class=glossary-ref>（第 6 章：拉普拉斯变换）<\/span><\/li><li data-term='传递函数'>传递函数 — 零初值下输出与输入在 $s$ 域的比值。 <span class=glossary-ref>（第 6 章：拉普拉斯变换）<\/span><\/li><li data-term='波动方程'>波动方程 — $u_{tt}=a^2\\Delta u$，双曲型，需要两个初始条件。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='热传导方程'>热传导方程 — $u_t=a^2\\Delta u$，抛物型，只需一个初始条件。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='拉普拉斯方程'>拉普拉斯方程 — $\\Delta u=0$，椭圆型，描述稳态场。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='泊松方程'>泊松方程 — $\\Delta u=-f$，有源的稳态方程。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='dirichlet 边界'>Dirichlet 边界 — 给定边界上的函数值 $u=g$。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='neumann 边界'>Neumann 边界 — 给定边界上的法向导数 $\\partial_nu=g$。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='robin 边界'>Robin 边界 — 函数值与法向导数的线性组合给定。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='定解条件'>定解条件 — 初始条件与边界条件的统称。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='适定性'>适定性 — 解存在、唯一、且连续依赖数据。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='分离变量'>分离变量 — 设乘积解把偏微分方程拆成常微分方程。 <span class=glossary-ref>（第 8 章：分离变量法）<\/span><\/li><li data-term='本征值问题'>本征值问题 — $X&#x27;&#x27;+\\lambda X=0$ 加齐次边界，只有离散的 $\\lambda$ 有非零解。 <span class=glossary-ref>（第 8 章：分离变量法）<\/span><\/li><li data-term='本征函数'>本征函数 — 对应本征值的非零解 $X_n$，构成展开基。 <span class=glossary-ref>（第 8 章：分离变量法）<\/span><\/li><li data-term='正交性'>正交性 — 不同本征值的本征函数内积为零。 <span class=glossary-ref>（第 8 章：分离变量法）<\/span><\/li><li data-term='完备性'>完备性 — 任意满足边界条件的函数都能按本征函数展开。 <span class=glossary-ref>（第 8 章：分离变量法）<\/span><\/li><li data-term='冲量定理'>冲量定理 — 受迫系统的解等于源与自由响应的卷积，也叫杜哈梅原理。 <span class=glossary-ref>（第 8 章：分离变量法）<\/span><\/li><li data-term='达朗贝尔公式'>达朗贝尔公式 — 一维波动方程用初始位移与速度写出的显式解。 <span class=glossary-ref>（第 9 章：行波法与积分变换法）<\/span><\/li><li data-term='特征线'>特征线 — 波动方程中 $x\\pm at=$ 常数的曲线，信息沿它传播。 <span class=glossary-ref>（第 9 章：行波法与积分变换法）<\/span><\/li><li data-term='依赖区域'>依赖区域 — 影响某点取值的初始数据区间 $[x-at,x+at]$。 <span class=glossary-ref>（第 9 章：行波法与积分变换法）<\/span><\/li><li data-term='延拓法'>延拓法 — 把半无界初始数据按奇偶对称延到全轴，用全无界公式求解。 <span class=glossary-ref>（第 9 章：行波法与积分变换法）<\/span><\/li><li data-term='格林函数'>格林函数 — 点源引起的场，满足 $LG=\\delta$ 与齐次边界。 <span class=glossary-ref>（第 10 章：格林函数法）<\/span><\/li><li data-term='基本解'>基本解 — 自由空间中点源的响应，不含边界修正。 <span class=glossary-ref>（第 10 章：格林函数法）<\/span><\/li><li data-term='镜像法'>镜像法 — 在区域外放虚拟源，使边界条件自动满足。 <span class=glossary-ref>（第 10 章：格林函数法）<\/span><\/li><li data-term='推迟势'>推迟势 — 源在 $t-r/a$ 时刻的作用在 $t$ 时刻到达场点。 <span class=glossary-ref>（第 10 章：格林函数法）<\/span><\/li><li data-term='勒让德多项式'>勒让德多项式 — 球坐标极角方程的有界多项式解 $P_l$。 <span class=glossary-ref>（第 11 章：勒让德多项式与球谐函数）<\/span><\/li><li data-term='母函数'>母函数 — $\\frac{1}{\\sqrt{1-2xt+t^2}}=\\sum P_l(x)t^l$。 <span class=glossary-ref>（第 11 章：勒让德多项式与球谐函数）<\/span><\/li><li data-term='罗德里格斯公式'>罗德里格斯公式 — $P_l=\\frac{1}{2^ll!}\\frac{d^l}{dx^l}(x^2-1)^l$。 <span class=glossary-ref>（第 11 章：勒让德多项式与球谐函数）<\/span><\/li><li data-term='连带勒让德函数'>连带勒让德函数 — $P_l^m$，含 $m\\ne0$ 的极角解。 <span class=glossary-ref>（第 11 章：勒让德多项式与球谐函数）<\/span><\/li><li data-term='球谐函数'>球谐函数 — 球面上的正交归一基 $Y_{lm}$。 <span class=glossary-ref>（第 11 章：勒让德多项式与球谐函数）<\/span><\/li><li data-term='贝塞尔函数'>贝塞尔函数 — 柱坐标径向方程的解 $J_\\nu$、$Y_\\nu$。 <span class=glossary-ref>（第 12 章：贝塞尔函数）<\/span><\/li><li data-term='修正贝塞尔函数'>修正贝塞尔函数 — $I_\\nu$、$K_\\nu$，描述指数增长与衰减。 <span class=glossary-ref>（第 12 章：贝塞尔函数）<\/span><\/li><li data-term='球贝塞尔函数'>球贝塞尔函数 — $j_l$、$n_l$，可用正弦余弦除以 $x$ 表示。 <span class=glossary-ref>（第 12 章：贝塞尔函数）<\/span><\/li><li data-term='泛函'>泛函 — 输入为函数、输出为数的映射。 <span class=glossary-ref>（第 13 章：变分法初步）<\/span><\/li><li data-term='变分'>变分 — 函数发生小扰动时泛函的一阶改变量 $\\delta J$。 <span class=glossary-ref>（第 13 章：变分法初步）<\/span><\/li><li data-term='欧拉–拉格朗日方程'>欧拉–拉格朗日方程 — 泛函取驻值的必要条件。 <span class=glossary-ref>（第 13 章：变分法初步）<\/span><\/li><li data-term='哈密顿原理'>哈密顿原理 — 真实运动使作用量 $\\int L\\,dt$ 取驻值。 <span class=glossary-ref>（第 13 章：变分法初步）<\/span><\/li><li data-term='瑞利–里兹法'>瑞利–里兹法 — 用试探函数代入泛函求本征值近似，结果从上方逼近。 <span class=glossary-ref>（第 13 章：变分法初步）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架 1：留数算实积分的四步<\/h2>\n<ol><li>\n选围道：有理函数补上半平面大圆弧；三角有理式令 <span class=\"katex-inline\">z=e^{i\\theta}<\/span>；含 <span class=\"katex-inline\">e^{iax}<\/span> 补上半平面。\n<\/li><li>\n找奇点：只要围道内的，边界上的要缩进。\n<\/li><li>\n算留数：一阶用极限，<span class=\"katex-inline\">m<\/span> 阶用导数公式，本性奇点展开。\n<\/li><li>\n估补路：证明补上的弧或小圆积分趋于零（或趋于某个已知值），否则不能直接等于留数结果。\n<\/ol>\n<p><strong>判断顺序<\/strong>：先看被积函数在实轴有没有极点 → 有就缩进取主值；再看大圆弧上是否衰减 → 不衰减就换围道或换方法。<\/p>\n<h2>框架 2：分离变量五步<\/h2>\n<ol><li>\n齐次化：非齐次边界先用辅助函数搬到零；非齐次方程先单独处理源项。\n<\/li><li>\n设乘积解 <span class=\"katex-inline\">u=X(x)T(t)<\/span>，代入齐次方程与齐次边界。\n<\/li><li>\n分离：两边除以 <span class=\"katex-inline\">XT<\/span>，得到&quot;只含 <span class=\"katex-inline\">x<\/span>&quot;等于&quot;只含 <span class=\"katex-inline\">t<\/span>&quot;，令其为 <span class=\"katex-inline\">-\\lambda<\/span>。\n<\/li><li>\n解本征值问题：由边界条件定 <span class=\"katex-inline\">\\lambda_n<\/span>、<span class=\"katex-inline\">X_n<\/span>；解时间方程得 <span class=\"katex-inline\">T_n<\/span>。\n<\/li><li>\n叠加并定系数：<span class=\"katex-inline\">u=\\sum T_n(t)X_n(x)<\/span>，用初始条件与正交性求系数。\n<\/ol>\n<p><strong>判断顺序<\/strong>：边界是齐次的吗 → 不是先齐次化；方程是齐次的吗 → 不是先展源项；<span class=\"katex-inline\">\\lambda<\/span> 取正还是负 → 看边界能否给出非零解。<\/p>\n<h2>框架 3：非齐次问题的三招<\/h2>\n<ul><li>\n<strong>本征函数展开<\/strong>：源项 <span class=\"katex-inline\">f(x,t)=\\sum f_n(t)X_n(x)<\/span>，每项解一个受迫常微分方程。\n<\/li><li>\n<strong>冲量定理（杜哈梅）<\/strong>：零初值受迫解 = <span class=\"katex-inline\">\\int_0^t<\/span> 源×自由响应；适合源随时间变化。\n<\/li><li>\n<strong>边界齐次化<\/strong>：<span class=\"katex-inline\">u=v+w<\/span>，<span class=\"katex-inline\">w<\/span> 取线性/多项式满足非齐次边界，<span class=\"katex-inline\">v<\/span> 满足齐次边界。\n<\/ul>\n<p><strong>选择规则<\/strong>：源项能展开且边界齐次 → 第一招；初值非零、源任意 → 第二招；边界非齐次 → 先第三招，再回到前两招。<\/p>\n<h2>框架 4：格林函数构造<\/h2>\n<ol><li>\n写点源方程 <span class=\"katex-inline\">LG=\\delta(r-r_0)<\/span>。\n<\/li><li>\n求自由空间基本解 <span class=\"katex-inline\">G_0<\/span>。\n<\/li><li>\n加边界修正：镜像法（规则边界）或本征展开（有界区域）。\n<\/li><li>\n验算边界条件：<span class=\"katex-inline\">G<\/span> 在边界上必须满足齐次条件。\n<\/li><li>\n叠加：<span class=\"katex-inline\">u=\\int G f\\,dV<\/span>（加初始条件的对应项）。\n<\/ol>\n<p><strong>选择规则<\/strong>：边界是平面/球面 → 镜像法；边界是矩形/圆柱 → 本征展开；无边界 → 只用基本解。<\/p>\n<h2>框架 5：特殊函数展开<\/h2>\n<ol><li>\n确认坐标与边界：球 → 勒让德/球谐；柱 → 贝塞尔。\n<\/li><li>\n确认边界类型：Dirichlet 用函数零点，Neumann 用导数零点。\n<\/li><li>\n写出正交关系与权重（球谐带 <span class=\"katex-inline\">\\sin\\theta<\/span>，贝塞尔带 <span class=\"katex-inline\">r<\/span>）。\n<\/li><li>\n用正交性算系数，代回级数。\n<\/li><li>\n检查有界性：球心丢 <span class=\"katex-inline\">r^{-(l+1)}<\/span>，柱轴丢 <span class=\"katex-inline\">Y_\\nu<\/span>。\n<\/ol>\n<h2>决策规则<\/h2>\n<ul><li>\n区域无界、无边界 → 行波法或傅里叶变换。\n<\/li><li>\n区域有界、边界是坐标面 → 分离变量。\n<\/li><li>\n方程有源、要算全场 → 格林函数。\n<\/li><li>\n只关心 <span class=\"katex-inline\">t&gt;0<\/span> 的初值问题 → 拉普拉斯变换。\n<\/li><li>\n边界形状复杂但共形映射能化简 → 保角映射 + 拉普拉斯方程。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>拿到方程就分离变量<\/strong>：先确认方程与边界是否齐次，否则第一步就错。\n<\/li><li>\n<strong>算留数不估补路<\/strong>：大圆弧不趋于零时，留数结果不是原积分。\n<\/li><li>\n<strong>把 <span class=\"katex-inline\">\\lambda<\/span> 当自由参数<\/strong>：本征值由边界条件决定，不能任取。\n<\/li><li>\n<strong>格林函数直接用基本解<\/strong>：不满足边界条件，加多少源都错。\n<\/li><li>\n<strong>特殊函数死记公式<\/strong>：先想它解决哪个本征方程，公式可以推。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>复变函数<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>可导判据<\/td><td><span class=\"katex-inline\">u_x=v_y<\/span>，<span class=\"katex-inline\">u_y=-v_x<\/span><\/td><\/tr><tr><td>极坐标形式<\/td><td><span class=\"katex-inline\">u_r=\\\\frac1r v_\\\\theta<\/span>，<span class=\"katex-inline\">v_r=-\\\\frac1r u_\\\\theta<\/span><\/td><\/tr><tr><td>柯西积分公式<\/td><td><span class=\"katex-inline\">f(z_0)=\\\\frac{1}{2\\\\pi i}\\\\oint_C\\\\frac{f(z)}{z-z_0}dz<\/span><\/td><\/tr><tr><td>高阶导数<\/td><td><span class=\"katex-inline\">f^{(n)}(z_0)=\\\\frac{n!}{2\\\\pi i}\\\\oint_C\\\\frac{f(z)}{(z-z_0)^{n+1}}dz<\/span><\/td><\/tr><tr><td>一阶极点留数<\/td><td><span class=\"katex-inline\">\\\\operatorname{Res}f(z_0)=\\\\lim_{z\\\\to z_0}(z-z_0)f(z)<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">m<\/span> 阶极点留数<\/td><td><span class=\"katex-inline\">\\\\frac{1}{(m-1)!}\\\\lim_{z\\\\to z_0}\\\\frac{d^{m-1}}{dz^{m-1}}[(z-z_0)^mf(z)]<\/span><\/td><\/tr><tr><td>留数定理<\/td><td><span class=\"katex-inline\">\\\\oint_C f\\\\,dz=2\\\\pi i\\\\sum\\\\operatorname{Res}<\/span><\/td><\/tr><tr><td>有理函数实积分<\/td><td>补上半平面大圆弧，取上半平面留数<\/td><\/tr><tr><td>三角有理式<\/td><td><span class=\"katex-inline\">z=e^{i\\\\theta}<\/span>，<span class=\"katex-inline\">d\\\\theta=\\\\frac{dz}{iz}<\/span>，单位圆围道<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>积分变换<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>原函数<\/th><th>傅里叶变换<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">\\\\delta(x)<\/span><\/td><td><span class=\"katex-inline\">1<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">1<\/span><\/td><td><span class=\"katex-inline\">2\\\\pi\\\\delta(k)<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">e^{-a\\\\lvert x\\\\rvert}<\/span><\/td><td><span class=\"katex-inline\">\\\\frac{2a}{a^2+k^2}<\/span><\/td><\/tr><tr><td>矩形脉冲高 <span class=\"katex-inline\">1<\/span> 宽 <span class=\"katex-inline\">2a<\/span><\/td><td><span class=\"katex-inline\">\\\\frac{2\\\\sin ka}{k}<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">e^{-x^2/(2\\\\sigma^2)}<\/span><\/td><td><span class=\"katex-inline\">\\\\sigma\\\\sqrt{2\\\\pi}e^{-\\\\sigma^2k^2/2}<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-wrap\"><table><thead><tr><th>性质<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>位移<\/td><td><span class=\"katex-inline\">f(x-x_0)\\\\leftrightarrow e^{-ikx_0}F(k)<\/span><\/td><\/tr><tr><td>缩放<\/td><td><span class=\"katex-inline\">f(ax)\\\\leftrightarrow\\\\frac{1}{\\\\lvert a\\\\rvert}F(k/a)<\/span><\/td><\/tr><tr><td>求导<\/td><td><span class=\"katex-inline\">f&#x27;\\\\leftrightarrow ikF<\/span>，<span class=\"katex-inline\">f&#x27;&#x27;\\\\leftrightarrow-k^2F<\/span><\/td><\/tr><tr><td>卷积<\/td><td><span class=\"katex-inline\">f*g\\\\leftrightarrow FG<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-wrap\"><table><thead><tr><th>拉普拉斯<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">\\\\mathcal L[t^n]<\/span><\/td><td><span class=\"katex-inline\">\\\\frac{n!}{s^{n+1}}<\/span>，<span class=\"katex-inline\">\\\\operatorname{Re}s&gt;0<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\\\mathcal L[e^{at}]<\/span><\/td><td><span class=\"katex-inline\">\\\\frac{1}{s-a}<\/span>，<span class=\"katex-inline\">\\\\operatorname{Re}s&gt;a<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\\\mathcal L[f&#x27;]<\/span><\/td><td><span class=\"katex-inline\">sF(s)-f(0)<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\\\mathcal L[f&#x27;&#x27;]<\/span><\/td><td><span class=\"katex-inline\">s^2F(s)-sf(0)-f&#x27;(0)<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>方程与定解<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>方程<\/th><th>形式<\/th><th>初始条件个数<\/th><\/tr><\/thead><tbody><tr><td>波动<\/td><td><span class=\"katex-inline\">u_{tt}=a^2\\\\Delta u<\/span><\/td><td>2<\/td><\/tr><tr><td>热传导<\/td><td><span class=\"katex-inline\">u_t=a^2\\\\Delta u<\/span><\/td><td>1<\/td><\/tr><tr><td>拉普拉斯/泊松<\/td><td><span class=\"katex-inline\">\\\\Delta u=0<\/span> 或 <span class=\"katex-inline\">\\\\Delta u=-f<\/span><\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-wrap\"><table><thead><tr><th>边界<\/th><th>形式<\/th><th>物理<\/th><\/tr><\/thead><tbody><tr><td>Dirichlet<\/td><td><span class=\"katex-inline\">u=g<\/span><\/td><td>固定端、恒温<\/td><\/tr><tr><td>Neumann<\/td><td><span class=\"katex-inline\">\\\\partial_nu=g<\/span><\/td><td>自由端、绝热<\/td><\/tr><tr><td>Robin<\/td><td><span class=\"katex-inline\">\\\\alpha u+\\\\beta\\\\partial_nu=g<\/span><\/td><td>对流换热<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>解法<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>场景<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>达朗贝尔<\/td><td><span class=\"katex-inline\">u=\\\\frac12[\\\\varphi(x-at)+\\\\varphi(x+at)]+\\\\frac{1}{2a}\\\\int_{x-at}^{x+at}\\\\psi(s)ds<\/span><\/td><\/tr><tr><td>齐次 Dirichlet 本征函数<\/td><td><span class=\"katex-inline\">\\\\sin\\\\frac{n\\\\pi x}{l}<\/span>，<span class=\"katex-inline\">\\\\lambda_n=(\\\\frac{n\\\\pi}{l})^2<\/span><\/td><\/tr><tr><td>齐次 Neumann 本征函数<\/td><td><span class=\"katex-inline\">\\\\cos\\\\frac{n\\\\pi x}{l}<\/span>，<span class=\"katex-inline\">n=0,1,2\\\\dots<\/span><\/td><\/tr><tr><td>三维泊松基本解<\/td><td><span class=\"katex-inline\">\\\\frac{1}{4\\\\pi r}<\/span><\/td><\/tr><tr><td>波动推迟格林函数<\/td><td><span class=\"katex-inline\">\\\\frac{\\\\delta(t-t&#x27;-r/a)}{4\\\\pi r}<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>特殊函数<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>函数<\/th><th>关键性质<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">P_l<\/span><\/td><td><span class=\"katex-inline\">\\\\int_{-1}^1P_lP_m=\\\\frac{2}{2l+1}\\\\delta_{lm}<\/span>，<span class=\"katex-inline\">P_l(1)=1<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">P_0,P_1,P_2<\/span><\/td><td><span class=\"katex-inline\">1<\/span>，<span class=\"katex-inline\">x<\/span>，<span class=\"katex-inline\">\\\\frac{3x^2-1}{2}<\/span><\/td><\/tr><tr><td>勒让德递推<\/td><td><span class=\"katex-inline\">(l+1)P_{l+1}=(2l+1)xP_l-lP_{l-1}<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">J_\\\\nu<\/span><\/td><td><span class=\"katex-inline\">J_0(0)=1<\/span>，<span class=\"katex-inline\">Y_\\\\nu(0)=-\\\\infty<\/span><\/td><\/tr><tr><td>贝塞尔递推<\/td><td><span class=\"katex-inline\">J_{\\\\nu-1}+J_{\\\\nu+1}=\\\\frac{2\\\\nu}{x}J_\\\\nu<\/span><\/td><\/tr><tr><td>贝塞尔正交<\/td><td><span class=\"katex-inline\">\\\\int_0^aJ_\\\\nu(\\\\mu_mr)J_\\\\nu(\\\\mu_nr)r\\\\,dr=0<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">j_0<\/span>，<span class=\"katex-inline\">n_0<\/span><\/td><td><span class=\"katex-inline\">\\\\frac{\\\\sin x}{x}<\/span>，<span class=\"katex-inline\">-\\\\frac{\\\\cos x}{x}<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>变分法<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>欧拉–拉格朗日<\/td><td><span class=\"katex-inline\">\\\\frac{d}{dx}F_{y&#x27;}-F_y=0<\/span><\/td><\/tr><tr><td>不显含 <span class=\"katex-inline\">x<\/span><\/td><td><span class=\"katex-inline\">F-y&#x27;F_{y&#x27;}=C<\/span><\/td><\/tr><tr><td>不显含 <span class=\"katex-inline\">y<\/span><\/td><td><span class=\"katex-inline\">F_{y&#x27;}=C<\/span><\/td><\/tr><tr><td>哈密顿原理<\/td><td><span class=\"katex-inline\">\\\\delta\\\\int L\\\\,dt=0<\/span><\/td><\/tr><tr><td>瑞利商<\/td><td><span class=\"katex-inline\">\\\\lambda=\\\\frac{\\\\int\\\\lvert\\\\nabla u\\\\rvert^2}{\\\\int u^2}<\/span>，上界<\/td><\/tr><\/tbody><\/table><\/div>"}};

/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof katex === 'undefined') return;
  if(typeof katex !== 'undefined'){ doRenderMath(); return; }
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
  tryJs();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

/* ---------- 测验（带倒推） ---------- */
function initQuizzes(rid){
  $$('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        i.parentElement.style.color = (Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) ? 'var(--ok)' : 'var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 答错时：倒推前置 + 误解卡片 + 掌握度更新
      if(!correct){
        let remedy = item.querySelector('.quiz-remedy');
        if(!remedy){ remedy = document.createElement('div'); remedy.className='quiz-remedy'; item.appendChild(remedy); }
        const chain = traceBack(item.dataset.concept, item.dataset.chapter);
        if(chain.length > 1){
          const links = chain.slice(1).map(({node,kind})=>{
            const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
            return `<a href="${href}">${esc(node.title||node.id)}</a>`;
          }).join(' → ');
          remedy.innerHTML = '🔍 可能的根因（沿依赖链回溯）：' + links;
        }
        // 误解卡片：如果选错的选项标注了 misconceptionId
        const checked = item.querySelector('input:checked');
        const misId = checked ? checked.dataset.misconception : '';
        if(misId){
          const mis = (manifest.misconceptions||[]).find(m=>m.id===misId);
          if(mis){
            let misCard = item.querySelector('.misconception-card');
            if(!misCard){ misCard = document.createElement('div'); misCard.className='misconception-card'; item.appendChild(misCard); }
            misCard.innerHTML = `<b>⚠ 常见误解</b><br>你选了「${esc(mis.wrong)}」——${esc(mis.correction)}`;
          }
        }
        // 掌握度下降
        updateMastery(item.dataset.concept, -0.15);
      } else {
        updateMastery(item.dataset.concept, +0.15);
      }
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  if(typeof vis !== 'undefined'){ networkLoaded = true; cb(); return; }
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE) { cb(); return; }
  const urls = [
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js',
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    const timer = setTimeout(() => { s.onload = null; s.onerror = null; s.remove(); tryNext(); }, 4000);
    s.onload = () => { clearTimeout(timer); networkLoaded = true; cb(); };
    s.onerror = () => { clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库未加载：离线构建请加 <code>--offline all</code>，或联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

/* ---------- 诊断模式 ---------- */
let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

function getMastery(cid){
  if(!cid) return 0.5;
  const m = (state.mastery||{})[cid];
  return m !== undefined ? m : 0.3;
}
function updateMastery(cid, delta){
  if(!cid) return;
  if(!state.mastery) state.mastery = {};
  const cur = state.mastery[cid] !== undefined ? state.mastery[cid] : 0.3;
  state.mastery[cid] = Math.max(0, Math.min(1, cur + delta));
  store.set('mastery', state.mastery);
}
function masteryBar(cid){
  const v = Math.round(getMastery(cid)*100);
  return `<div class="mastery-bar"><div style="width:${v}%"></div></div><span class="mastery-label">掌握度 ${v}%</span>`;
}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);
});
function searchHref(id){
  const map = {'__path__':'#/path','__diagnosis__':'#/diagnosis','__graph__':'#/graph',
               '__cards__':'#/cards','__glossary__':'#/glossary','__patterns__':'#/patterns',
               '__cheatsheet__':'#/cheatsheet'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '#/quiz/'+id.replace('__quiz_','').replace(/__$/,'');
  if(id.startsWith('__')) return '';
  return '#/'+id;
}
function searchLabel(id){
  if((manifest.chapters||[]).some(c=>c.id===id)) return '章节：'+id;
  if((manifest.concepts||[]).some(c=>c.id===id)) return '概念：'+id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')) return '测验';
  return id;
}
function pageTitle(id){
  const ch = (manifest.chapters||[]).find(c=>c.id===id);
  if(ch) return ch.title || id;
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp) return cp.title || id;
  const map = {'__path__':'学习路径','__diagnosis__':'诊断测试','__graph__':'知识图谱','__cards__':'抽认卡',
               '__glossary__':'术语表','__patterns__':'模式库','__cheatsheet__':'速查表'};
  if(map[id]) return map[id];
  if(id.startsWith('__quiz_')){
    const q = (manifest.quizzes||[]).find(x=>'__quiz_'+x.id===id);
    return q ? '测验 · '+String(q.question||'').slice(0,14) : '测验';
  }
  return id;
}
function chapOf(id){
  const chs = manifest.chapters || [];
  const ci = chs.findIndex(c=>c.id===id);
  if(ci >= 0) return {key:'ch:'+id, label:chs[ci].title||id, order:ci};
  const cp = (manifest.concepts||[]).find(c=>c.id===id);
  if(cp){
    const chId = (cp.chapterIds||[])[0];
    const i = chs.findIndex(c=>c.id===chId);
    if(i >= 0) return {key:'ch:'+chId, label:chs[i].title||chId, order:i};
    return {key:'zz', label:'未归入章节', order:900};
  }
  return {key:'tools', label:'术语与工具页', order:950, ref:true};
}
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    const href = searchHref(id);
    if(!href) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, href, text, label:pageTitle(id), chap:chapOf(id)});
  });
  return searchIndex;
}
function synOf(t){
  const out = [];
  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }
  return out.slice(0,6);
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  if(typeof ZHISHU_OFFLINE !== 'undefined' && ZHISHU_OFFLINE && typeof mermaid === 'undefined') return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  if(typeof mermaid !== 'undefined'){ boot(); return; }
  const urls=['https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js',
              'https://registry.npmmirror.com/mermaid/10.9.1/files/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js'];
  let ui=0, done=false;
  const tryNext=()=>{
    if(done || ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    const timer=setTimeout(()=>{ if(done) return; s.onload=null; s.onerror=null; s.remove(); tryNext(); }, 4000);
    s.onload=()=>{ done=true; clearTimeout(timer); boot(); };
    s.onerror=()=>{ clearTimeout(timer); s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

<script id="zs-visual-init">
(function(){
  try{
    var B=document.body, H=document.documentElement;
    if(!B.dataset.theme && !H.dataset.theme) B.dataset.theme='dark';
    var EMOJI=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu;
    var scope=document.querySelectorAll('header, .topbar, .topbar-fixed, #topbar, .sidebar, .tabs, .hdr-right, .card-actions, .card-controls, .section-title, .card .icon, .icon-label');
    for(var i=0;i<scope.length;i++){
      var w=document.createTreeWalker(scope[i],NodeFilter.SHOW_TEXT,null,false), n;
      while(n=w.nextNode()){
        if(EMOJI.test(n.nodeValue)){
          n.nodeValue=n.nodeValue.replace(EMOJI,'').replace(/[ \t]+/g,' ').replace(/^ | $/g,'');
        }
      }
    }
    var btn=document.getElementById('theme-btn')||document.getElementById('theme')||document.getElementById('themeToggle');
    function label(){
      if(!btn) return;
      var light=B.dataset.theme==='light'||H.getAttribute('data-theme')==='light'||B.dataset.theme==='';
      if(btn.textContent.trim()===''||/浅色|深色/.test(btn.textContent)) btn.textContent=light?'深色':'浅色';
    }
    label();
    if(btn){
      new MutationObserver(label).observe(B,{attributes:true,attributeFilter:['data-theme']});
      new MutationObserver(label).observe(H,{attributes:true,attributeFilter:['data-theme']});
      btn.addEventListener('click',function(){setTimeout(label,0);},true);
    }
  }catch(e){}
})();
</script>
