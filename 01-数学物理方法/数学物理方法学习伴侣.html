>柯西积分定理<\/a><\/span><\/div><h1>柯西积分公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章 | <strong>前置<\/strong>：c302\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">f<\/span> 在简单闭围道 <span class=\"katex-inline\">C<\/span> 内及上解析，<span class=\"katex-inline\">z_0<\/span> 在内部，则 <span class=\"katex-inline\">f(z_0)=\\frac{1}{2\\pi i}\\oint_C\\frac{f(z)}{z-z_0}dz<\/span>。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它说&quot;解析函数由边界值完全决定&quot;，也是把函数值变成积分的工具。第 4 章的泰勒系数就是它的高阶版本。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n平均值性质：<span class=\"katex-inline\">f(z_0)<\/span> 等于 <span class=\"katex-inline\">f<\/span> 在任意以 <span class=\"katex-inline\">z_0<\/span> 为心的小圆上的平均值。\n<\/li><li>\n围道方向取逆时针；<span class=\"katex-inline\">z_0<\/span> 在外部时积分为零，不是公式。\n<\/li><li>\n被积函数 <span class=\"katex-inline\">\\frac{f(z)}{z-z_0}<\/span> 在 <span class=\"katex-inline\">z_0<\/span> 有一阶极点，留数就是 <span class=\"katex-inline\">f(z_0)<\/span>——第 4 章会把它统一。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把 <span class=\"katex-inline\">z_0<\/span> 在外部也代公式，得到一个不为零的结果。外部积分是零。\n<\/li><li>\n围道上有奇点还直接用。要先挖小圆绕开。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c302。后续：c304、c305、c401。<\/p>", "kind": "concept", "title": "柯西积分公式"}, "c304": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c303\">柯西积分公式<\/a><\/span><\/div><h1>高阶导数公式与刘维尔定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章 | <strong>前置<\/strong>：c303\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>解析函数的 <span class=\"katex-inline\">n<\/span> 阶导数也能写成围道积分：<span class=\"katex-inline\">f^{(n)}(z_0)=\\frac{n!}{2\\pi i}\\oint_C\\frac{f(z)}{(z-z_0)^{n+1}}dz<\/span>；由此可证有界整函数必为常数（刘维尔定理）。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是柯西公式的微分版本，直接给出泰勒系数 <span class=\"katex-inline\">a_n=f^{(n)}(z_0)/n!<\/span>，是第 4 章级数展开的桥梁。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n分母是 <span class=\"katex-inline\">(z-z_0)^{n+1}<\/span>，分子带 <span class=\"katex-inline\">n!<\/span>，两个都容易漏。\n<\/li><li>\n刘维尔定理：在全平面解析且有界的函数只能是常数。\n<\/li><li>\n推论（代数基本定理）：非常数多项式必有复根。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把高阶导数公式当成&quot;对柯西公式求导 <span class=\"katex-inline\">n<\/span> 次&quot;的近似。它是精确等式，但分母幂次要跟着变。\n<\/li><li>\n以为刘维尔定理对&quot;有界区域解析&quot;也成立。必须是全平面（整函数）。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c303。后续：c401、c402。<\/p>", "kind": "concept", "title": "高阶导数公式与刘维尔定理"}, "c305": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c303\">柯西积分公式<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c203\">调和函数与共轭调和函数<\/a><\/span><\/div><h1>最大模原理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章 | <strong>前置<\/strong>：c303、c203\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>非常数解析函数的模，在有界区域内不可能于内部取到最大值；最大值只能出现在边界上。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是解析函数&quot;刚性&quot;的又一个表现，常用来证明唯一性：两个解析函数若在边界上相等，就在内部处处相等。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n有界区域上：<span class=\"katex-inline\">|f|<\/span> 的最大值在边界取得。\n<\/li><li>\n若 <span class=\"katex-inline\">f<\/span> 在区域内无零点，则 <span class=\"katex-inline\">1/f<\/span> 解析，最小模原理同样成立。\n<\/li><li>\n常数函数是唯一例外，证明时必须先排除。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为它对任意连续函数成立。实函数的 <span class=\"katex-inline\">|x|<\/span> 在 <span class=\"katex-inline\">[-1,1]<\/span> 内部就取到最大——差在&quot;解析&quot;。\n<\/li><li>\n把&quot;最大模在边界&quot;理解成&quot;边界上每点都可能是最大&quot;，实际只需至少一个点。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c303、c203。后续：c704（唯一性）、c1002（格林函数唯一性）。<\/p>", "kind": "concept", "title": "最大模原理"}, "c401": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c201\">复导数与解析函数<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c303\">柯西积分公式<\/a><\/span><\/div><h1>泰勒级数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章 | <strong>前置<\/strong>：c201、c303\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>解析函数在 <span class=\"katex-inline\">z_0<\/span> 的邻域内可以唯一展开成 <span class=\"katex-inline\">\\sum_{n=0}^{\\infty}\\frac{f^{(n)}(z_0)}{n!}(z-z_0)^n<\/span>，收敛半径等于到最近奇点的距离。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是洛朗级数的特例（没有负幂项），也是第 5、6 章各种变换公式的推导基础。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n常用展开：<span class=\"katex-inline\">e^z=\\sum z^n/n!<\/span>、<span class=\"katex-inline\">\\sin z=\\sum(-1)^n z^{2n+1}/(2n+1)!<\/span>、<span class=\"katex-inline\">\\frac{1}{1-z}=\\sum z^n<\/span>（<span class=\"katex-inline\">|z|&lt;1<\/span>）。\n<\/li><li>\n收敛半径由最近奇点决定；在收敛圆内可以逐项求导、积分。\n<\/li><li>\n泰勒展开唯一；不同方法（直接求导、已知展开代换）得到同一个级数。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为收敛半径等于&quot;函数定义域的半径&quot;。定义域可以更大，奇点才是障碍。\n<\/li><li>\n在收敛圆外硬套展开式。级数发散，代进去没有意义。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c201、c303。后续：c402、c403。<\/p>", "kind": "concept", "title": "泰勒级数"}, "c402": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c401\">泰勒级数<\/a><\/span><\/div><h1>洛朗级数与孤立奇点分类<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章 | <strong>前置<\/strong>：c401\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在环形区域 <span class=\"katex-inline\">r&lt;|z-z_0|&lt;R<\/span> 内解析的函数可展开成 <span class=\"katex-inline\">\\sum_{n=-\\infty}^{\\infty}a_n(z-z_0)^n<\/span>，允许负幂项；按负幂项的多少，孤立奇点分为可去奇点、极点、本性奇点。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是第 4 章的主工具：留数就是洛朗系数 <span class=\"katex-inline\">a_{-1}<\/span>。没有洛朗展开，本性奇点的留数无从谈起。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n系数 <span class=\"katex-inline\">a_n=\\frac{1}{2\\pi i}\\oint_C\\frac{f(z)}{(z-z_0)^{n+1}}dz<\/span>，<span class=\"katex-inline\">C<\/span> 是环内绕 <span class=\"katex-inline\">z_0<\/span> 的任意闭路。\n<\/li><li>\n无负幂项 ⇒ 可去奇点；有限个负幂项，最低次为 <span class=\"katex-inline\">-m<\/span> ⇒ <span class=\"katex-inline\">m<\/span> 阶极点；无限多负幂项 ⇒ 本性奇点。\n<\/li><li>\n同一函数在不同环域展开不同，例如 <span class=\"katex-inline\">\\frac{1}{z(z-1)}<\/span> 在 <span class=\"katex-inline\">0&lt;|z|&lt;1<\/span> 与 <span class=\"katex-inline\">|z|&gt;1<\/span> 的级数不一样。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为洛朗展开要求在 <span class=\"katex-inline\">z_0<\/span> 解析。恰恰是 <span class=\"katex-inline\">z_0<\/span> 不解析时才需要它。\n<\/li><li>\n用一个环域的展开去判断另一个区域的奇点行为。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c401。后续：c403、c405。<\/p>", "kind": "concept", "title": "洛朗级数与孤立奇点分类"}, "c403": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c402\">洛朗级数与孤立奇点分类<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c302\">柯西积分定理<\/a><\/span><\/div><h1>留数与留数定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章 | <strong>前置<\/strong>：c402、c302\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">f<\/span> 在孤立奇点 <span class=\"katex-inline\">z_0<\/span> 的洛朗展开中 <span class=\"katex-inline\">\\frac{1}{z-z_0}<\/span> 项的系数 <span class=\"katex-inline\">a_{-1}<\/span> 叫留数；闭路积分等于 <span class=\"katex-inline\">2\\pi i<\/span> 乘以围道内所有奇点留数之和。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>整门课最常用的计算工具。实积分、傅里叶逆变换、拉普拉斯逆变换，最后都归结为算留数。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n一阶极点：<span class=\"katex-inline\">\\operatorname{Res}f(z_0)=\\lim_{z\\to z_0}(z-z_0)f(z)<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">m<\/span> 阶极点：<span class=\"katex-inline\">\\frac{1}{(m-1)!}\\lim_{z\\to z_0}\\frac{d^{m-1}}{dz^{m-1}}[(z-z_0)^m f(z)]<\/span>。\n<\/li><li>\n本性奇点：只能展开找 <span class=\"katex-inline\">a_{-1}<\/span>，没有求极限的捷径。\n<\/li><li>\n围道方向必须是逆时针；顺时针差一个负号。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n对本性奇点套极点的极限公式。<span class=\"katex-inline\">\\sin(1/z)<\/span> 在 <span class=\"katex-inline\">0<\/span> 处极限不存在，公式给出错误结果。\n<\/li><li>\n忘记乘 <span class=\"katex-inline\">2\\pi i<\/span>，或把 <span class=\"katex-inline\">2\\pi i<\/span> 写成 <span class=\"katex-inline\">2\\pi<\/span>。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c402、c302。后续：c404、c405、c603。<\/p>", "kind": "concept", "title": "留数与留数定理"}, "c404": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c403\">留数与留数定理<\/a><\/span><\/div><h1>用留数计算实积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章 | <strong>前置<\/strong>：c403\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把实轴上的积分补成复平面上的闭路，用留数定理算，再证明补上的部分趋于零；三类标准题型对应三种补法。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>复变部分对物理最直接的贡献：很多实积分没有初等原函数，留数法却能给出闭式结果。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n有理函数 <span class=\"katex-inline\">\\int_{-\\infty}^{\\infty}R(x)dx<\/span>：补上半平面大圆弧，取上半平面留数。\n<\/li><li>\n三角有理式 <span class=\"katex-inline\">\\int_0^{2\\pi}R(\\cos\\theta,\\sin\\theta)d\\theta<\/span>：令 <span class=\"katex-inline\">z=e^{i\\theta}<\/span>，化为单位圆围道。\n<\/li><li>\n含 <span class=\"katex-inline\">e^{iax}<\/span>：补上半平面并用 Jordan 引理；实轴上有极点要缩进，取主值。\n<\/li><li>\n大圆弧估计：<span class=\"katex-inline\">|\\int_{C_R}f dz|\\le\\pi R\\max|f|<\/span>，必须证明它趋于零。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n补了圆弧却不算它是否趋于零。有些被积函数在大圆弧上不衰减，直接补会得到错值。\n<\/li><li>\n把实轴上的极点当成围道内的奇点。它在边界上，要取半留数（缩进）。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c403。后续：c405、c502（逆变换）。<\/p>", "kind": "concept", "title": "用留数计算实积分"}, "c405": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c103\">多值函数与分支切割<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c403\">留数与留数定理<\/a><\/span><\/div><h1>支点、多值积分与辐角原理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4 章 | <strong>前置<\/strong>：c103、c403\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>被积函数含 <span class=\"katex-inline\">\\ln z<\/span>、<span class=\"katex-inline\">z^\\alpha<\/span> 时，绕支点一圈函数值不复原，闭路积分要改用键孔围道；辐角原理则用 <span class=\"katex-inline\">\\frac{1}{2\\pi i}\\oint\\frac{f&#x27;}{f}dz<\/span> 数零点与极点之差。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是留数技术的边界情形：处理不了支点，就有一大类积分算不出来。第 5 章的某些逆变换会碰到。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n键孔围道：沿正实轴上下两侧走，绕支点小圆，两侧积分差一个因子 <span class=\"katex-inline\">1-e^{2\\pi i\\alpha}<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\int_0^\\infty\\frac{x^{\\alpha-1}}{1+x}dx=\\frac{\\pi}{\\sin\\pi\\alpha}<\/span> 是标准结果。\n<\/li><li>\n辐角原理：<span class=\"katex-inline\">\\frac{1}{2\\pi i}\\oint_C\\frac{f&#x27;(z)}{f(z)}dz=N-P<\/span>；Rouché 定理用它比较两个函数。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n对含支点的函数直接闭合围道用留数定理。绕一圈多出的相位项必须算进去。\n<\/li><li>\n把辐角原理当成&quot;数极点&quot;，它给的是零点数减极点数，要分别知道一个才能定另一个。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c103、c403。后续：c603（逆变换）、c1004（本征展开的复变版本）。<\/p>", "kind": "concept", "title": "支点、多值积分与辐角原理"}, "c501": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c003\">无穷级数与收敛半径<\/a><\/span><\/div><h1>傅里叶级数与频谱<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 5 章 | <strong>前置<\/strong>：c003\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>周期为 <span class=\"katex-inline\">2l<\/span> 的函数可以展开成 <span class=\"katex-inline\">\\frac{a_0}{2}+\\sum_{n=1}^{\\infty}(a_n\\cos\\frac{n\\pi x}{l}+b_n\\sin\\frac{n\\pi x}{l})<\/span>，系数由积分给出；每个 <span class=\"katex-inline\">n<\/span> 对应一个频率成分。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>傅里叶变换是它让周期趋于无穷的极限。理解离散频谱如何变成连续频谱，是第 5 章的主线。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n系数：<span class=\"katex-inline\">a_n=\\frac1l\\int_{-l}^{l}f\\cos\\frac{n\\pi x}{l}dx<\/span>，<span class=\"katex-inline\">b_n<\/span> 同理换 <span class=\"katex-inline\">\\sin<\/span>。\n<\/li><li>\n狄利克雷条件下级数收敛到 <span class=\"katex-inline\">f<\/span> 的连续点；间断点收敛到左右极限平均。\n<\/li><li>\n帕塞瓦尔等式：能量在时域与频域守恒。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为级数处处逐点收敛到原函数。间断点处收敛到中点，还会出现吉布斯振荡。\n<\/li><li>\n把频率写成 <span class=\"katex-inline\">n<\/span> 而忘了它对应 <span class=\"katex-inline\">n\\pi/l<\/span>，周期一变，频率全变。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c003。后续：c502、c503。<\/p>", "kind": "concept", "title": "傅里叶级数与频谱"}, "c502": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c501\">傅里叶级数与频谱<\/a><\/span><\/div><h1>傅里叶变换与逆变换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5、9 章 | <strong>前置<\/strong>：c501\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">F(k)=\\int_{-\\infty}^{\\infty}f(x)e^{-ikx}dx<\/span> 是傅里叶变换，<span class=\"katex-inline\">f(x)=\\frac{1}{2\\pi}\\int_{-\\infty}^{\\infty}F(k)e^{ikx}dk<\/span> 是逆变换；两者把空间描述与频率描述互换。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>第 5 章的主角，第 9 章解半无界问题的工具，第 10 章格林函数的频域形式。它把微分方程变成代数方程。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n存在条件：<span class=\"katex-inline\">f<\/span> 绝对可积（更一般地可在广义函数意义下定义）。\n<\/li><li>\n常用变换对：<span class=\"katex-inline\">e^{-a|x|}\\leftrightarrow\\frac{2a}{a^2+k^2}<\/span>；矩形脉冲 <span class=\"katex-inline\">\\leftrightarrow<\/span> sinc；高斯 <span class=\"katex-inline\">\\leftrightarrow<\/span> 高斯。\n<\/li><li>\n频谱的物理意义：<span class=\"katex-inline\">|F(k)|<\/span> 是频率 <span class=\"katex-inline\">k<\/span> 的成分强度。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n三种符号约定混用（<span class=\"katex-inline\">2\\pi<\/span> 放正变换、逆变换或平分）。本系统统一：正变换带 <span class=\"katex-inline\">e^{-ikx}<\/span>，逆变换带 <span class=\"katex-inline\">\\frac{1}{2\\pi}<\/span>。\n<\/li><li>\n以为 <span class=\"katex-inline\">F(k)<\/span> 一定是实函数。只有 <span class=\"katex-inline\">f<\/span> 为偶函数时才实。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c501。后续：c503、c504、c505、c904。<\/p>", "kind": "concept", "title": "傅里叶变换与逆变换"}, "c503": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c502\">傅里叶变换与逆变换<\/a><\/span><\/div><h1>傅里叶变换的性质与卷积定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5、9 章 | <strong>前置<\/strong>：c502\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>位移、缩放、求导、卷积这四条性质，决定了傅里叶变换能不能用来解方程；其中最重要的是：求导变乘 <span class=\"katex-inline\">ik<\/span>，卷积变乘法。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>这是&quot;用变换解方程&quot;的全部技术支撑。没有卷积定理，热传导初值问题写不出高斯核。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n位移：<span class=\"katex-inline\">f(x-x_0)\\leftrightarrow e^{-ikx_0}F(k)<\/span>。\n<\/li><li>\n缩放：<span class=\"katex-inline\">f(ax)\\leftrightarrow\\frac{1}{|a|}F(k/a)<\/span>。\n<\/li><li>\n求导：<span class=\"katex-inline\">f&#x27;(x)\\leftrightarrow ikF(k)<\/span>；<span class=\"katex-inline\">f&#x27;&#x27;\\leftrightarrow(ik)^2F=-k^2F<\/span>。\n<\/li><li>\n卷积：<span class=\"katex-inline\">(f*g)(x)=\\int f(\\xi)g(x-\\xi)d\\xi\\leftrightarrow F(k)G(k)<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把卷积当成逐点相乘。卷积要先翻转再平移再积分，频域里才是乘法。\n<\/li><li>\n缩放性质漏掉 <span class=\"katex-inline\">1/|a|<\/span>，幅度整体错。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c502。后续：c505、c904、c1003。<\/p>", "kind": "concept", "title": "傅里叶变换的性质与卷积定理"}, "c504": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c502\">傅里叶变换与逆变换<\/a><\/span><\/div><h1>δ函数及其傅里叶表示<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5、8、10 章 | <strong>前置<\/strong>：c502\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">\\delta(x)<\/span> 是单位脉冲：<span class=\"katex-inline\">\\int\\delta(x)\\phi(x)dx=\\phi(0)<\/span> 对任意连续 <span class=\"katex-inline\">\\phi<\/span> 成立；它的傅里叶变换是常数 <span class=\"katex-inline\">1<\/span>。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>点源、点电荷、瞬时冲量的数学写法。第 8 章的非齐次项、第 10 章的格林函数都靠它。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n筛选性质：<span class=\"katex-inline\">\\int\\delta(x-x_0)\\phi(x)dx=\\phi(x_0)<\/span>。\n<\/li><li>\n缩放：<span class=\"katex-inline\">\\delta(ax)=\\frac{1}{|a|}\\delta(x)<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\mathcal F[\\delta]=1<\/span>：所有频率等权，这就是&quot;白噪声&quot;的来源。\n<\/li><li>\n与阶跃 <span class=\"katex-inline\">H(x)<\/span> 的关系：<span class=\"katex-inline\">H&#x27;(x)=\\delta(x)<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把 <span class=\"katex-inline\">\\delta<\/span> 当普通函数问&quot;<span class=\"katex-inline\">\\delta(0)<\/span> 等于多少&quot;。它只在积分号内有定义。\n<\/li><li>\n忘记缩放因子 <span class=\"katex-inline\">1/|a|<\/span>，变量替换后系数错。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c502。后续：c803、c1001、c1003。<\/p>", "kind": "concept", "title": "δ函数及其傅里叶表示"}, "c505": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c502\">傅里叶变换与逆变换<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c503\">傅里叶变换的性质与卷积定理<\/a><\/span><\/div><h1>用傅里叶变换解偏微分方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5、9 章 | <strong>前置<\/strong>：c502、c503\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>对方程的空间变量做傅里叶变换，<span class=\"katex-inline\">u_{xx}<\/span> 变成 <span class=\"katex-inline\">-k^2U<\/span>，偏微分方程降为关于 <span class=\"katex-inline\">t<\/span> 的常微分方程，解完再逆变换。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>这是&quot;变换解法&quot;的第一个完整范本。第 9 章把它用到半无界问题，第 6 章换成拉普拉斯变换再走一遍。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n热传导初值问题：<span class=\"katex-inline\">U_t=-a^2k^2U<\/span> ⇒ <span class=\"katex-inline\">U(k,t)=U_0(k)e^{-a^2k^2t}<\/span> ⇒ 逆变换是高斯核与初值的卷积。\n<\/li><li>\n波动方程：<span class=\"katex-inline\">U_{tt}=-a^2k^2U<\/span>，解中出现 <span class=\"katex-inline\">\\cos akt<\/span>、<span class=\"katex-inline\">\\sin akt<\/span>，对应左右行波。\n<\/li><li>\n变换只对方程中的无界变量做；有界方向的边界条件要另想办法。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n对时间 <span class=\"katex-inline\">t<\/span> 也做傅里叶变换，结果初值条件无处安放。时间方向一般用拉普拉斯或保留。\n<\/li><li>\n变换后忘记逆变换，把频域解当最终答案。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c502、c503。后续：c604、c904、c1003。<\/p>", "kind": "concept", "title": "用傅里叶变换解偏微分方程"}, "c601": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c002\">线性常微分方程与特征根法<\/a><\/span><\/div><h1>拉普拉斯变换与收敛域<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 6 章 | <strong>前置<\/strong>：c002\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">F(s)=\\int_0^{\\infty}f(t)e^{-st}dt<\/span> 是拉普拉斯变换，<span class=\"katex-inline\">s=\\sigma+i\\omega<\/span>；积分收敛的 <span class=\"katex-inline\">\\sigma<\/span> 范围叫收敛域，通常是一个右半平面。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>专为初值问题设计：只取 <span class=\"katex-inline\">t&gt;0<\/span>，用 <span class=\"katex-inline\">e^{-\\sigma t}<\/span> 压住增长。第 9 章、第 6 章的解方程流程都以它为核心。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n<span class=\"katex-inline\">f(t)=e^{at}<\/span> 的变换是 <span class=\"katex-inline\">\\frac{1}{s-a}<\/span>，收敛域 <span class=\"katex-inline\">\\operatorname{Re}s&gt;a<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">f(t)=t^n<\/span> 的变换是 <span class=\"katex-inline\">\\frac{n!}{s^{n+1}}<\/span>，收敛域 <span class=\"katex-inline\">\\operatorname{Re}s&gt;0<\/span>。\n<\/li><li>\n收敛域必须和像函数一起写；同一个 <span class=\"katex-inline\">F(s)<\/span> 配不同收敛域，对应不同的原函数。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n只写 <span class=\"katex-inline\">F(s)<\/span> 不写收敛域。逆变换会因此不唯一。\n<\/li><li>\n以为所有函数都能变换。增长快于指数的函数（如 <span class=\"katex-inline\">e^{t^2}<\/span>）没有拉普拉斯变换。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c002。后续：c602、c603、c904。<\/p>", "kind": "concept", "title": "拉普拉斯变换与收敛域"}, "c602": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c601\">拉普拉斯变换与收敛域<\/a><\/span><\/div><h1>拉普拉斯变换的性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章 | <strong>前置<\/strong>：c601\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>线性、位移、导数、积分、初值定理、终值定理这六条性质，让拉普拉斯变换能把微分方程整体搬进 <span class=\"katex-inline\">s<\/span> 域。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它们是&quot;解初值问题&quot;的操作手册。特别是导数性质，把初始条件自动带进代数方程。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n<span class=\"katex-inline\">\\mathcal L[f&#x27;]=sF(s)-f(0)<\/span>；<span class=\"katex-inline\">\\mathcal L[f&#x27;&#x27;]=s^2F(s)-sf(0)-f&#x27;(0)<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\mathcal L[\\int_0^t f(\\tau)d\\tau]=\\frac{F(s)}{s}<\/span>。\n<\/li><li>\n位移：<span class=\"katex-inline\">\\mathcal L[e^{at}f(t)]=F(s-a)<\/span>。\n<\/li><li>\n初值定理 <span class=\"katex-inline\">f(0^+)=\\lim_{s\\to\\infty}sF(s)<\/span>；终值定理 <span class=\"katex-inline\">f(\\infty)=\\lim_{s\\to0}sF(s)<\/span>（极点须在左半平面）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n导数性质漏掉 <span class=\"katex-inline\">f(0)<\/span> 或 <span class=\"katex-inline\">f&#x27;(0)<\/span>。这是初值问题里最容易出错的一步。\n<\/li><li>\n无条件使用终值定理。极点在虚轴或右半平面时，终值不存在。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c601。后续：c603、c604。<\/p>", "kind": "concept", "title": "拉普拉斯变换的性质"}, "c603": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c602\">拉普拉斯变换的性质<\/a><\/span><\/div><h1>逆变换：部分分式与卷积<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章 | <strong>前置<\/strong>：c602\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>逆变换是复平面上的 Bromwich 积分 <span class=\"katex-inline\">\\frac{1}{2\\pi i}\\int_{\\sigma-i\\infty}^{\\sigma+i\\infty}F(s)e^{st}ds<\/span>；实际计算靠拆部分分式或查表，本质是算各极点的留数。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>第 4 章留数的直接应用。极点位置决定时间域里是衰减、增长还是振荡。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n一阶极点 <span class=\"katex-inline\">s=a<\/span> 贡献 <span class=\"katex-inline\">A e^{at}<\/span>；<span class=\"katex-inline\">m<\/span> 阶极点贡献 <span class=\"katex-inline\">t^{m-1}e^{at}<\/span> 的多项式。\n<\/li><li>\n共轭复极点 <span class=\"katex-inline\">\\sigma\\pm i\\omega<\/span> 给 <span class=\"katex-inline\">e^{\\sigma t}\\cos\\omega t<\/span>、<span class=\"katex-inline\">e^{\\sigma t}\\sin\\omega t<\/span>。\n<\/li><li>\n卷积：<span class=\"katex-inline\">\\mathcal L^{-1}[F(s)G(s)]=(f*g)(t)<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n部分分式拆重极点时只设一项 <span class=\"katex-inline\">A/(s-a)<\/span>。<span class=\"katex-inline\">m<\/span> 阶极点要设到 <span class=\"katex-inline\">(s-a)^{-m}<\/span>。\n<\/li><li>\n忘记收敛域，把右边信号解成左边信号。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c602。后续：c604、c904。<\/p>", "kind": "concept", "title": "逆变换：部分分式与卷积"}, "c604": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c603\">逆变换：部分分式与卷积<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c002\">线性常微分方程与特征根法<\/a><\/span><\/div><h1>用拉普拉斯变换解初值问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6、9 章 | <strong>前置<\/strong>：c603、c002\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>对微分方程两边取拉普拉斯变换，用导数性质把初始条件代进去，得到一个关于 <span class=\"katex-inline\">Y(s)<\/span> 的代数方程；解出 <span class=\"katex-inline\">Y(s)<\/span> 再逆变换。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>这是第 6 章的落点，也是第 9 章解半无界热传导的标准动作。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n二阶方程 <span class=\"katex-inline\">y&#x27;&#x27;+py&#x27;+qy=f(t)<\/span>：<span class=\"katex-inline\">(s^2+ps+q)Y=F(s)+sy(0)+y&#x27;(0)+py(0)<\/span>。\n<\/li><li>\n传递函数 <span class=\"katex-inline\">H(s)=1/(s^2+ps+q)<\/span>，零初值时 <span class=\"katex-inline\">Y=H F<\/span>。\n<\/li><li>\n逆变换后解自动满足初始条件，不需要再定常数。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n变换时把 <span class=\"katex-inline\">y(0)<\/span>、<span class=\"katex-inline\">y&#x27;(0)<\/span> 当零。题目给了初值就必须带进去。\n<\/li><li>\n解出 <span class=\"katex-inline\">Y(s)<\/span> 就停手，忘记逆变换回时间域。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c603、c002。后续：c904、ch09 的算例。<\/p>", "kind": "concept", "title": "用拉普拉斯变换解初值问题"}, "c701": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c001\">偏导数、全微分与链式法则<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c004\">矢量分析与场论记号<\/a><\/span><\/div><h1>三类典型数学物理方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7 章 | <strong>前置<\/strong>：c001、c004\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>波动方程 <span class=\"katex-inline\">u_{tt}=a^2\\Delta u<\/span>、热传导方程 <span class=\"katex-inline\">u_t=a^2\\Delta u<\/span>、拉普拉斯/泊松方程 <span class=\"katex-inline\">\\Delta u=f<\/span>，是三类二阶线性偏微分方程的标准代表。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>整门课的求解对象。第 8、9、10 章是三种不同的解法，解的都是这三类方程。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n波动方程：双曲型，二阶时间导数，描述振动与波的传播，需要两个初始条件。\n<\/li><li>\n热传导方程：抛物型，一阶时间导数，描述扩散与弛豫，需要一个初始条件。\n<\/li><li>\n拉普拉斯/泊松方程：椭圆型，无时间导数，描述稳态场，只需边界条件。\n<\/li><li>\n量纲检查：<span class=\"katex-inline\">a^2<\/span> 的单位由方程决定（波动是速度平方，热传导是扩散系数）。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把热传导当波动。它没有行波解，扰动是无限速度扩散的（数学上）。\n<\/li><li>\n以为拉普拉斯方程也能配初始条件。稳态问题不需要初始状态，给了反而超定。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c001、c004。后续：c702、c704、c801、c901、c1001。<\/p>", "kind": "concept", "title": "三类典型数学物理方程"}, "c702": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c701\">三类典型数学物理方程<\/a><\/span><\/div><h1>初始条件与三类边界条件<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7、8、9 章 | <strong>前置<\/strong>：c701\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>初始条件给 <span class=\"katex-inline\">t=0<\/span> 时全场状态；边界条件给边界上的值或导数，分 Dirichlet（值）、Neumann（法向导数）、Robin（两者线性组合）三类。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它们决定解是否唯一。分离变量时，正是边界条件的类型决定本征值取什么、本征函数是正弦还是余弦。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n波动方程：<span class=\"katex-inline\">u(x,0)=\\varphi(x)<\/span>、<span class=\"katex-inline\">u_t(x,0)=\\psi(x)<\/span>，两个都要。\n<\/li><li>\n热传导：<span class=\"katex-inline\">u(x,0)=f(x)<\/span>，只要一个。\n<\/li><li>\nDirichlet <span class=\"katex-inline\">u|_{\\partial D}=g<\/span>；Neumann <span class=\"katex-inline\">\\partial_n u|_{\\partial D}=g<\/span>；Robin <span class=\"katex-inline\">\\alpha u+\\beta\\partial_n u=g<\/span>。\n<\/li><li>\n条件个数要与方程阶数匹配，多了超定，少了不唯一。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n给热传导方程配两个初始条件。多给不等于更准，是矛盾。\n<\/li><li>\n把 Neumann 条件理解成&quot;边界值为零&quot;。它约束的是法向导数，边界值可以不为零。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c701。后续：c704、c801、c802、c903。<\/p>", "kind": "concept", "title": "初始条件与三类边界条件"}, "c703": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c701\">三类典型数学物理方程<\/a><\/span><\/div><h1>叠加原理与齐次化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7、8 章 | <strong>前置<\/strong>：c701\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>线性方程的解可以相加：非齐次方程的通解 = 一个特解 + 齐次方程的通解；边界非齐次时，先找一个满足边界的辅助函数，把问题转成齐次边界。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是分离变量能处理非齐次问题的前提。没有齐次化，本征函数展开无从下手。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n非齐次方程 <span class=\"katex-inline\">Lu=f<\/span>：先求一个特解 <span class=\"katex-inline\">u_p<\/span>，再解 <span class=\"katex-inline\">Lv=0<\/span> 加齐次化后的条件。\n<\/li><li>\n非齐次边界 <span class=\"katex-inline\">u(0,t)=g(t)<\/span>：设 <span class=\"katex-inline\">u=v+w<\/span>，<span class=\"katex-inline\">w<\/span> 取简单的线性/多项式形式满足边界，<span class=\"katex-inline\">v<\/span> 满足齐次边界。\n<\/li><li>\n叠加对线性问题成立；非线性方程不能这样拆。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把非齐次边界直接拿去做分离变量，得到边界条件不齐次的常微分方程，解不下去。\n<\/li><li>\n以为&quot;特解&quot;必须满足初始条件。特解只要满足方程，条件由齐次部分补。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c701。后续：c803、c801。<\/p>", "kind": "concept", "title": "叠加原理与齐次化"}, "c704": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c702\">初始条件与三类边界条件<\/a><\/span><\/div><h1>定解问题的适定性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7 章 | <strong>前置<\/strong>：c702\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一个定解问题&quot;提得对&quot;，要满足三条：解存在、解唯一、解连续依赖数据（数据小扰动只引起解的小扰动）。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是判断&quot;这个提法能不能解&quot;的标准，也是第 8 章唯一性证明、第 10 章格林函数唯一性的依据。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n三类方程的典型定解问题都适定：波动（初值+边界）、热传导（初值+边界）、拉普拉斯（边界）。\n<\/li><li>\n稳定性是物理可预测性的数学表述；不适定问题（如反向热传导）数值上极不稳定。\n<\/li><li>\n唯一性常用能量积分或最大模原理证明。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为&quot;有解&quot;就算适定。唯一性和稳定性同样必须满足。\n<\/li><li>\n把稳定性理解成&quot;解不变&quot;。它是连续依赖，数据变一点，解变一点。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c702。后续：c802（唯一性）、c1002。<\/p>", "kind": "concept", "title": "定解问题的适定性"}, "c801": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c702\">初始条件与三类边界条件<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c002\">线性常微分方程与特征根法<\/a><\/span><\/div><h1>分离变量法的基本步骤<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8 章 | <strong>前置<\/strong>：c702、c002\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>设 <span class=\"katex-inline\">u(x,t)=X(x)T(t)<\/span>，代入齐次方程与齐次边界，两边除以 <span class=\"katex-inline\">XT<\/span>，令比值为常数 <span class=\"katex-inline\">-\\lambda<\/span>，把偏微分方程拆成两个常微分方程。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>第 8 章的总纲。后面所有内容——本征值问题、本征展开、特殊函数——都是它的分支。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n五步：设乘积解 → 分离 → 解本征值问题 → 叠加 → 用初始条件定系数。\n<\/li><li>\n分离常数通常取 <span class=\"katex-inline\">-\\lambda<\/span>（空间方程 <span class=\"katex-inline\">X&#x27;&#x27;+\\lambda X=0<\/span>），方向取反会只剩零解。\n<\/li><li>\n只有当方程与边界都是齐次时才能直接分离；非齐次要先处理。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n对非齐次方程直接设乘积解。源项 <span class=\"katex-inline\">f(x,t)<\/span> 无法写成 <span class=\"katex-inline\">X(x)T(t)<\/span>，必须先展开或齐次化。\n<\/li><li>\n把分离常数当成可以任取的参数。它由边界条件量化。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c702、c002。后续：c802、c803、c805、c1101、c1201。<\/p>", "kind": "concept", "title": "分离变量法的基本步骤"}, "c802": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c801\">分离变量法的基本步骤<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c002\">线性常微分方程与特征根法<\/a><\/span><\/div><h1>本征值问题与本征函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8、11、12 章 | <strong>前置<\/strong>：c801、c002\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">X&#x27;&#x27;+\\lambda X=0<\/span> 加上齐次边界条件，只有特定的 <span class=\"katex-inline\">\\lambda<\/span>（本征值）存在非零解 <span class=\"katex-inline\">X_n<\/span>（本征函数），这就是本征值问题。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>分离变量的核心产出。边界条件把连续的 <span class=\"katex-inline\">\\lambda<\/span> 筛成离散序列，这是&quot;驻波频率离散&quot;的数学来源。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\nDirichlet 边界 <span class=\"katex-inline\">X(0)=X(l)=0<\/span>：<span class=\"katex-inline\">\\lambda_n=(n\\pi/l)^2<\/span>，<span class=\"katex-inline\">X_n=\\sin(n\\pi x/l)<\/span>，<span class=\"katex-inline\">n=1,2,\\dots<\/span>。\n<\/li><li>\nNeumann 边界 <span class=\"katex-inline\">X&#x27;(0)=X&#x27;(l)=0<\/span>：<span class=\"katex-inline\">\\lambda_n=(n\\pi/l)^2<\/span>，<span class=\"katex-inline\">X_n=\\cos(n\\pi x/l)<\/span>，<span class=\"katex-inline\">n=0,1,2,\\dots<\/span>（<span class=\"katex-inline\">n=0<\/span> 是常数）。\n<\/li><li>\n混合边界给出半整数波数；<span class=\"katex-inline\">\\lambda=0<\/span> 要单独检查。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为任意 <span class=\"katex-inline\">\\lambda<\/span> 都有解。绝大多数 <span class=\"katex-inline\">\\lambda<\/span> 只给出零解。\n<\/li><li>\n漏掉 <span class=\"katex-inline\">\\lambda=0<\/span> 的情况。Neumann 边界下常数解是合法的。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c801、c002。后续：c804、c803、c1101、c1201。<\/p>", "kind": "concept", "title": "本征值问题与本征函数"}, "c804": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c802\">本征值问题与本征函数<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c003\">无穷级数与收敛半径<\/a><\/span><\/div><h1>正交性与完备性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8、11、12 章 | <strong>前置<\/strong>：c802、c003\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>不同本征值对应的本征函数在带权内积下正交：<span class=\"katex-inline\">\\int X_nX_m w\\,dx=0<\/span>（<span class=\"katex-inline\">n\\ne m<\/span>）；完备性指任意满足边界条件的函数都能展开成本征函数的级数。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是&quot;定系数&quot;的理论依据。没有正交性，级数系数无法分离出来；没有完备性，展开不保证收敛到原函数。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n系数公式：<span class=\"katex-inline\">c_n=\\frac{\\int fX_n w}{\\int X_n^2 w}<\/span>。\n<\/li><li>\n斯特姆–刘维尔理论：二阶自伴算子的本征函数自动正交且完备。\n<\/li><li>\n帕塞瓦尔等式：展开的均方误差为零。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把所有正交性都当成权重为 1。贝塞尔函数带权重 <span class=\"katex-inline\">x<\/span>，球谐带 <span class=\"katex-inline\">\\sin\\theta<\/span>。\n<\/li><li>\n以为正交性就蕴含完备性。两者是不同性质，需要分别证明。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c802、c003。后续：c803、c1103、c1203、c1304。<\/p>", "kind": "concept", "title": "正交性与完备性"}, "c803": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c802\">本征值问题与本征函数<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c703\">叠加原理与齐次化<\/a><\/span><\/div><h1>非齐次方程与非齐次边界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8、13 章 | <strong>前置<\/strong>：c802、c703\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>源项 <span class=\"katex-inline\">f(x,t)<\/span> 按本征函数展开成 <span class=\"katex-inline\">\\sum f_n(t)X_n(x)<\/span>，每一项对应一个受迫常微分方程；边界非齐次则先设辅助函数把边界搬到零。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>分离变量从&quot;理想问题&quot;走向&quot;真实问题&quot;的关键一步。真实的热源、外力、非零边界都在这里处理。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n展开后：<span class=\"katex-inline\">T_n&#x27;&#x27;+a^2\\lambda_nT_n=f_n(t)<\/span>（波动）或 <span class=\"katex-inline\">T_n&#x27;+a^2\\lambda_nT_n=f_n(t)<\/span>（热传导）。\n<\/li><li>\n冲量定理（杜哈梅）：零初值受迫解 = 源与自由响应的卷积。\n<\/li><li>\n边界齐次化：<span class=\"katex-inline\">u=v+w<\/span>，<span class=\"katex-inline\">w<\/span> 选线性函数或满足边界的多项式，<span class=\"katex-inline\">v<\/span> 满足齐次边界。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把源项当常数处理。<span class=\"katex-inline\">f_n(t)<\/span> 随时间变，每一项都要解一个受迫方程。\n<\/li><li>\n齐次化的 <span class=\"katex-inline\">w<\/span> 只满足边界不满足方程，代回后 <span class=\"katex-inline\">v<\/span> 的方程多出一项，要一起算。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c802、c703。后续：c902（非齐次波动）、c1304。<\/p>", "kind": "concept", "title": "非齐次方程与非齐次边界"}, "c805": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c802\">本征值问题与本征函数<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c004\">矢量分析与场论记号<\/a><\/span><\/div><h1>二维与三维分离变量<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 8、11、12 章 | <strong>前置<\/strong>：c802、c004\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在直角、柱、球坐标中把 <span class=\"katex-inline\">u<\/span> 写成各坐标方向函数的乘积，得到多个常微分方程与多个分离常数，它们由约束关系联系。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是通往特殊函数的桥：直角坐标给三角级数，柱坐标给贝塞尔，球坐标给勒让德。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n直角坐标：<span class=\"katex-inline\">u=X(x)Y(y)T(t)<\/span>，两个空间本征值相加。\n<\/li><li>\n柱坐标：<span class=\"katex-inline\">u=R(r)\\Phi(\\varphi)Z(z)<\/span>，<span class=\"katex-inline\">\\Phi<\/span> 的周期性要求 <span class=\"katex-inline\">\\nu<\/span> 为整数，径向给贝塞尔方程。\n<\/li><li>\n球坐标：<span class=\"katex-inline\">u=R(r)\\Theta(\\theta)\\Phi(\\varphi)<\/span>，极角给勒让德方程，<span class=\"katex-inline\">l<\/span> 由有界性量化。\n<\/li><li>\n分离常数满足 <span class=\"katex-inline\">\\lambda=\\mu+\\nu<\/span> 之类的约束，不能各自独立。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把各方向的分离常数当成互不相关。代回原方程时它们必须相加等于总常数。\n<\/li><li>\n以为坐标选择只影响计算量。边界形状决定哪个坐标能分离，选错根本分不开。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c802、c004。后续：c1101、c1201。<\/p>", "kind": "concept", "title": "二维与三维分离变量"}, "c901": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c701\">三类典型数学物理方程<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c002\">线性常微分方程与特征根法<\/a><\/span><\/div><h1>达朗贝尔公式与波动方程通解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9 章 | <strong>前置<\/strong>：c701、c002\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一维齐次波动方程的通解是 <span class=\"katex-inline\">u=f(x-at)+g(x+at)<\/span>；用初始位移 <span class=\"katex-inline\">\\varphi<\/span> 与初始速度 <span class=\"katex-inline\">\\psi<\/span>，解写成 <span class=\"katex-inline\">u=\\frac12[\\varphi(x-at)+\\varphi(x+at)]+\\frac{1}{2a}\\int_{x-at}^{x+at}\\psi(s)ds<\/span>。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>行波法的全部内容。它给出无界弦问题的显式解，也是理解&quot;波以有限速度传播&quot;的入口。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n通解由两个任意波形组成，一个右行、一个左行，形状不变。\n<\/li><li>\n初始速度项带 <span class=\"katex-inline\">\\frac{1}{2a}<\/span> 因子，来自对 <span class=\"katex-inline\">t<\/span> 积分。\n<\/li><li>\n只适用于全无界、齐次、无源；有源要加积分项，有边界要延拓。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把公式用在半无界问题而不做延拓。边界会被&quot;忽略&quot;，解在边界处不满足条件。\n<\/li><li>\n漏掉 <span class=\"katex-inline\">\\frac{1}{2a}<\/span>，初速度贡献整体大一倍。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c701、c002。后续：c902、c903、c1003。<\/p>", "kind": "concept", "title": "达朗贝尔公式与波动方程通解"}, "c902": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c901\">达朗贝尔公式与波动方程通解<\/a><\/span><\/div><h1>特征线、依赖区域与因果性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 9 章 | <strong>前置<\/strong>：c901\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">dx/dt=\\pm a<\/span> 的积分曲线叫特征线，即 <span class=\"katex-inline\">x\\pm at=\\text{const}<\/span>；点 <span class=\"katex-inline\">(x,t)<\/span> 的值只依赖初始轴上区间 <span class=\"katex-inline\">[x-at,x+at]<\/span> 的数据，这个区间叫依赖区域。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它解释&quot;为什么波速有限&quot;：信息只能沿特征线传播，超出依赖区域的初始数据影响不到这一点。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n依赖区间长度 <span class=\"katex-inline\">2at<\/span>，随时间线性增长。\n<\/li><li>\n影响区域反过来：初始点 <span class=\"katex-inline\">(x_0,0)<\/span> 能影响到的是锥形区域 <span class=\"katex-inline\">|x-x_0|\\le at<\/span>。\n<\/li><li>\n因果性：<span class=\"katex-inline\">t<\/span> 时刻的解不能依赖 <span class=\"katex-inline\">t<\/span> 之后的数据——数学上由特征线方向保证。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为扰动瞬时传遍全弦。抛物型（热传导）才有无穷传播速度，双曲型没有。\n<\/li><li>\n把特征线当成&quot;波的轨迹&quot;。它是信息传播的坐标线，波形沿它移动。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c901。后续：c903、c1003。<\/p>", "kind": "concept", "title": "特征线、依赖区域与因果性"}, "c903": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c901\">达朗贝尔公式与波动方程通解<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c702\">初始条件与三类边界条件<\/a><\/span><\/div><h1>半无界问题与延拓反射法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9 章 | <strong>前置<\/strong>：c901、c702\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>半无限长弦的问题，把初始数据按奇对称或偶对称延拓到整条轴，用达朗贝尔公式算出全无界解，再限制回 <span class=\"katex-inline\">x&gt;0<\/span>。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它把边界效应翻译成&quot;镜像波&quot;：边界不是额外方程，而是延拓方式的选择。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n固定端 <span class=\"katex-inline\">u(0,t)=0<\/span>：奇延拓，反射波反号。\n<\/li><li>\n自由端 <span class=\"katex-inline\">u_x(0,t)=0<\/span>：偶延拓，反射波同号。\n<\/li><li>\n延拓只对初始数据做；公式算完后只在 <span class=\"katex-inline\">x&gt;0<\/span> 取结果。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n延拓之后忘记限制回半轴，把 <span class=\"katex-inline\">x&lt;0<\/span> 的虚假区域也当答案。\n<\/li><li>\n固定端用偶延拓。符号错，反射波形反了。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c901、c702。后续：c904、c1002（镜像法同源）。<\/p>", "kind": "concept", "title": "半无界问题与延拓反射法"}, "c904": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c502\">傅里叶变换与逆变换<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c601\">拉普拉斯变换与收敛域<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c702\">初始条件与三类边界条件<\/a><\/span><\/div><h1>积分变换法解半无界问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9 章 | <strong>前置<\/strong>：c502、c601、c702\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>半无界热传导问题：对空间做正弦/余弦变换把边界条件吸收进变换的选择，或对时间做拉普拉斯变换把初值问题代数化。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是第 5、6 章工具在第 9 章的实战。热传导没有行波，延拓法不适用，只能靠变换。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n正弦变换适合 Dirichlet 边界 <span class=\"katex-inline\">u(0,t)=0<\/span>；余弦变换适合 Neumann 边界。\n<\/li><li>\n正弦变换后 <span class=\"katex-inline\">u_{xx}<\/span> 产生一项 <span class=\"katex-inline\">-\\omega^2U+\\omega u(0,t)<\/span>，边界值进入方程。\n<\/li><li>\n对 <span class=\"katex-inline\">t<\/span> 做拉普拉斯：<span class=\"katex-inline\">sU-u(x,0)=a^2U_{xx}<\/span>，解一个常微分方程。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n变换后把边界项当零。<span class=\"katex-inline\">u(0,t)\\ne0<\/span> 时它会留下，漏掉整题错。\n<\/li><li>\n在有限区间上用傅里叶变换。有界方向应改用分离变量。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c502、c601、c702。后续：c1002、c1004。<\/p>", "kind": "concept", "title": "积分变换法解半无界问题"}, "c1001": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c504\">δ函数及其傅里叶表示<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c701\">三类典型数学物理方程<\/a><\/span><\/div><h1>δ函数与基本解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 10 章 | <strong>前置<\/strong>：c504、c701\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>算子 <span class=\"katex-inline\">L<\/span> 的基本解 <span class=\"katex-inline\">G_0<\/span> 满足 <span class=\"katex-inline\">LG_0=\\delta(r-r_0)<\/span>，物理上就是&quot;在 <span class=\"katex-inline\">r_0<\/span> 放一个单位点源，自由空间里的响应&quot;。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>格林函数的起点。任何分布源的解都是基本解与源的卷积。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n三维泊松方程基本解：<span class=\"katex-inline\">G_0=\\frac{1}{4\\pi r}<\/span>，<span class=\"katex-inline\">r=|r-r_0|<\/span>。\n<\/li><li>\n一维：<span class=\"katex-inline\">G_0=\\frac{|x-x_0|}{2}<\/span>；二维：<span class=\"katex-inline\">G_0=\\frac{1}{2\\pi}\\ln r<\/span>。\n<\/li><li>\n热传导基本解是高斯核 <span class=\"katex-inline\">\\frac{1}{\\sqrt{4\\pi a^2t}}e^{-r^2/(4a^2t)}<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为基本解满足边界条件。它只满足方程，边界修正是格林函数与基本解之差。\n<\/li><li>\n把三维 <span class=\"katex-inline\">1/(4\\pi r)<\/span> 直接用到二维。维度不同，基本解形式完全不同。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c504、c701。后续：c1002、c1003、c1004。<\/p>", "kind": "concept", "title": "δ函数与基本解"}, "c1002": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c1001\">δ函数与基本解<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c702\">初始条件与三类边界条件<\/a><\/span><\/div><h1>泊松方程格林函数与镜像法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 10 章 | <strong>前置<\/strong>：c1001、c702\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>有界区域的格林函数 = 自由空间基本解 + 边界修正项；镜像法通过在区域外放置虚拟源，让边界上的组合满足齐次边界条件。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是第 7 章边界条件与第 10 章点源思想的结合，也是静电场问题最常用的构造法。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n半空间接地平面 <span class=\"katex-inline\">z=0<\/span>：镜像源在 <span class=\"katex-inline\">z=-z_0<\/span>，电量相反，<span class=\"katex-inline\">G=\\frac{1}{4\\pi}(\\frac1{r_1}-\\frac1{r_2})<\/span>。\n<\/li><li>\n接地球面：镜像电量 <span class=\"katex-inline\">q&#x27;=-aq/R<\/span>，位置 <span class=\"katex-inline\">R^2/a<\/span>（反演点）。\n<\/li><li>\n格林函数关于源点与场点对称：<span class=\"katex-inline\">G(r,r&#x27;)=G(r&#x27;,r)<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n镜像源一律取异号。接地导体面取异号，绝热/自由边界取同号。\n<\/li><li>\n忘记边界修正项，直接用自由空间解，边界条件不满足。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c1001、c702。后续：c1003、c1004。<\/p>", "kind": "concept", "title": "泊松方程格林函数与镜像法"}, "c1003": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c1001\">δ函数与基本解<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c901\">达朗贝尔公式与波动方程通解<\/a><\/span><\/div><h1>波动方程格林函数与推迟势<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 10 章 | <strong>前置<\/strong>：c1001、c901\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>三维波动方程的格林函数是 <span class=\"katex-inline\">G=\\frac{\\delta(t-t&#x27;-r/a)}{4\\pi r}<\/span>；源在 <span class=\"katex-inline\">t&#x27;<\/span> 时刻的扰动，要到 <span class=\"katex-inline\">t=t&#x27;+r/a<\/span> 才到达场点，这就是推迟。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是因果性在格林函数上的体现，也是电磁学推迟势的数学来源。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n解写成 <span class=\"katex-inline\">u=\\int G f\\,dV&#x27;dt&#x27;<\/span>，源只在&quot;过去光锥&quot;上有贡献。\n<\/li><li>\n三维空间满足惠更斯原理：扰动过后恢复平静；二维有&quot;尾巴&quot;。\n<\/li><li>\n<span class=\"katex-inline\">r/a<\/span> 是传播时间，不是空间距离本身。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n用 <span class=\"katex-inline\">t<\/span> 而不是 <span class=\"katex-inline\">t-r/a<\/span>。这样得到超前解，违反因果。\n<\/li><li>\n以为二维和三维传播一样。二维波有持续余振，三维没有。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c1001、c901。后续：c1004。<\/p>", "kind": "concept", "title": "波动方程格林函数与推迟势"}, "c1004": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c1002\">泊松方程格林函数与镜像法<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c802\">本征值问题与本征函数<\/a><\/span><\/div><h1>格林函数的本征函数展开<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 10 章 | <strong>前置<\/strong>：c1002、c802\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把 <span class=\"katex-inline\">\\delta(r-r_0)<\/span> 按区域的本征函数系展开，格林函数写成 <span class=\"katex-inline\">G=\\sum_n\\frac{\\varphi_n(r)\\varphi_n(r_0)}{\\lambda_n}<\/span> 的形式。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它把第 8 章的本征展开和第 10 章的点源合并，适用于边界形状规则但没有简单镜像的区域（矩形、圆柱、球）。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n展开系数来自 <span class=\"katex-inline\">\\delta<\/span> 的筛选性质：<span class=\"katex-inline\">\\delta(r-r_0)=\\sum\\varphi_n(r)\\varphi_n(r_0)<\/span>（归一化后）。\n<\/li><li>\n分母是本征值；<span class=\"katex-inline\">\\lambda_n<\/span> 越小，模态贡献越大。\n<\/li><li>\n对称性 <span class=\"katex-inline\">G(r,r_0)=G(r_0,r)<\/span> 由展开式自动满足。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n展开时漏掉归一化因子，系数差常数。\n<\/li><li>\n用非齐次边界的本征函数。展开必须用齐次边界对应的本征系。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c1002、c802。后续：ch11、ch12 的应用。<\/p>", "kind": "concept", "title": "格林函数的本征函数展开"}, "c1101": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c805\">二维与三维分离变量<\/a><\/span><\/div><h1>球坐标分离变量与勒让德方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 11 章 | <strong>前置<\/strong>：c805\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在球坐标设 <span class=\"katex-inline\">u=R(r)\\Theta(\\theta)\\Phi(\\varphi)<\/span>，代入拉普拉斯方程，得到径向方程、极角方程（勒让德方程）和方位角方程三个常微分方程。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是第 11 章的总入口：勒让德多项式、球谐函数都是这一个分离动作的产物。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n方位角：<span class=\"katex-inline\">\\Phi&#x27;&#x27;+m^2\\Phi=0<\/span>，周期性要求 <span class=\"katex-inline\">m<\/span> 为整数。\n<\/li><li>\n极角：<span class=\"katex-inline\">\\frac{1}{\\sin\\theta}\\frac{d}{d\\theta}(\\sin\\theta\\frac{d\\Theta}{d\\theta})+[l(l+1)-\\frac{m^2}{\\sin^2\\theta}]\\Theta=0<\/span>。\n<\/li><li>\n径向：<span class=\"katex-inline\">r^2R&#x27;&#x27;+2rR&#x27;-l(l+1)R=0<\/span>，解是 <span class=\"katex-inline\">r^l<\/span> 与 <span class=\"katex-inline\">r^{-(l+1)}<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为 <span class=\"katex-inline\">l<\/span> 先验是整数。它由&quot;解在 <span class=\"katex-inline\">\\theta=0,\\pi<\/span> 有界&quot;这个条件筛出来。\n<\/li><li>\n把 <span class=\"katex-inline\">\\theta<\/span> 方程写成直角坐标形式。球坐标的度量因子 <span class=\"katex-inline\">\\sin\\theta<\/span> 不能丢。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c805。后续：c1102、c1104、c1201。<\/p>", "kind": "concept", "title": "球坐标分离变量与勒让德方程"}, "c1102": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c1101\">球坐标分离变量与勒让德方程<\/a><\/span><\/div><h1>勒让德多项式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 11 章 | <strong>前置<\/strong>：c1101\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>勒让德方程在 <span class=\"katex-inline\">l<\/span> 为非负整数、<span class=\"katex-inline\">m=0<\/span> 时，在 <span class=\"katex-inline\">[-1,1]<\/span> 有界的解是勒让德多项式 <span class=\"katex-inline\">P_l(x)<\/span>，可由母函数或罗德里格斯公式生成。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>球坐标角度部分的本征函数，和三角函数在直角坐标里的地位相同。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n母函数：<span class=\"katex-inline\">\\frac{1}{\\sqrt{1-2xt+t^2}}=\\sum_{l=0}^{\\infty}P_l(x)t^l<\/span>。\n<\/li><li>\n罗德里格斯公式：<span class=\"katex-inline\">P_l(x)=\\frac{1}{2^ll!}\\frac{d^l}{dx^l}(x^2-1)^l<\/span>。\n<\/li><li>\n前几个：<span class=\"katex-inline\">P_0=1<\/span>，<span class=\"katex-inline\">P_1=x<\/span>，<span class=\"katex-inline\">P_2=\\frac{3x^2-1}{2}<\/span>。\n<\/li><li>\n递推：<span class=\"katex-inline\">(l+1)P_{l+1}=(2l+1)xP_l-lP_{l-1}<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把母函数里的 <span class=\"katex-inline\">t<\/span> 当自变量。<span class=\"katex-inline\">x<\/span> 是自变量，<span class=\"katex-inline\">t<\/span> 只是展开参数。\n<\/li><li>\n以为 <span class=\"katex-inline\">P_l<\/span> 是初等函数的一般形式。除前几个外它们不是初等函数，但都是多项式。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c1101。后续：c1103、c1104。<\/p>", "kind": "concept", "title": "勒让德多项式"}, "c1103": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c1102\">勒让德多项式<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c804\">正交性与完备性<\/a><\/span><\/div><h1>勒让德多项式的正交性与展开<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 11 章 | <strong>前置<\/strong>：c1102、c804\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">\\int_{-1}^{1}P_l(x)P_m(x)dx=\\frac{2}{2l+1}\\delta_{lm}<\/span>；任意平方可积函数可展开成 <span class=\"katex-inline\">\\sum c_lP_l(x)<\/span>，<span class=\"katex-inline\">c_l=\\frac{2l+1}{2}\\int fP_l dx<\/span>。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是球面函数展开的工具。给定球面边界温度或电势，展开系数就是解。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n正交性在 <span class=\"katex-inline\">x=\\cos\\theta<\/span> 坐标下权重为 1；换回 <span class=\"katex-inline\">\\theta<\/span> 时积分要带 <span class=\"katex-inline\">\\sin\\theta d\\theta<\/span>。\n<\/li><li>\n展开系数公式里的 <span class=\"katex-inline\">\\frac{2l+1}{2}<\/span> 来自归一化积分。\n<\/li><li>\n帕塞瓦尔：<span class=\"katex-inline\">\\int_{-1}^1f^2dx=\\sum\\frac{2}{2l+1}c_l^2<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把权重当成 <span class=\"katex-inline\">\\sin\\theta<\/span> 又乘一次，重复计入。\n<\/li><li>\n忘记 <span class=\"katex-inline\">l=0<\/span> 项是平均值的一半（<span class=\"katex-inline\">c_0=\\frac12\\int f<\/span>）。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c1102、c804。后续：c1104、c1004。<\/p>", "kind": "concept", "title": "勒让德多项式的正交性与展开"}, "c1104": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c1103\">勒让德多项式的正交性与展开<\/a><\/span><\/div><h1>连带勒让德函数与球谐函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 11 章 | <strong>前置<\/strong>：c1103\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">P_l^m(x)=(1-x^2)^{m/2}\\frac{d^m}{dx^m}P_l(x)<\/span> 是连带勒让德函数；球谐函数 <span class=\"katex-inline\">Y_{lm}(\\theta,\\varphi)=N_{lm}P_l^m(\\cos\\theta)e^{im\\varphi}<\/span> 是球面上的一组正交归一基。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是球坐标问题的完整角度基。氢原子轨道、地球重力场、球面电磁波都用它展开。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n归一化：<span class=\"katex-inline\">N_{lm}=\\sqrt{\\frac{2l+1}{4\\pi}\\frac{(l-m)!}{(l+m)!}}<\/span>（Condon–Shortley 相位另计）。\n<\/li><li>\n正交性：<span class=\"katex-inline\">\\int Y_{lm}\\overline{Y_{l&#x27;m&#x27;}}d\\Omega=\\delta_{ll&#x27;}\\delta_{mm&#x27;}<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">m<\/span> 取值 <span class=\"katex-inline\">-l,\\dots,l<\/span>，共 <span class=\"katex-inline\">2l+1<\/span> 个；<span class=\"katex-inline\">l<\/span> 层共 <span class=\"katex-inline\">2l+1<\/span> 个基函数。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n漏掉归一化因子，展开系数整体差常数。\n<\/li><li>\n把 <span class=\"katex-inline\">m<\/span> 只取非负。完整的球谐需要 <span class=\"katex-inline\">-l\\le m\\le l<\/span>。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c1103。后续：c1004、ch12 的球贝塞尔组合。<\/p>", "kind": "concept", "title": "连带勒让德函数与球谐函数"}, "c1201": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c805\">二维与三维分离变量<\/a><\/span><\/div><h1>柱坐标分离变量与贝塞尔方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 12 章 | <strong>前置<\/strong>：c805\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>柱坐标设 <span class=\"katex-inline\">u=R(r)\\Phi(\\varphi)Z(z)<\/span>，分离后径向方程是 <span class=\"katex-inline\">r^2R&#x27;&#x27;+rR&#x27;+(\\mu^2r^2-\\nu^2)R=0<\/span>，即贝塞尔方程。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>第 12 章的总入口，和第 11 章球坐标分离完全平行。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n方位角周期性要求 <span class=\"katex-inline\">\\nu=m<\/span> 为整数。\n<\/li><li>\n<span class=\"katex-inline\">Z<\/span> 方向给指数或三角，<span class=\"katex-inline\">\\mu<\/span> 由 <span class=\"katex-inline\">z<\/span> 方向边界定。\n<\/li><li>\n径向解是两个贝塞尔函数的组合；<span class=\"katex-inline\">\\mu<\/span> 由 <span class=\"katex-inline\">r=a<\/span> 的边界条件量化。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为 <span class=\"katex-inline\">\\nu<\/span> 可以是任意实数。整周柱体要求单值，<span class=\"katex-inline\">\\nu<\/span> 必须整数。\n<\/li><li>\n把 <span class=\"katex-inline\">\\mu<\/span> 当自由参数。它由边界条件决定，和直角坐标的 <span class=\"katex-inline\">n\\pi/l<\/span> 地位相同。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c805。后续：c1202、c1203。<\/p>", "kind": "concept", "title": "柱坐标分离变量与贝塞尔方程"}, "c1202": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c1201\">柱坐标分离变量与贝塞尔方程<\/a><\/span><\/div><h1>贝塞尔函数 Jν、Yν 与递推性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 12 章 | <strong>前置<\/strong>：c1201\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>贝塞尔方程的两个线性无关解是 <span class=\"katex-inline\">J_\\nu(x)<\/span>（第一类）与 <span class=\"katex-inline\">Y_\\nu(x)<\/span>（第二类），<span class=\"katex-inline\">J_\\nu<\/span> 在原点有限，<span class=\"katex-inline\">Y_\\nu<\/span> 在原点发散。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>柱坐标本征函数的核心。圆柱内部的解必须丢掉 <span class=\"katex-inline\">Y_\\nu<\/span>，这个取舍与第 11 章筛 <span class=\"katex-inline\">l<\/span> 同理。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n<span class=\"katex-inline\">J_0(0)=1<\/span>，<span class=\"katex-inline\">J_n(0)=0<\/span>（<span class=\"katex-inline\">n\\ge1<\/span>）；<span class=\"katex-inline\">Y_\\nu(0)=-\\infty<\/span>。\n<\/li><li>\n递推：<span class=\"katex-inline\">J_{\\nu-1}+J_{\\nu+1}=\\frac{2\\nu}{x}J_\\nu<\/span>，<span class=\"katex-inline\">J_{\\nu-1}-J_{\\nu+1}=2J_\\nu&#x27;<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">J_{-n}=(-1)^nJ_n<\/span>（<span class=\"katex-inline\">n<\/span> 整数），所以整数阶只需 <span class=\"katex-inline\">J_n<\/span> 与 <span class=\"katex-inline\">Y_n<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为两个解都在原点有限。<span class=\"katex-inline\">Y_\\nu<\/span> 发散，圆柱内部不能用。\n<\/li><li>\n忘记整数阶的特殊性：<span class=\"katex-inline\">J_{-n}<\/span> 与 <span class=\"katex-inline\">J_n<\/span> 线性相关。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c1201。后续：c1203、c1204。<\/p>", "kind": "concept", "title": "贝塞尔函数 Jν、Yν 与递推性质"}, "c1203": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c1202\">贝塞尔函数 Jν、Yν 与递推性质<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c804\">正交性与完备性<\/a><\/span><\/div><h1>贝塞尔函数的正交性与傅里叶–贝塞尔展开<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 12 章 | <strong>前置<\/strong>：c1202、c804\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>在 <span class=\"katex-inline\">(0,a)<\/span> 上，<span class=\"katex-inline\">J_\\nu(\\mu_m r)<\/span> 与 <span class=\"katex-inline\">J_\\nu(\\mu_n r)<\/span> 带权重 <span class=\"katex-inline\">r<\/span> 正交，<span class=\"katex-inline\">\\mu_m<\/span> 是 <span class=\"katex-inline\">J_\\nu<\/span> 的零点（或导数的零点，取决于边界）。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它是圆柱区域&quot;定系数&quot;的工具，和三角级数、勒让德级数并列。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n正交：<span class=\"katex-inline\">\\int_0^aJ_\\nu(\\mu_m r)J_\\nu(\\mu_n r)r\\,dr=0<\/span>（<span class=\"katex-inline\">m\\ne n<\/span>）。\n<\/li><li>\n系数：<span class=\"katex-inline\">c_m=\\frac{\\int_0^af(r)J_\\nu(\\mu_mr)r\\,dr}{a^2J_{\\nu+1}^2(\\mu_ma)/2}<\/span>。\n<\/li><li>\nDirichlet 边界用 <span class=\"katex-inline\">J_\\nu<\/span> 的零点；Neumann 边界用 <span class=\"katex-inline\">J_\\nu&#x27;<\/span> 的零点。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n漏掉权重 <span class=\"katex-inline\">r<\/span>，系数全错。\n<\/li><li>\n边界类型与零点类型不匹配。<span class=\"katex-inline\">u(a)=0<\/span> 用 <span class=\"katex-inline\">J_\\nu<\/span> 零点，<span class=\"katex-inline\">u_r(a)=0<\/span> 用导数零点。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c1202、c804。后续：c1204、c1004。<\/p>", "kind": "concept", "title": "贝塞尔函数的正交性与傅里叶–贝塞尔展开"}, "c1204": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c1202\">贝塞尔函数 Jν、Yν 与递推性质<\/a><\/span><\/div><h1>修正贝塞尔、球贝塞尔与渐近行为<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 12 章 | <strong>前置<\/strong>：c1202\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">I_\\nu(x)=i^{-\\nu}J_\\nu(ix)<\/span>、<span class=\"katex-inline\">K_\\nu(x)<\/span> 是修正贝塞尔函数，描述指数增长/衰减；<span class=\"katex-inline\">j_l(x)=\\sqrt{\\frac{\\pi}{2x}}J_{l+1/2}(x)<\/span> 是球贝塞尔函数，可用初等函数写出。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它补齐柱坐标与球坐标的另一半：虚波数给修正贝塞尔，球对称给球贝塞尔。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n<span class=\"katex-inline\">I_\\nu<\/span> 单调增长，<span class=\"katex-inline\">K_\\nu<\/span> 指数衰减；圆柱外部解常用 <span class=\"katex-inline\">K_\\nu<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">j_0=\\frac{\\sin x}{x}<\/span>，<span class=\"katex-inline\">n_0=-\\frac{\\cos x}{x}<\/span>；<span class=\"katex-inline\">j_l<\/span>、<span class=\"katex-inline\">n_l<\/span> 都是正弦余弦除以 <span class=\"katex-inline\">x<\/span> 的组合。\n<\/li><li>\n大 <span class=\"katex-inline\">x<\/span> 渐近：<span class=\"katex-inline\">J_\\nu\\sim\\sqrt{\\frac{2}{\\pi x}}\\cos(x-\\frac{\\nu\\pi}{2}-\\frac{\\pi}{4})<\/span>，振幅按 <span class=\"katex-inline\">1/\\sqrt x<\/span> 衰减。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为修正贝塞尔也振荡。<span class=\"katex-inline\">I_\\nu<\/span>、<span class=\"katex-inline\">K_\\nu<\/span> 没有实零点，是单调的。\n<\/li><li>\n以为球贝塞尔必须查表。<span class=\"katex-inline\">l<\/span> 小时可以直接写出初等形式。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c1202。后续：c1104（球谐与球贝塞尔组合）、c1004。<\/p>", "kind": "concept", "title": "修正贝塞尔、球贝塞尔与渐近行为"}, "c1301": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c001\">偏导数、全微分与链式法则<\/a><\/span><\/div><h1>泛函与变分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 13 章 | <strong>前置<\/strong>：c001\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>输入是一个函数、输出是一个数的映射叫泛函，例如 <span class=\"katex-inline\">J[y]=\\int_a^bF(x,y,y&#x27;)dx<\/span>；让 <span class=\"katex-inline\">y<\/span> 发生小扰动 <span class=\"katex-inline\">\\delta y<\/span>，<span class=\"katex-inline\">J<\/span> 的一阶改变量叫变分 <span class=\"katex-inline\">\\delta J<\/span>。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>第 13 章的起点。它把&quot;求函数极值&quot;升级成&quot;求函数空间里的极值&quot;，物理里的极值原理都写成这种形式。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n极值的必要条件是一阶变分为零：<span class=\"katex-inline\">\\delta J=0<\/span> 对任意 <span class=\"katex-inline\">\\delta y<\/span> 成立。\n<\/li><li>\n<span class=\"katex-inline\">\\delta<\/span> 与 <span class=\"katex-inline\">d<\/span> 运算规则相似，但 <span class=\"katex-inline\">\\delta y<\/span> 是函数方向的扰动，<span class=\"katex-inline\">dy<\/span> 是自变量微分。\n<\/li><li>\n二阶变分可以判断极大、极小或鞍点。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把泛函当普通函数。它的自变量是整条曲线，不是一点。\n<\/li><li>\n直接把 <span class=\"katex-inline\">\\delta<\/span> 当微分算。<span class=\"katex-inline\">\\delta<\/span> 与 <span class=\"katex-inline\">\\frac{d}{dx}<\/span> 可交换，但不能和 <span class=\"katex-inline\">dy<\/span> 混。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c001。后续：c1302、c1303。<\/p>", "kind": "concept", "title": "泛函与变分"}, "c1302": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c1301\">泛函与变分<\/a><\/span><\/div><h1>欧拉–拉格朗日方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 13 章 | <strong>前置<\/strong>：c1301\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>泛函 <span class=\"katex-inline\">J=\\int F(x,y,y&#x27;)dx<\/span> 取极值的必要条件是 <span class=\"katex-inline\">\\frac{d}{dx}\\frac{\\partial F}{\\partial y&#x27;}-\\frac{\\partial F}{\\partial y}=0<\/span>，这就是欧拉–拉格朗日方程。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>变分法的核心方程。它把&quot;极值问题&quot;翻译回&quot;微分方程&quot;，与第 7 章的方程体系接上。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n推导靠分部积分，边界项因固定端点而消失。\n<\/li><li>\n<span class=\"katex-inline\">F<\/span> 不显含 <span class=\"katex-inline\">x<\/span> 时有首次积分 <span class=\"katex-inline\">F-y&#x27;F_{y&#x27;}=C<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">F<\/span> 不显含 <span class=\"katex-inline\">y<\/span> 时有 <span class=\"katex-inline\">F_{y&#x27;}=C<\/span>，可降阶。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n只写 <span class=\"katex-inline\">F_y=0<\/span>，漏掉对 <span class=\"katex-inline\">y&#x27;<\/span> 的全导数项 <span class=\"katex-inline\">\\frac{d}{dx}F_{y&#x27;}=F_{xy&#x27;}+F_{y&#x27;y&#x27;}y&#x27;&#x27;<\/span>。\n<\/li><li>\n忘记边界项为零的条件（端点固定），否则方程不成立。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c1301。后续：c1303、c1304。<\/p>", "kind": "concept", "title": "欧拉–拉格朗日方程"}, "c1303": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c1302\">欧拉–拉格朗日方程<\/a><\/span><\/div><h1>变分原理与哈密顿原理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 13 章 | <strong>前置<\/strong>：c1302\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>物理系统的真实运动使作用量 <span class=\"katex-inline\">S=\\int_{t_1}^{t_2}L(q,\\dot q,t)dt<\/span> 取驻值，这就是哈密顿原理；<span class=\"katex-inline\">L=T-V<\/span> 是拉格朗日量。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它把牛顿力学、场论、量子力学的路径积分统一在&quot;极值&quot;语言下，是整门课的最高视角。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n对 <span class=\"katex-inline\">S<\/span> 用欧拉–拉格朗日方程，得到拉格朗日方程 <span class=\"katex-inline\">\\frac{d}{dt}\\frac{\\partial L}{\\partial\\dot q}-\\frac{\\partial L}{\\partial q}=0<\/span>。\n<\/li><li>\n单摆：<span class=\"katex-inline\">L=\\frac12ml^2\\dot\\theta^2+mgl\\cos\\theta<\/span>，导出 <span class=\"katex-inline\">\\ddot\\theta+\\frac gl\\sin\\theta=0<\/span>。\n<\/li><li>\n作用量取驻值，不一定是极小值。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把&quot;最小作用量&quot;当成严格最小。多数情况只是驻值，可能是鞍点。\n<\/li><li>\n把 <span class=\"katex-inline\">L=T-V<\/span> 写成 <span class=\"katex-inline\">T+V<\/span>。符号错，运动方程全反。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c1302。后续：c1304。<\/p>", "kind": "concept", "title": "变分原理与哈密顿原理"}, "c1304": {"html": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c1302\">欧拉–拉格朗日方程<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c803\">非齐次方程与非齐次边界<\/a><\/span><\/div><h1>瑞利–里兹近似方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 13 章 | <strong>前置<\/strong>：c1302、c803\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用一组满足边界条件的试探函数线性组合逼近真实解，代入泛函并对系数求极值，得到本征值的近似值。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>变分法从&quot;理论&quot;走向&quot;计算&quot;的接口，也是有限元方法的雏形。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n瑞利商 <span class=\"katex-inline\">\\lambda=\\frac{\\int|\\nabla u|^2}{\\int u^2}<\/span>（或相应的泛函比）给出本征值的上界。\n<\/li><li>\n试探函数空间越大，近似越好，且单调从上方逼近。\n<\/li><li>\n广义本征值问题化成矩阵方程 <span class=\"katex-inline\">Ax=\\lambda Bx<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为给出的是下界。瑞利–里兹从上方逼近，真值在下面。\n<\/li><li>\n试探函数不满足边界条件。这样得到的泛函值没有上界意义。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c1302、c803。后续：数值方法、有限元。<\/p>", "kind": "concept", "title": "瑞利–里兹近似方法"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：补工具<\/strong><br>阅读：<a href=\"#/chapter/ch00\">第 0 章：开课前的数学工具箱<\/a><br>检查点：能算二阶偏导、写三类常微分通解、判收敛半径<\/li><li class='path-step' id='path-02'><strong>步骤 02：复数与复平面<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：复数与复变函数<\/a><br>检查点：能算乘法与开方，能画分支切割<\/li><li class='path-step' id='path-03'><strong>步骤 03：解析函数<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：解析函数<\/a><br>检查点：能用柯西–黎曼方程判断解析性<\/li><li class='path-step' id='path-04'><strong>步骤 04：复变积分<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：复变积分<\/a><br>检查点：能用柯西定理与积分公式算围道积分<\/li><li class='path-step' id='path-05'><strong>步骤 05：级数与留数<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：级数展开与留数<\/a><br>检查点：能算三类留数与三类实积分<\/li><li class='path-step' id='path-06'><strong>步骤 06：傅里叶变换<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：傅里叶变换<\/a><br>检查点：能写变换对、用卷积定理解方程<\/li><li class='path-step' id='path-07'><strong>步骤 07：拉普拉斯变换<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：拉普拉斯变换<\/a><br>检查点：能把初值问题解成代数方程并逆变换<\/li><li class='path-step' id='path-08'><strong>步骤 08：方程与定解条件<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：方程的建立与定解条件<\/a><br>检查点：能导出三类方程、写对初始与边界条件<\/li><li class='path-step' id='path-09'><strong>步骤 09：分离变量<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：分离变量法<\/a><br>检查点：能完整走完五步并定出系数<\/li><li class='path-step' id='path-10'><strong>步骤 10：行波与积分变换解法<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：行波法与积分变换法<\/a><br>检查点：会用达朗贝尔公式与延拓处理半无界<\/li><li class='path-step' id='path-11'><strong>步骤 11：格林函数<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：格林函数法<\/a><br>检查点：会用镜像法构造格林函数<\/li><li class='path-step' id='path-12'><strong>步骤 12：球坐标特殊函数<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：勒让德多项式与球谐函数<\/a><br>检查点：会球坐标分离与球面展开<\/li><li class='path-step' id='path-13'><strong>步骤 13：柱坐标特殊函数<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章：贝塞尔函数<\/a><br>检查点：会柱坐标分离与傅里叶–贝塞尔展开<\/li><li class='path-step' id='path-14'><strong>步骤 14：变分法<\/strong><br>阅读：<a href=\"#/chapter/ch13\">第 13 章：变分法初步<\/a><br>检查点：能推欧拉–拉格朗日方程并做瑞利–里兹近似<\/li><li class='path-step' id='path-15'><strong>步骤 15：综合检验<\/strong><br>阅读：<br>检查点：独立完成一个物理场景：建模 → 定解 → 求解 → 验算<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__graph__": {"html": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "kind": "graph", "title": "知识图谱"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q01' data-type='single' data-concept='c002' data-chapter='ch00'><p class='quiz-q'><b>Q1.<\/b> 特征方程有一对共轭复根 <span class=\"katex-inline\">\\alpha\\pm i\\beta<\/span> 时，通解的形式是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> <span class=\"katex-inline\">e^{\\alpha t}(C_1\\cos\\beta t+C_2\\sin\\beta t)<\/span><\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> <span class=\"katex-inline\">C_1e^{\\alpha t}+C_2e^{\\beta t}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> <span class=\"katex-inline\">(C_1+C_2t)e^{\\alpha t}<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c001' data-chapter='ch00'><p class='quiz-q'><b>Q2.<\/b> 把 <span class=\"katex-inline\">u=f(x-at)<\/span> 代入 <span class=\"katex-inline\">u_{tt}-a^2u_{xx}<\/span>，结果是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 恒等于零<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 等于 <span class=\"katex-inline\">f&#x27;&#x27;<\/span><\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 等于 <span class=\"katex-inline\">a^2f<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c101' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> <span class=\"katex-inline\">z=1+i<\/span> 的模与主辐角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> <span class=\"katex-inline\">\\sqrt2<\/span> 与 <span class=\"katex-inline\">\\pi/4<\/span><\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> <span class=\"katex-inline\">2<\/span> 与 <span class=\"katex-inline\">\\pi/4<\/span><\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> <span class=\"katex-inline\">\\sqrt2<\/span> 与 <span class=\"katex-inline\">\\pi/2<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c103' data-chapter='ch01'><p class='quiz-q'><b>Q4.<\/b> 沿绕原点的闭曲线走一圈，<span class=\"katex-inline\">\\ln z<\/span> 的值：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 不变<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 增加 <span class=\"katex-inline\">2\\pi i<\/span><\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 增加 <span class=\"katex-inline\">2\\pi<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c202' data-chapter='ch02'><p class='quiz-q'><b>Q5.<\/b> <span class=\"katex-inline\">f(z)=\\bar z<\/span> 的可导性：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 处处解析<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 处处不解析<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 只在原点解析<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c202' data-chapter='ch02'><p class='quiz-q'><b>Q6.<\/b> 若 <span class=\"katex-inline\">u=x^2-y^2<\/span>，对应的解析函数是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> <span class=\"katex-inline\">z^2<\/span><\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> <span class=\"katex-inline\">\\bar z^2<\/span><\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> <span class=\"katex-inline\">\\lvert z\\rvert^2<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c302' data-chapter='ch03'><p class='quiz-q'><b>Q7.<\/b> <span class=\"katex-inline\">\\oint_{\\lvert z\\rvert=1}\\frac{dz}{z-2}<\/span> 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> <span class=\"katex-inline\">0<\/span><\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> <span class=\"katex-inline\">2\\pi i<\/span><\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> <span class=\"katex-inline\">\\pi i<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c303' data-chapter='ch03'><p class='quiz-q'><b>Q8.<\/b> <span class=\"katex-inline\">\\oint_{\\lvert z-1\\rvert=1}\\frac{e^z}{z-1}dz<\/span> 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> <span class=\"katex-inline\">0<\/span><\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> <span class=\"katex-inline\">2\\pi ie<\/span><\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> <span class=\"katex-inline\">2\\pi i<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c402' data-chapter='ch04'><p class='quiz-q'><b>Q9.<\/b> <span class=\"katex-inline\">\\frac{\\sin z}{z^3}<\/span> 在 <span class=\"katex-inline\">z=0<\/span> 的奇点类型：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 可去奇点<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 二阶极点<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 本性奇点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c404' data-chapter='ch04'><p class='quiz-q'><b>Q10.<\/b> <span class=\"katex-inline\">\\int_{-\\infty}^{\\infty}\\frac{dx}{1+x^2}<\/span> 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> <span class=\"katex-inline\">\\pi<\/span><\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> <span class=\"katex-inline\">2\\pi<\/span><\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> <span class=\"katex-inline\">\\pi/2<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c502' data-chapter='ch05'><p class='quiz-q'><b>Q11.<\/b> <span class=\"katex-inline\">\\mathcal F[e^{-a\\lvert x\\rvert}]<\/span> 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> <span class=\"katex-inline\">\\frac{2a}{a^2+k^2}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> <span class=\"katex-inline\">\\frac{1}{a+ik}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> <span class=\"katex-inline\">\\frac{2}{a^2+k^2}<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c503' data-chapter='ch05'><p class='quiz-q'><b>Q12.<\/b> <span class=\"katex-inline\">\\mathcal F[f&#x27;(x)]<\/span> 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> <span class=\"katex-inline\">ikF(k)<\/span><\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> <span class=\"katex-inline\">-ikF(k)<\/span><\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> <span class=\"katex-inline\">k^2F(k)<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c602' data-chapter='ch06'><p class='quiz-q'><b>Q13.<\/b> <span class=\"katex-inline\">\\mathcal L[f&#x27;&#x27;]<\/span> 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> <span class=\"katex-inline\">s^2F-sf(0)-f&#x27;(0)<\/span><\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> <span class=\"katex-inline\">s^2F<\/span><\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> <span class=\"katex-inline\">sF-f(0)<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single' data-concept='c601' data-chapter='ch06'><p class='quiz-q'><b>Q14.<\/b> <span class=\"katex-inline\">\\frac{1}{s-a}<\/span> 的收敛域是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> <span class=\"katex-inline\">\\operatorname{Re}s&gt;a<\/span><\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> <span class=\"katex-inline\">\\operatorname{Re}s&lt;a<\/span><\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> 全平面<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single' data-concept='c702' data-chapter='ch07'><p class='quiz-q'><b>Q15.<\/b> 一维热传导方程需要几个初始条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> <span class=\"katex-inline\">1<\/span> 个<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> <span class=\"katex-inline\">2<\/span> 个<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> <span class=\"katex-inline\">0<\/span> 个<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q16' data-type='single' data-concept='c702' data-chapter='ch07'><p class='quiz-q'><b>Q16.<\/b> <span class=\"katex-inline\">u_x(0,t)=0<\/span> 属于哪类边界条件？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> Dirichlet<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> Neumann<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> Robin<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single' data-concept='c802' data-chapter='ch08'><p class='quiz-q'><b>Q17.<\/b> 齐次 Dirichlet 边界 <span class=\"katex-inline\">X(0)=X(l)=0<\/span> 的本征函数是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> <span class=\"katex-inline\">\\sin\\frac{n\\pi x}{l}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> <span class=\"katex-inline\">\\cos\\frac{n\\pi x}{l}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> <span class=\"katex-inline\">e^{n\\pi x/l}<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single' data-concept='c803' data-chapter='ch08'><p class='quiz-q'><b>Q18.<\/b> 非齐次边界条件下直接分离变量，问题出在：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 边界不齐次，本征值问题无离散谱<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 方程次数太高<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 初始条件不够<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q19' data-type='single' data-concept='c901' data-chapter='ch09'><p class='quiz-q'><b>Q19.<\/b> 达朗贝尔公式中初始速度项的系数是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> <span class=\"katex-inline\">\\frac{1}{2a}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> <span class=\"katex-inline\">\\frac{1}{a}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> <span class=\"katex-inline\">\\frac{1}{2}<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='single' data-concept='c903' data-chapter='ch09'><p class='quiz-q'><b>Q20.<\/b> 固定端 <span class=\"katex-inline\">u(0,t)=0<\/span> 的反射用哪种延拓？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> 奇延拓<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> 偶延拓<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> 周期延拓<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q21' data-type='single' data-concept='c1001' data-chapter='ch10'><p class='quiz-q'><b>Q21.<\/b> 三维泊松方程的基本解是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q21' value='0'> <span class=\"katex-inline\">\\frac{1}{4\\pi r}<\/span><\/label><label class='quiz-opt'><input type='radio' name='q2
