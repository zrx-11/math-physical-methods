lass='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 恒等于零<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 等于 <span class=\"katex-inline\">f&#x27;&#x27;<\/span><\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 等于 <span class=\"katex-inline\">a^2f<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：复数与复变函数<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c101' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> <span class=\"katex-inline\">z=1+i<\/span> 的模与主辐角是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> <span class=\"katex-inline\">\\sqrt2<\/span> 与 <span class=\"katex-inline\">\\pi/4<\/span><\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> <span class=\"katex-inline\">2<\/span> 与 <span class=\"katex-inline\">\\pi/4<\/span><\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> <span class=\"katex-inline\">\\sqrt2<\/span> 与 <span class=\"katex-inline\">\\pi/2<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c103' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 沿绕原点的闭曲线走一圈，<span class=\"katex-inline\">\\ln z<\/span> 的值：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 不变<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 增加 <span class=\"katex-inline\">2\\pi i<\/span><\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 增加 <span class=\"katex-inline\">2\\pi<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：解析函数<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c202' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> <span class=\"katex-inline\">f(z)=\\bar z<\/span> 的可导性：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 处处解析<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 处处不解析<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 只在原点解析<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c202' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> 若 <span class=\"katex-inline\">u=x^2-y^2<\/span>，对应的解析函数是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> <span class=\"katex-inline\">z^2<\/span><\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> <span class=\"katex-inline\">\\bar z^2<\/span><\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> <span class=\"katex-inline\">\\lvert z\\rvert^2<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：复变积分<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c302' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> <span class=\"katex-inline\">\\oint_{\\lvert z\\rvert=1}\\frac{dz}{z-2}<\/span> 等于：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> <span class=\"katex-inline\">0<\/span><\/label><label class='quiz-op s='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q24' data-type='single' data-concept='c1101' data-chapter='ch11'><p class='quiz-q'><b>Q2.<\/b> 球坐标分离变量中 <span class=\"katex-inline\">l<\/span> 取整数的原因是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q24' value='0'> 解在极点 <span class=\"katex-inline\">\\theta=0,\\pi<\/span> 要有界<\/label><label class='quiz-opt'><input type='radio' name='q24' value='1'> 初始条件要求<\/label><label class='quiz-opt'><input type='radio' name='q24' value='2'> 径向边界要求<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch12__": {"html": "<h1>测验：第 12 章：贝塞尔函数<\/h1><div class='quiz-item' data-qid='q25' data-type='single' data-concept='c1202' data-chapter='ch12'><p class='quiz-q'><b>Q1.<\/b> 圆柱内部解为什么只保留 <span class=\"katex-inline\">J_\\nu<\/span>？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q25' value='0'> <span class=\"katex-inline\">Y_\\nu<\/span> 在原点发散<\/label><label class='quiz-opt'><input type='radio' name='q25' value='1'> <span class=\"katex-inline\">J_\\nu<\/span> 更简单<\/label><label class='quiz-opt'><input type='radio' name='q25' value='2'> <span class=\"katex-inline\">Y_\\nu<\/span> 不满足边界<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q26' data-type='single' data-concept='c1203' data-chapter='ch12'><p class='quiz-q'><b>Q2.<\/b> 傅里叶–贝塞尔展开的正交积分权重是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q26' value='0'> <span class=\"katex-inline\">r<\/span><\/label><label class='quiz-opt'><input type='radio' name='q26' value='1'> <span class=\"katex-inline\">1<\/span><\/label><label class='quiz-opt'><input type='radio' name='q26' value='2'> <span class=\"katex-inline\">\\sin\\theta<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch13__": {"html": "<h1>测验：第 13 章：变分法初步<\/h1><div class='quiz-item' data-qid='q27' data-type='single' data-concept='c1302' data-chapter='ch13'><p class='quiz-q'><b>Q1.<\/b> 欧拉–拉格朗日方程是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q27' value='0'> <span class=\"katex-inline\">\\frac{d}{dx}F_{y&#x27;}-F_y=0<\/span><\/label><label class='quiz-opt'><input type='radio' name='q27' value='1'> <span class=\"katex-inline\">F_y=0<\/span><\/label><label class='quiz-opt'><input type='radio' name='q27' value='2'> <span class=\"katex-inline\">\\frac{d}{dx}F_y-F_{y&#x27;}=0<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q28' data-type='single' data-concept='c1304' data-chapter='ch13'><p class='quiz-q'><b>Q2.<\/b> 瑞利–里兹法给出的本征值近似是：<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q28' value='0'> 上界<\/label><label class='quiz-opt'><input type='radio' name='q28' value='1'> 下界<\/label><label class='quiz-opt'><input type='radio' name='q28' value='2'> 精确值<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='复数'>复数 — 形如 $x+iy$ 的数，也是复平面上的点/向量。 <span class=glossary-ref>（第 1 章：复数与复变函数）<\/span><\/li><li data-term='模与辐角'>模与辐角 — 复数到原点的距离 $r$，以及与正实轴的夹角 $\\theta$；$z=re^{i\\theta}$。 <span class=glossary-ref>（第 1 章：复数与复变函数）<\/span><\/li><li data-term='共轭复数'>共轭复数 — $z=x+iy$ 的共轭是 $\\bar z=x-iy$，且 $z\\bar z=\\lvert z\\rvert^2$。 <span class=glossary-ref>（第 1 章：复数与复变函数）<\/span><\/li><li data-term='复变函数'>复变函数 — 定义域和值域都在复平面上的函数 $w=f(z)$。 <span class=glossary-ref>（第 1 章：复数与复变函数）<\/span><\/li><li data-term='支点'>支点 — 绕一圈后函数值不复原的点，如 $\\sqrt z$、$\\ln z$ 的 $0$ 与 $\\infty$。 <span class=glossary-ref>（第 1 章：复数与复变函数）<\/span><\/li><li data-term='分支切割'>分支切割 — 从支点引出的割线，切开平面后才能选出单值分支。 <span class=glossary-ref>（第 1 章：复数与复变函数）<\/span><\/li><li data-term='解析函数'>解析函数 — 在一点的邻域内处处可导的函数；解析比可导要求更强。 <span class=glossary-ref>（第 2 章：解析函数）<\/span><\/li><li data-term='柯西–黎曼方程'>柯西–黎曼方程 — $u_x=v_y$、$u_y=-v_x$，复可导的充要条件之一。 <span class=glossary-ref>（第 2 章：解析函数）<\/span><\/li><li data-term='调和函数'>调和函数 — 满足 $\\Delta u=0$ 的函数；解析函数的实部与虚部都是。 <span class=glossary-ref>（第 2 章：解析函数）<\/span><\/li><li data-term='保角映射'>保角映射 — 导数非零的解析映射，局部保持角度大小与方向。 <span class=glossary-ref>（第 2 章：解析函数）<\/span><\/li><li data-term='柯西积分定理'>柯西积分定理 — 单连通区域内解析函数的闭路积分为零。 <span class=glossary-ref>（第 3 章：复变积分）<\/span><\/li><li data-term='柯西积分公式'>柯西积分公式 — $f(z_0)=\\frac{1}{2\\pi i}\\oint_C\\frac{f(z)}{z-z_0}dz$。 <span class=glossary-ref>（第 3 章：复变积分）<\/span><\/li><li data-term='刘维尔定理'>刘维尔定理 — 全平面解析且有界的函数必为常数。 <span class=glossary-ref>（第 3 章：复变积分）<\/span><\/li><li data-term='最大模原理'>最大模原理 — 非常数解析函数的模最大值只能在边界取到。 <span class=glossary-ref>（第 3 章：复变积分）<\/span><\/li><li data-term='泰勒级数'>泰勒级数 — 解析点附近的幂级数，收敛半径到最近奇点。 <span class=glossary-ref>（第 4 章：级数展开与留数）<\/span><\/li><li data-term='洛朗级数'>洛朗级数 — 环形区域内允许负幂项的展开。 <span class=glossary-ref>（第 4 章：级数展开与留数）<\/span><\/li><li data-term='孤立奇点'>孤立奇点 — $f$ 在 $z_0$ 附近解析但 $z_0$ 本身不解析；分可去、极点、本性。 <span class=glossary-ref>（第 4 章：级数展开与留数）<\/span><\/li><li data-term='留数'>留数 — 洛朗展开中 $\\frac{1}{z-z_0}$ 项的系数 $a_{-1}$。 <span class=glossary-ref>（第 4 章：级数展开与留数）<\/span><\/li><li data-term='留数定理'>留数定理 — 闭路积分等于 $2\\pi i$ 乘围道内留数之和。 <span class=glossary-ref>（第 4 章：级数展开与留数）<\/span><\/li><li data-term='辐角原理'>辐角原理 — $\\frac{1}{2\\pi i}\\oint\\frac{f&#x27;}{f}dz$ 等于零点数减极点数。 <span class=glossary-ref>（第 4 章：级数展开与留数）<\/span><\/li><li data-term='傅里叶级数'>傅里叶级数 — 周期函数展开成三角函数的级数。 <span class=glossary-ref>（第 5 章：傅里叶变换）<\/span><\/li><li data-term='傅里叶变换'>傅里叶变换 — $F(k)=\\int f(x)e^{-ikx}dx$，把空间描述换成频率描述。 <span class=glossary-ref>（第 5 章：傅里叶变换）<\/span><\/li><li data-term='卷积'>卷积 — $(f*g)(x)=\\int f(\\xi)g(x-\\xi)d\\xi$；频域里是乘法。 <span class=glossary-ref>（第 5 章：傅里叶变换）<\/span><\/li><li data-term='δ函数'>δ函数 — 单位脉冲，$\\int\\delta(x)\\phi(x)dx=\\phi(0)$。 <span class=glossary-ref>（第 5 章：傅里叶变换）<\/span><\/li><li data-term='拉普拉斯变换'>拉普拉斯变换 — $F(s)=\\int_0^{\\infty}f(t)e^{-st}dt$，用于初值问题。 <span class=glossary-ref>（第 6 章：拉普拉斯变换）<\/span><\/li><li data-term='收敛域'>收敛域 — 拉普拉斯积分收敛的 $s$ 范围，通常是右半平面。 <span class=glossary-ref>（第 6 章：拉普拉斯变换）<\/span><\/li><li data-term='传递函数'>传递函数 — 零初值下输出与输入在 $s$ 域的比值。 <span class=glossary-ref>（第 6 章：拉普拉斯变换）<\/span><\/li><li data-term='波动方程'>波动方程 — $u_{tt}=a^2\\Delta u$，双曲型，需要两个初始条件。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='热传导方程'>热传导方程 — $u_t=a^2\\Delta u$，抛物型，只需一个初始条件。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='拉普拉斯方程'>拉普拉斯方程 — $\\Delta u=0$，椭圆型，描述稳态场。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='泊松方程'>泊松方程 — $\\Delta u=-f$，有源的稳态方程。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='dirichlet 边界'>Dirichlet 边界 — 给定边界上的函数值 $u=g$。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='neumann 边界'>Neumann 边界 — 给定边界上的法向导数 $\\partial_nu=g$。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='robin 边界'>Robin 边界 — 函数值与法向导数的线性组合给定。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='定解条件'>定解条件 — 初始条件与边界条件的统称。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='适定性'>适定性 — 解存在、唯一、且连续依赖数据。 <span class=glossary-ref>（第 7 章：方程的建立与定解条件）<\/span><\/li><li data-term='分离变量'>分离变量 — 设乘积解把偏微分方程拆成常微分方程。 <span class=glossary-ref>（第 8 章：分离变量法）<\/span><\/li><li data-term='本征值问题'>本征值问题 — $X&#x27;&#x27;+\\lambda X=0$ 加齐次边界，只有离散的 $\\lambda$ 有非零解。 <span class=glossary-ref>（第 8 章：分离变量法）<\/span><\/li><li data-term='本征函数'>本征函数 — 对应本征值的非零解 $X_n$，构成展开基。 <span class=glossary-ref>（第 8 章：分离变量法）<\/span><\/li><li data-term='正交性'>正交性 — 不同本征值的本征函数内积为零。 <span class=glossary-ref>（第 8 章：分离变量法）<\/span><\/li><li data-term='完备性'>完备性 — 任意满足边界条件的函数都能按本征函数展开。 <span class=glossary-ref>（第 8 章：分离变量法）<\/span><\/li><li data-term='冲量定理'>冲量定理 — 受迫系统的解等于源与自由响应的卷积，也叫杜哈梅原理。 <span class=glossary-ref>（第 8 章：分离变量法）<\/span><\/li><li data-term='达朗贝尔公式'>达朗贝尔公式 — 一维波动方程用初始位移与速度写出的显式解。 <span class=glossary-ref>（第 9 章：行波法与积分变换法）<\/span><\/li><li data-term='特征线'>特征线 — 波动方程中 $x\\pm at=$ 常数的曲线，信息沿它传播。 <span class=glossary-ref>（第 9 章：行波法与积分变换法）<\/span><\/li><li data-term='依赖区域'>依赖区域 — 影响某点取值的初始数据区间 $[x-at,x+at]$。 <span class=glossary-ref>（第 9 章：行波法与积分变换法）<\/span><\/li><li data-term='延拓法'>延拓法 — 把半无界初始数据按奇偶对称延到全轴，用全无界公式求解。 <span class=glossary-ref>（第 9 章：行波法与积分变换法）<\/span><\/li><li data-term='格林函数'>格林函数 — 点源引起的场，满足 $LG=\\delta$ 与齐次边界。 <span class=glossary-ref>（第 10 章：格林函数法）<\/span><\/li><li data-term='基本解'>基本解 — 自由空间中点源的响应，不含边界修正。 <span class=glossary-ref>（第 10 章：格林函数法）<\/span><\/li><li data-term='镜像法'>镜像法 — 在区域外放虚拟源，使边界条件自动满足。 <span class=glossary-ref>（第 10 章：格林函数法）<\/span><\/li><li data-term='推迟势'>推迟势 — 源在 $t-r/a$ 时刻的作用在 $t$ 时刻到达场点。 <span class=glossary-ref>（第 10 章：格林函数法）<\/span><\/li><li data-term='勒让德多项式'>勒让德多项式 — 球坐标极角方程的有界多项式解 $P_l$。 <span class=glossary-ref>（第 11 章：勒让德多项式与球谐函数）<\/span><\/li><li data-term='母函数'>母函数 — $\\frac{1}{\\sqrt{1-2xt+t^2}}=\\sum P_l(x)t^l$。 <span class=glossary-ref>（第 11 章：勒让德多项式与球谐函数）<\/span><\/li><li data-term='罗德里格斯公式'>罗德里格斯公式 — $P_l=\\frac{1}{2^ll!}\\frac{d^l}{dx^l}(x^2-1)^l$。 <span class=glossary-ref>（第 11 章：勒让德多项式与球谐函数）<\/span><\/li><li data-term='连带勒让德函数'>连带勒让德函数 — $P_l^m$，含 $m\\ne0$ 的极角解。 <span class=glossary-ref>（第 11 章：勒让德多项式与球谐函数）<\/span><\/li><li data-term='球谐函数'>球谐函数 — 球面上的正交归一基 $Y_{lm}$。 <span class=glossary-ref>（第 11 章：勒让德多项式与球谐函数）<\/span><\/li><li data-term='贝塞尔函数'>贝塞尔函数 — 柱坐标径向方程的解 $J_\\nu$、$Y_\\nu$。 <span class=glossary-ref>（第 12 章：贝塞尔函数）<\/span><\/li><li data-term='修正贝塞尔函数'>修正贝塞尔函数 — $I_\\nu$、$K_\\nu$，描述指数增长与衰减。 <span class=glossary-ref>（第 12 章：贝塞尔函数）<\/span><\/li><li data-term='球贝塞尔函数'>球贝塞尔函数 — $j_l$、$n_l$，可用正弦余弦除以 $x$ 表示。 <span class=glossary-ref>（第 12 章：贝塞尔函数）<\/span><\/li><li data-term='泛函'>泛函 — 输入为函数、输出为数的映射。 <span class=glossary-ref>（第 13 章：变分法初步）<\/span><\/li><li data-term='变分'>变分 — 函数发生小扰动时泛函的一阶改变量 $\\delta J$。 <span class=glossary-ref>（第 13 章：变分法初步）<\/span><\/li><li data-term='欧拉–拉格朗日方程'>欧拉–拉格朗日方程 — 泛函取驻值的必要条件。 <span class=glossary-ref>（第 13 章：变分法初步）<\/span><\/li><li data-term='哈密顿原理'>哈密顿原理 — 真实运动使作用量 $\\int L\\,dt$ 取驻值。 <span class=glossary-ref>（第 13 章：变分法初步）<\/span><\/li><li data-term='瑞利–里兹法'>瑞利–里兹法 — 用试探函数代入泛函求本征值近似，结果从上方逼近。 <span class=glossary-ref>（第 13 章：变分法初步）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__diagnosis__": {"html": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "kind": "diagnosis", "title": "诊断测试"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架 1：留数算实积分的四步<\/h2>\n<ol><li>\n选围道：有理函数补上半平面大圆弧；三角有理式令 <span class=\"katex-inline\">z=e^{i\\theta}<\/span>；含 <span class=\"katex-inline\">e^{iax}<\/span> 补上半平面。\n<\/li><li>\n找奇点：只要围道内的，边界上的要缩进。\n<\/li><li>\n算留数：一阶用极限，<span class=\"katex-inline\">m<\/span> 阶用导数公式，本性奇点展开。\n<\/li><li>\n估补路：证明补上的弧或小圆积分趋于零（或趋于某个已知值），否则不能直接等于留数结果。\n<\/ol>\n<p><strong>判断顺序<\/strong>：先看被积函数在实轴有没有极点 → 有就缩进取主值；再看大圆弧上是否衰减 → 不衰减就换围道或换方法。<\/p>\n<h2>框架 2：分离变量五步<\/h2>\n<ol><li>\n齐次化：非齐次边界先用辅助函数搬到零；非齐次方程先单独处理源项。\n<\/li><li>\n设乘积解 <span class=\"katex-inline\">u=X(x)T(t)<\/span>，代入齐次方程与齐次边界。\n<\/li><li>\n分离：两边除以 <span class=\"katex-inline\">XT<\/span>，得到&quot;只含 <span class=\"katex-inline\">x<\/span>&quot;等于&quot;只含 <span class=\"katex-inline\">t<\/span>&quot;，令其为 <span class=\"katex-inline\">-\\lambda<\/span>。\n<\/li><li>\n解本征值问题：由边界条件定 <span class=\"katex-inline\">\\lambda_n<\/span>、<span class=\"katex-inline\">X_n<\/span>；解时间方程得 <span class=\"katex-inline\">T_n<\/span>。\n<\/li><li>\n叠加并定系数：<span class=\"katex-inline\">u=\\sum T_n(t)X_n(x)<\/span>，用初始条件与正交性求系数。\n<\/ol>\n<p><strong>判断顺序<\/strong>：边界是齐次的吗 → 不是先齐次化；方程是齐次的吗 → 不是先展源项；<span class=\"katex-inline\">\\lambda<\/span> 取正还是负 → 看边界能否给出非零解。<\/p>\n<h2>框架 3：非齐次问题的三招<\/h2>\n<ul><li>\n<strong>本征函数展开<\/strong>：源项 <span class=\"katex-inline\">f(x,t)=\\sum f_n(t)X_n(x)<\/span>，每项解一个受迫常微分方程。\n<\/li><li>\n<strong>冲量定理（杜哈梅）<\/strong>：零初值受迫解 = <span class=\"katex-inline\">\\int_0^t<\/span> 源×自由响应；适合源随时间变化。\n<\/li><li>\n<strong>边界齐次化<\/strong>：<span class=\"katex-inline\">u=v+w<\/span>，<span class=\"katex-inline\">w<\/span> 取线性/多项式满足非齐次边界，<span class=\"katex-inline\">v<\/span> 满足齐次边界。\n<\/ul>\n<p><strong>选择规则<\/strong>：源项能展开且边界齐次 → 第一招；初值非零、源任意 → 第二招；边界非齐次 → 先第三招，再回到前两招。<\/p>\n<h2>框架 4：格林函数构造<\/h2>\n<ol><li>\n写点源方程 <span class=\"katex-inline\">LG=\\delta(r-r_0)<\/span>。\n<\/li><li>\n求自由空间基本解 <span class=\"katex-inline\">G_0<\/span>。\n<\/li><li>\n加边界修正：镜像法（规则边界）或本征展开（有界区域）。\n<\/li><li>\n验算边界条件：<span class=\"katex-inline\">G<\/span> 在边界上必须满足齐次条件。\n<\/li><li>\n叠加：<span class=\"katex-inline\">u=\\int G f\\,dV<\/span>（加初始条件的对应项）。\n<\/ol>\n<p><strong>选择规则<\/strong>：边界是平面/球面 → 镜像法；边界是矩形/圆柱 → 本征展开；无边界 → 只用基本解。<\/p>\n<h2>框架 5：特殊函数展开<\/h2>\n<ol><li>\n确认坐标与边界：球 → 勒让德/球谐；柱 → 贝塞尔。\n<\/li><li>\n确认边界类型：Dirichlet 用函数零点，Neumann 用导数零点。\n<\/li><li>\n写出正交关系与权重（球谐带 <span class=\"katex-inline\">\\sin\\theta<\/span>，贝塞尔带 <span class=\"katex-inline\">r<\/span>）。\n<\/li><li>\n用正交性算系数，代回级数。\n<\/li><li>\n检查有界性：球心丢 <span class=\"katex-inline\">r^{-(l+1)}<\/span>，柱轴丢 <span class=\"katex-inline\">Y_\\nu<\/span>。\n<\/ol>\n<h2>决策规则<\/h2>\n<ul><li>\n区域无界、无边界 → 行波法或傅里叶变换。\n<\/li><li>\n区域有界、边界是坐标面 → 分离变量。\n<\/li><li>\n方程有源、要算全场 → 格林函数。\n<\/li><li>\n只关心 <span class=\"katex-inline\">t&gt;0<\/span> 的初值问题 → 拉普拉斯变换。\n<\/li><li>\n边界形状复杂但共形映射能化简 → 保角映射 + 拉普拉斯方程。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>拿到方程就分离变量<\/strong>：先确认方程与边界是否齐次，否则第一步就错。\n<\/li><li>\n<strong>算留数不估补路<\/strong>：大圆弧不趋于零时，留数结果不是原积分。\n<\/li><li>\n<strong>把 <span class=\"katex-inline\">\\lambda<\/span> 当自由参数<\/strong>：本征值由边界条件决定，不能任取。\n<\/li><li>\n<strong>格林函数直接用基本解<\/strong>：不满足边界条件，加多少源都错。\n<\/li><li>\n<strong>特殊函数死记公式<\/strong>：先想它解决哪个本征方程，公式可以推。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>复变函数<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>可导判据<\/td><td><span class=\"katex-inline\">u_x=v_y<\/span>，<span class=\"katex-inline\">u_y=-v_x<\/span><\/td><\/tr><tr><td>极坐标形式<\/td><td><span class=\"katex-inline\">u_r=\\\\frac1r v_\\\\theta<\/span>，<span class=\"katex-inline\">v_r=-\\\\frac1r u_\\\\theta<\/span><\/td><\/tr><tr><td>柯西积分公式<\/td><td><span class=\"katex-inline\">f(z_0)=\\\\frac{1}{2\\\\pi i}\\\\oint_C\\\\frac{f(z)}{z-z_0}dz<\/span><\/td><\/tr><tr><td>高阶导数<\/td><td><span class=\"katex-inline\">f^{(n)}(z_0)=\\\\frac{n!}{2\\\\pi i}\\\\oint_C\\\\frac{f(z)}{(z-z_0)^{n+1}}dz<\/span><\/td><\/tr><tr><td>一阶极点留数<\/td><td><span class=\"katex-inline\">\\\\operatorname{Res}f(z_0)=\\\\lim_{z\\\\to z_0}(z-z_0)f(z)<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">m<\/span> 阶极点留数<\/td><td><span class=\"katex-inline\">\\\\frac{1}{(m-1)!}\\\\lim_{z\\\\to z_0}\\\\frac{d^{m-1}}{dz^{m-1}}[(z-z_0)^mf(z)]<\/span><\/td><\/tr><tr><td>留数定理<\/td><td><span class=\"katex-inline\">\\\\oint_C f\\\\,dz=2\\\\pi i\\\\sum\\\\operatorname{Res}<\/span><\/td><\/tr><tr><td>有理函数实积分<\/td><td>补上半平面大圆弧，取上半平面留数<\/td><\/tr><tr><td>三角有理式<\/td><td><span class=\"katex-inline\">z=e^{i\\\\theta}<\/span>，<span class=\"katex-inline\">d\\\\theta=\\\\frac{dz}{iz}<\/span>，单位圆围道<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>积分变换<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>原函数<\/th><th>傅里叶变换<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">\\\\delta(x)<\/span><\/td><td><span class=\"katex-inline\">1<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">1<\/span><\/td><td><span class=\"katex-inline\">2\\\\pi\\\\delta(k)<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">e^{-a\\\\lvert x\\\\rvert}<\/span><\/td><td><span class=\"katex-inline\">\\\\frac{2a}{a^2+k^2}<\/span><\/td><\/tr><tr><td>矩形脉冲高 <span class=\"katex-inline\">1<\/span> 宽 <span class=\"katex-inline\">2a<\/span><\/td><td><span class=\"katex-inline\">\\\\frac{2\\\\sin ka}{k}<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">e^{-x^2/(2\\\\sigma^2)}<\/span><\/td><td><span class=\"katex-inline\">\\\\sigma\\\\sqrt{2\\\\pi}e^{-\\\\sigma^2k^2/2}<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-wrap\"><table><thead><tr><th>性质<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>位移<\/td><td><span class=\"katex-inline\">f(x-x_0)\\\\leftrightarrow e^{-ikx_0}F(k)<\/span><\/td><\/tr><tr><td>缩放<\/td><td><span class=\"katex-inline\">f(ax)\\\\leftrightarrow\\\\frac{1}{\\\\lvert a\\\\rvert}F(k/a)<\/span><\/td><\/tr><tr><td>求导<\/td><td><span class=\"katex-inline\">f&#x27;\\\\leftrightarrow ikF<\/span>，<span class=\"katex-inline\">f&#x27;&#x27;\\\\leftrightarrow-k^2F<\/span><\/td><\/tr><tr><td>卷积<\/td><td><span class=\"katex-inline\">f*g\\\\leftrightarrow FG<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-wrap\"><table><thead><tr><th>拉普拉斯<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">\\\\mathcal L[t^n]<\/span><\/td><td><span class=\"katex-inline\">\\\\frac{n!}{s^{n+1}}<\/span>，<span class=\"katex-inline\">\\\\operatorname{Re}s&gt;0<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\\\mathcal L[e^{at}]<\/span><\/td><td><span class=\"katex-inline\">\\\\frac{1}{s-a}<\/span>，<span class=\"katex-inline\">\\\\operatorname{Re}s&gt;a<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\\\mathcal L[f&#x27;]<\/span><\/td><td><span class=\"katex-inline\">sF(s)-f(0)<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\\\mathcal L[f&#x27;&#x27;]<\/span><\/td><td><span class=\"katex-inline\">s^2F(s)-sf(0)-f&#x27;(0)<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>方程与定解<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>方程<\/th><th>形式<\/th><th>初始条件个数<\/th><\/tr><\/thead><tbody><tr><td>波动<\/td><td><span class=\"katex-inline\">u_{tt}=a^2\\\\Delta u<\/span><\/td><td>2<\/td><\/tr><tr><td>热传导<\/td><td><span class=\"katex-inline\">u_t=a^2\\\\Delta u<\/span><\/td><td>1<\/td><\/tr><tr><td>拉普拉斯/泊松<\/td><td><span class=\"katex-inline\">\\\\Delta u=0<\/span> 或 <span class=\"katex-inline\">\\\\Delta u=-f<\/span><\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"table-wrap\"><table><thead><tr><th>边界<\/th><th>形式<\/th><th>物理<\/th><\/tr><\/thead><tbody><tr><td>Dirichlet<\/td><td><span class=\"katex-inline\">u=g<\/span><\/td><td>固定端、恒温<\/td><\/tr><tr><td>Neumann<\/td><td><span class=\"katex-inline\">\\\\partial_nu=g<\/span><\/td><td>自由端、绝热<\/td><\/tr><tr><td>Robin<\/td><td><span class=\"katex-inline\">\\\\alpha u+\\\\beta\\\\partial_nu=g<\/span><\/td><td>对流换热<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>解法<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>场景<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>达朗贝尔<\/td><td><span class=\"katex-inline\">u=\\\\frac12[\\\\varphi(x-at)+\\\\varphi(x+at)]+\\\\frac{1}{2a}\\\\int_{x-at}^{x+at}\\\\psi(s)ds<\/span><\/td><\/tr><tr><td>齐次 Dirichlet 本征函数<\/td><td><span class=\"katex-inline\">\\\\sin\\\\frac{n\\\\pi x}{l}<\/span>，<span class=\"katex-inline\">\\\\lambda_n=(\\\\frac{n\\\\pi}{l})^2<\/span><\/td><\/tr><tr><td>齐次 Neumann 本征函数<\/td><td><span class=\"katex-inline\">\\\\cos\\\\frac{n\\\\pi x}{l}<\/span>，<span class=\"katex-inline\">n=0,1,2\\\\dots<\/span><\/td><\/tr><tr><td>三维泊松基本解<\/td><td><span class=\"katex-inline\">\\\\frac{1}{4\\\\pi r}<\/span><\/td><\/tr><tr><td>波动推迟格林函数<\/td><td><span class=\"katex-inline\">\\\\frac{\\\\delta(t-t&#x27;-r/a)}{4\\\\pi r}<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>特殊函数<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>函数<\/th><th>关键性质<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">P_l<\/span><\/td><td><span class=\"katex-inline\">\\\\int_{-1}^1P_lP_m=\\\\frac{2}{2l+1}\\\\delta_{lm}<\/span>，<span class=\"katex-inline\">P_l(1)=1<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">P_0,P_1,P_2<\/span><\/td><td><span class=\"katex-inline\">1<\/span>，<span class=\"katex-inline\">x<\/span>，<span class=\"katex-inline\">\\\\frac{3x^2-1}{2}<\/span><\/td><\/tr><tr><td>勒让德递推<\/td><td><span class=\"katex-inline\">(l+1)P_{l+1}=(2l+1)xP_l-lP_{l-1}<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">J_\\\\nu<\/span><\/td><td><span class=\"katex-inline\">J_0(0)=1<\/span>，<span class=\"katex-inline\">Y_\\\\nu(0)=-\\\\infty<\/span><\/td><\/tr><tr><td>贝塞尔递推<\/td><td><span class=\"katex-inline\">J_{\\\\nu-1}+J_{\\\\nu+1}=\\\\frac{2\\\\nu}{x}J_\\\\nu<\/span><\/td><\/tr><tr><td>贝塞尔正交<\/td><td><span class=\"katex-inline\">\\\\int_0^aJ_\\\\nu(\\\\mu_mr)J_\\\\nu(\\\\mu_nr)r\\\\,dr=0<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">j_0<\/span>，<span class=\"katex-inline\">n_0<\/span><\/td><td><span class=\"katex-inline\">\\\\frac{\\\\sin x}{x}<\/span>，<span class=\"katex-inline\">-\\\\frac{\\\\cos x}{x}<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>变分法<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>欧拉–拉格朗日<\/td><td><span class=\"katex-inline\">\\\\frac{d}{dx}F_{y&#x27;}-F_y=0<\/span><\/td><\/tr><tr><td>不显含 <span class=\"katex-inline\">x<\/span><\/td><td><span class=\"katex-inline\">F-y&#x27;F_{y&#x27;}=C<\/span><\/td><\/tr><tr><td>不显含 <span class=\"katex-inline\">y<\/span><\/td><td><span class=\"katex-inline\">F_{y&#x27;}=C<\/span><\/td><\/tr><tr><td>哈密顿原理<\/td><td><span class=\"katex-inline\">\\\\delta\\\\int L\\\\,dt=0<\/span><\/td><\/tr><tr><td>瑞利商<\/td><td><span class=\"katex-inline\">\\\\lambda=\\\\frac{\\\\int\\\\lvert\\\\nabla u\\\\rvert^2}{\\\\int u^2}<\/span>，上界<\/td><\/tr><\/tbody><\/table><\/div>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38456277774157058/数学物理方法-知枢/01-数学物理方法", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 0 章：开课前的数学工具箱", "href": "#/chapter/ch00"}, {"label": "第 1 章：复数与复变函数", "href": "#/chapter/ch01"}, {"label": "第 2 章：解析函数", "href": "#/chapter/ch02"}, {"label": "第 3 章：复变积分", "href": "#/chapter/ch03"}, {"label": "第 4 章：级数展开与留数", "href": "#/chapter/ch04"}, {"label": "第 5 章：傅里叶变换", "href": "#/chapter/ch05"}, {"label": "第 6 章：拉普拉斯变换", "href": "#/chapter/ch06"}, {"label": "第 7 章：方程的建立与定解条件", "href": "#/chapter/ch07"}, {"label": "第 8 章：分离变量法", "href": "#/chapter/ch08"}, {"label": "第 9 章：行波法与积分变换法", "href": "#/chapter/ch09"}, {"label": "第 10 章：格林函数法", "href": "#/chapter/ch10"}, {"label": "第 11 章：勒让德多项式与球谐函数", "href": "#/chapter/ch11"}, {"label": "第 12 章：贝塞尔函数", "href": "#/chapter/ch12"}, {"label": "第 13 章：变分法初步", "href": "#/chapter/ch13"}]}, {"label": "概念", "children": [{"label": "偏导数、全微分与链式法则", "href": "#/concept/c001"}, {"label": "线性常微分方程与特征根法", "href": "#/concept/c002"}, {"label": "无穷级数与收敛半径", "href": "#/concept/c003"}, {"label": "矢量分析与场论记号", "href": "#/concept/c004"}, {"label": "复数 l": "积分变换法解半无界问题", "href": "#/concept/c904"}, {"label": "δ函数与基本解", "href": "#/concept/c1001"}, {"label": "泊松方程格林函数与镜像法", "href": "#/concept/c1002"}, {"label": "波动方程格林函数与推迟势", "href": "#/concept/c1003"}, {"label": "格林函数的本征函数展开", "href": "#/concept/c1004"}, {"label": "球坐标分离变量与勒让德方程", "href": "#/concept/c1101"}, {"label": "勒让德多项式", "href": "#/concept/c1102"}, {"label": "勒让德多项式的正交性与展开", "href": "#/concept/c1103"}, {"label": "连带勒让德函数与球谐函数", "href": "#/concept/c1104"}, {"label": "柱坐标分离变量与贝塞尔方程", "href": "#/concept/c1201"}, {"label": "贝塞尔函数 Jν、Yν 与递推性质", "href": "#/concept/c1202"}, {"label": "贝塞尔函数的正交性与傅里叶–贝塞尔展开", "href": "#/concept/c1203"}, {"label": "修正贝塞尔、球贝塞尔与渐近行为", "href": "#/concept/c1204"}, {"label": "泛函与变分", "href": "#/concept/c1301"}, {"label": "欧拉–拉格朗日方程", "href": "#/concept/c1302"}, {"label": "变分原理与哈密顿原理", "href": "#/concept/c1303"}, {"label": "瑞利–里兹近似方法", "href": "#/concept/c1304"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 0 章：开课前的数学工具箱", "href": "#/quiz/ch00"}, {"label": "测验：第 1 章：复数与复变函数", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：解析函数", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：复变积分", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：级数展开与留数", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：傅里叶变换", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：拉普拉斯变换", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：方程的建立与定解条件", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：分离变量法", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章：行波法与积分变换法", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章：格林函数法", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章：勒让德多项式与球谐函数", "href": "#/quiz/ch11"}, {"label": "测验：第 12 章：贝塞尔函数", "href": "#/quiz/ch12"}, {"label": "测验：第 13 章：变分法初步", "href": "#/quiz/ch13"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch00": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><h1>第 0 章：开课前的数学工具箱<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>这一章解决什么问题<\/h2>\n<p>数学物理方法默认你手里有四种工具：多元微积分、级数、线性常微分方程、矢量场记号。缺一样，后面不是听不懂，是算不动——推导能看明白，轮到自己在纸上走就断。<\/p>\n<p>这一章不重讲微积分，只把后面反复出现的四个动作提前练到不用想：对复合函数做二阶偏导、解常系数线性常微分方程、判断幂级数在哪儿收敛、把矢量微分算子翻译成具体坐标形式。<\/p>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n对 <span class=\"katex-inline\">u(x,t)=f(x-at)<\/span> 这类复合函数求出二阶偏导，并代回方程验证它确实是解\n<\/li><li>\n给定 <span class=\"katex-inline\">y&#x27;&#x27;+py&#x27;+qy=0<\/span>，按特征根三种情况写出通解\n<\/li><li>\n说出一个幂级数的收敛半径由什么决定，边界上为什么可能失效\n<\/li><li>\n看懂 <span class=\"katex-inline\">\\nabla\\cdot\\vec E<\/span>、<span class=\"katex-inline\">\\nabla\\times\\vec B<\/span>，并把它们写成直角坐标的三个分量\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>后面所有&quot;解方程&quot;的动作，最后都落回这四件事：求导、展开成级数、解线性常微分方程、把矢量方程翻译成分量方程。<\/p>\n<h2>概念链（按依赖顺序）<\/h2>\n<ol><li>\n<strong>c001 偏导数、全微分与链式法则<\/strong>——分离变量、坐标变换、验证解都要用；前置：无\n<\/li><li>\n<strong>c002 线性常微分方程与特征根法<\/strong>——分离变量之后剩下的全是这类方程；前置：c001\n<\/li><li>\n<strong>c003 无穷级数与收敛半径<\/strong>——泰勒展开、洛朗展开、本征函数展开的共同语言；前置：无\n<\/li><li>\n<strong>c004 矢量分析与场论记号<\/strong>——建立方程时把 <span class=\"katex-inline\">\\nabla<\/span> 写成坐标形式；前置：c001\n<\/ol>\n<h2>难点地图<\/h2>\n<ul><li>\n<strong>二阶链式法则漏项<\/strong>：<span class=\"katex-inline\">u_{xx}<\/span> 展开会同时出 <span class=\"katex-inline\">f&#x27;&#x27;<\/span> 和 <span class=\"katex-inline\">f&#x27;<\/span> 两类项，少写一个，后面代回方程就配不平，还以为是符号约定问题。\n<\/li><li>\n<strong>重根多出来的那个解<\/strong>：<span class=\"katex-inline\">y&#x27;&#x27;+4y&#x27;+4y=0<\/span> 的通解是 <span class=\"katex-inline\">(C_1+C_2t)e^{-2t}<\/span>，多出的 <span class=\"katex-inline\">t<\/span> 不是技巧，是解空间要凑够两维。\n<\/li><li>\n<strong>收敛半径不是&quot;能算到多大&quot;<\/strong>：<span class=\"katex-inline\">\\sum z^n<\/span> 在 <span class=\"katex-inline\">|z|&lt;1<\/span> 收敛，<span class=\"katex-inline\">z=2<\/span> 发散不是算错，是 <span class=\"katex-inline\">z=1<\/span> 的奇点挡住了。\n<\/ul>\n<h2>与前后章的接口<\/h2>\n<p>本章不产出理论，只交付工具。第 1 章开始复数运算立刻要用级数；第 7 章建立方程要用矢量记号；第 8 章分离变量会把特征根法用到熟练。<\/p>\n<h2>检查点<\/h2>\n<p>学完先自测，答不上就回去补：<\/p>\n<ul><li>\n给定 <span class=\"katex-inline\">u(x,t)=f(x-at)<\/span>，能否在两张纸上算出 <span class=\"katex-inline\">u_{tt}-a^2u_{xx}=0<\/span>\n<\/li><li>\n能否写出 <span class=\"katex-inline\">y&#x27;&#x27;+4y&#x27;+4y=0<\/span> 的通解，并解释为什么不是一个指数函数\n<\/li><li>\n能否说明 <span class=\"katex-inline\">\\sum_{n=0}^{\\infty}z^n<\/span> 的收敛圆在哪、边界上发生什么\n<\/ul>\n<h2>下一步<\/h2>\n<p>进第 1 章，把数从实数扩到复数。先只做一件事：习惯&quot;复数是一个点，也是一个箭头&quot;。<\/p>", "ch01": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch00\">第 0 章：开课前的数学工具箱<\/a><\/span><\/div><h1>第 1 章：复数与复变函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 0 章\n<\/ul>\n<h2>这一章解决什么问题<\/h2>\n<p>实数不够用，不是因为方程没解，而是因为振荡、波动、交流电这类问题用复数写出来最短：一个 <span class=\"katex-inline\">e^{i\\omega t}<\/span> 同时带着幅值和相位。代价是必须接受&quot;函数定义在平面上&quot;，而不是一条线上。<\/p>\n<p>这一章把复数从&quot;凭空多出来的 <span class=\"katex-inline\">i<\/span>&quot;变成一张能画、能算、能取极限的平面，并处理第一个真正的麻烦：<span class=\"katex-inline\">\\sqrt z<\/span> 和 <span class=\"katex-inline\">\\ln z<\/span> 不是单值函数。<\/p>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n在复平面上完成加减乘除与乘方开方，并说出每一步的几何意义\n<\/li><li>\n判断一个复变函数在哪里连续、哪里没有定义\n<\/li><li>\n面对 <span class=\"katex-inline\">\\sqrt z<\/span>、<span class=\"katex-inline\">\\ln z<\/span> 时画出分支切割，说明为什么必须切\n<\/li><li>\n说清&quot;无穷远点&quot;在复球面上是哪个点\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>复数乘法是&quot;模相乘、角相加&quot;；多值函数的全部麻烦来自角可以绕圈。<\/p>\n<h2>概念链（按依赖顺序）<\/h2>\n<ol><li>\n<strong>c101 复数与复平面运算<\/strong>——<span class=\"katex-inline\">z=x+iy<\/span>，三角式、指数式，乘除的几何意义；前置：无\n<\/li><li>\n<strong>c102 复变函数的极限与连续<\/strong>——二维极限要求沿所有方向逼近得到同一个数；前置：c101\n<\/li><li>\n<strong>c104 复球面与无穷远点<\/strong>——把平面卷成球，<span class=\"katex-inline\">\\infty<\/span> 变成一个普通点；前置：c101\n<\/li><li>\n<strong>c103 多值函数与分支切割<\/strong>——绕原点一圈相位变 <span class=\"katex-inline\">2\\pi<\/span>，必须切开平面才能选出单值分支；前置：c101、c102\n<\/ol>\n<h2>难点地图<\/h2>\n<ul><li>\n<strong><span class=\"katex-inline\">\\arg z<\/span> 与 <span class=\"katex-inline\">\\mathrm{Arg}\\,z<\/span> 混用<\/strong>：前者是多值的，后者是主值。写错这一条，第 4 章留数算积分会稳定差 <span class=\"katex-inline\">2\\pi i<\/span>。\n<\/li><li>\n<strong>分支切割的位置<\/strong>：切在负实轴还是正实轴，决定 <span class=\"katex-inline\">\\sqrt z<\/span> 在切口两侧差哪个符号。不是随便画条线。\n<\/li><li>\n<strong>无穷远点的邻域<\/strong>：它是&quot;大圆的外部&quot;，直观上和有限点相反，第一次画图容易画反。\n<\/ul>\n<h2>与前后章的接口<\/h2>\n<p>上一章给了级数与偏导；这一章给的复平面是第 2 章解析函数的场地。<span class=\"katex-inline\">\\ln z<\/span> 的分支问题会一路留到第 4 章（支点积分）和第 5 章（傅里叶变换的解析延拓讨论）。<\/p>\n<h2>检查点<\/h2>\n<ul><li>\n把 <span class=\"katex-inline\">1+i<\/span> 写成指数式，并求出它的三次方根，说出三个根在圆上的位置\n<\/li><li>\n解释为什么 <span class=\"katex-inline\">\\ln z<\/span> 沿负实轴切开后可以取出单值分支\n<\/li><li>\n说出 <span class=\"katex-inline\">z=0<\/span> 对 <span class=\"katex-inline\">\\frac{1}{z}<\/span>、<span class=\"katex-inline\">\\sqrt z<\/span>、<span class=\"katex-inline\">\\ln z<\/span> 分别是哪种特殊点\n<\/ul>\n<h2>下一步<\/h2>\n<p>第 2 章给&quot;可导&quot;加一个比实函数强得多的条件：不只方向导数存在，而且所有方向必须一致。<\/p>", "ch02": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch01\">第 1 章：复数与复变函数<\/a><\/span><\/div><h1>第 2 章：解析函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>这一章解决什么问题<\/h2>\n<p>实函数可导只要求左右导数相等；复函数可导要求从任意方向逼近的差商都收敛到同一个复数。这个苛刻条件换来一个惊人的结果：只要一阶可导，就自动无限可导，还能在邻域内展开成幂级数。<\/p>\n<p>整门课的计算优势都建立在这条上。这一章的任务是把&quot;解析&quot;从定义变成可操作的判据，并且认识一批标准解析函数。<\/p>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用柯西–黎曼方程判断一个函数在哪里解析\n<\/li><li>\n给定解析函数的实部，求出它的虚部（差一个常数）\n<\/li><li>\n认出 <span class=\"katex-inline\">\\exp z<\/span>、<span class=\"katex-inline\">\\sin z<\/span>、<span class=\"katex-inline\">\\ln z<\/span>、<span class=\"katex-inline\">z^\\alpha<\/span> 的解析区域和特殊点\n<\/li><li>\n说清保角映射保持什么、不保持什么\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>解析 = 可导 + 邻域内处处可导；柯西–黎曼方程是可导的另一种写法，也是&quot;实部虚部互为调和函数&quot;的来源。<\/p>\n<h2>概念链（按依赖顺序）<\/h2>\n<ol><li>\n<strong>c201 复导数与解析函数<\/strong>——差商极限，以及&quot;邻域内可导&quot;这个附加要求；前置：c102\n<\/li><li>\n<strong>c202 柯西–黎曼方程<\/strong>——<span class=\"katex-inline\">u_x=v_y<\/span>、<span class=\"katex-inline\">u_y=-v_x<\/span>，判定与构造解析函数的入口；前置：c201、c001\n<\/li><li>\n<strong>c203 调和函数与共轭调和函数<\/strong>——解析函数的实部虚部都满足 <span class=\"katex-inline\">\\Delta u=0<\/span>，可直接用于二维静电场；前置：c202\n<\/li><li>\n<strong>c204 初等解析函数<\/strong>——指数、对数、幂、三角在复平面上的定义，周期性与多值性；前置：c103、c201\n<\/li><li>\n<strong>c205 保角映射初步<\/strong>——导数非零处角度不变，用来把复杂边界化成简单边界；前置：c201、c202\n<\/ol>\n<h2>难点地图<\/h2>\n<ul><li>\n<strong>柯西–黎曼方程的符号<\/strong>：<span class=\"katex-inline\">u_y=-v_x<\/span> 很容易写成 <span class=\"katex-inline\">u_y=v_x<\/span>。一个符号错，整章判断题全部反过来。\n<\/li><li>\n<strong><span class=\"katex-inline\">z^\\alpha<\/span> 在原点是否解析取决于 <span class=\"katex-inline\">\\alpha<\/span><\/strong>：只有 <span class=\"katex-inline\">\\alpha<\/span> 为非负整数时原点才解析，其余在原点有支点或奇点。\n<\/li><li>\n<strong>保角映射保角不保长度<\/strong>：算边界条件时要乘 <span class=\"katex-inline\">|f&#x27;(z)|<\/span>。漏掉这个因子，解的幅值整体错，形状却是对的，很难发现。\n<\/ul>\n<h2>与前后章的接口<\/h2>\n<p>第 1 章给了场地；这一章的解析性是第 3 章柯西定理的前提——函数不解析，积分路径就不能随意变形。第 4 章的留数只对孤立奇点定义，而奇点正是解析性破裂的点。<\/p>\n<h2>检查点<\/h2>\n<ul><li>\n判断 <span class=\"katex-inline\">f(z)=\\bar z<\/span> 是否解析，用柯西–黎曼方程说明\n<\/li><li>\n由 <span class=\"katex-inline\">u=x^2-y^2<\/span> 求 <span class=\"katex-inline\">v<\/span>，写出对应的解析函数\n<\/li><li>\n说明 <span class=\"katex-inline\">\\exp z<\/span> 的周期为什么是 <span class=\"katex-inline\">2\\pi i<\/span> 而不是 <span class=\"katex-inline\">2\\pi<\/span>\n<\/ul>\n<h2>下一步<\/h2>\n<p>第 3 章：解析函数沿闭路积分等于零。这一条看着简单，后面所有积分技巧都从它长出来。<\/p>", "ch03": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch02\">第 2 章：解析函数<\/a><\/span><\/div><h1>第 3 章：复变积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1、2 章\n<\/ul>\n<h2>这一章解决什么问题<\/h2>\n<p>实积分沿区间走，复积分沿曲线走。路径一多，立刻有一个问题：换一条路，积分值变不变？柯西定理回答：只要函数在两条路围成的区域里解析，就不变。这一条把&quot;算积分&quot;变成&quot;选一条最好算的路&quot;。<\/p>\n<p>柯西积分公式再往前一步：围道上的函数值本身就能用积分表示。到这一章结束，复积分不再是一个要硬算的量，而是一个可以变形的对象。<\/p>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n沿参数曲线计算 <span class=\"katex-inline\">\\int_C f(z)\\,dz<\/span>\n<\/li><li>\n用柯西定理把复杂路径收缩成小圆\n<\/li><li>\n用柯西积分公式算围道内部的函数值和导数\n<\/li><li>\n用最大模原理排除&quot;解析函数在内部取到最大模&quot;的可能\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>解析函数的积分只认端点和围住的奇点，不认路怎么走。<\/p>\n<h2>概念链（按依赖顺序）<\/h2>\n<ol><li>\n<strong>c301 复变积分与路径积分<\/strong>——<span class=\"katex-inline\">dz<\/span> 是复数，积分要参数化；前置：c102\n<\/li><li>\n<strong>c302 柯西积分定理<\/strong>——单连通区域内解析则闭路积分为零，多连通要加内边界；前置：c301、c201\n<\/li><li>\n<strong>c303 柯西积分公式<\/strong>——<span class=\"katex-inline\">f(z_0)=\\frac{1}{2\\pi i}\\oint_C\\frac{f(z)}{z-z_0}dz<\/span>；前置：c302\n<\/li><li>\n<strong>c304 高阶导数公式与刘维尔定理<\/strong>——导数也能用积分表示；有界整函数必为常数；前置：c303\n<\/li><li>\n<strong>c305 最大模原理<\/strong>——解析函数的模最大值只能在边界取到；前置：c303、c203\n<\/ol>\n<h2>难点地图<\/h2>\n<ul><li>\n<strong>多连通区域的内边界方向<\/strong>：外圈逆时针、内圈顺时针。方向反了，结果差一个符号，而且检验不出来，因为不少题答案是零。\n<\/li><li>\n<strong>柯西公式的适用前提<\/strong>：<span class=\"katex-inline\">f<\/span> 必须在围道内解析。围道上有奇点，得先挖小圆，不能直接套公式。\n<\/li><li>\n<strong>最大模原理的边界情形<\/strong>：常数函数平凡成立。考试常拿它证明&quot;非常数解析函数没有内部极大值&quot;，证明里要排除常数。\n<\/ul>\n<h2>与前后章的接口<\/h2>\n<p>第 2 章给了&quot;解析&quot;的定义；这一章把解析性变成积分性质。第 4 章的泰勒、洛朗展开，本质是在小圆上反复使用柯西公式求导。<\/p>\n<h2>检查点<\/h2>\n<ul><li>\n算 <span class=\"katex-inline\">\\oint_{|z|=1}\\frac{dz}{z-2}<\/span>，说明为什么是零\n<\/li><li>\n算 <span class=\"katex-inline\">\\oint_{|z-1|=1}\\frac{e^z}{z-1}dz<\/span>\n<\/li><li>\n用最大模原理解释：单位圆内解析且 <span class=\"katex-inline\">|f|\\le1<\/span>，内部不可能出现 <span class=\"katex-inline\">|f|&gt;1<\/span>\n<\/ul>\n<h2>下一步<\/h2>\n<p>第 4 章把&quot;围住奇点&quot;做成标准流程：留数。<\/p>", "ch04": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch03\">第 3 章：复变积分<\/a><\/span><\/div><h1>第 4 章：级数展开与留数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：8 小时 | <strong>前置<\/strong>：第 1–3 章\n<\/ul>\n<h2>这一章解决什么问题<\/h2>\n<p>柯西公式能算积分，但每次都要参数化很烦。留数定理把闭路积分换成一个代数动作：数一数围住哪些奇点，每个奇点取一个系数，加起来乘 <span class=\"katex-inline\">2\\pi i<\/span>。这一章还顺手解决实积分——把实轴上的积分补成闭路，用留数算。<\/p>\n<p>这是复变部分的收口，也是整门课第一种真正好用的计算工具。<\/p>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n求函数在指定点附近的泰勒展开与洛朗展开，判断奇点类型\n<\/li><li>\n算一阶极点、<span class=\"katex-inline\">m<\/span> 阶极点、本性奇点的留数\n<\/li><li>\n用留数算三类实积分：有理函数、三角有理式、含 <span class=\"katex-inline\">e^{iax}<\/span> 的无穷积分\n<\/li><li>\n遇到支点时知道要绕开切口，并说明结果为什么会多出对数项\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>留数就是洛朗展开里 <span class=\"katex-inline\">\\frac{1}{z-z_0}<\/span> 那一项的系数；闭路积分只认它。<\/p>\n<h2>概念链（按依赖顺序）<\/h2>\n<ol><li>\n<strong>c401 泰勒级数<\/strong>——解析点附近的幂级数，收敛半径由最近奇点决定；前置：c201、c303\n<\/li><li>\n<strong>c402 洛朗级数与孤立奇点分类<\/strong>——环形区域展开，按负幂项分成可去、极点、本性；前置：c401\n<\/li><li>\n<strong>c403 留数与留数定理<\/strong>——<span class=\"katex-inline\">\\operatorname{Res}f(z_0)=a_{-1}<\/span>，闭路积分 <span class=\"katex-inline\">=2\\pi i\\sum<\/span>；前置：c402、c302\n<\/li><li>\n<strong>c404 用留数计算实积分<\/strong>——补弧、缩进、Jordan 引理三条路；前置：c403\n<\/li><li>\n<strong>c405 支点、多值积分与辐角原理<\/strong>——<span class=\"katex-inline\">\\ln z<\/span> 型积分要绕支点；辐角原理数零点减极点；前置：c103、c403\n<\/ol>\n<h2>难点地图<\/h2>\n<ul><li>\n<strong>本性奇点的留数<\/strong>：它是整个洛朗级数的 <span class=\"katex-inline\">a_{-1}<\/span>，不是某一项。<span class=\"katex-inline\">\\sin(1/z)<\/span> 这种必须先展开再找系数。\n<\/li><li>\n<strong>大圆弧估计<\/strong>：补闭合路径时，&quot;大圆弧上积分趋于零&quot;不是看一眼就成立，要估阶；含 <span class=\"katex-inline\">e^{iax}<\/span> 的还要 Jordan 引理。\n<\/li><li>\n<strong>支点积分绕一圈的增量<\/strong>：绕支点回到原处，函数值多了 <span class=\"katex-inline\">2\\pi i<\/span> 的对数项。漏掉它，结果少一整块。\n<\/ul>\n<h2>与前后章的接口<\/h2>\n<p>这一章是复变部分的终点，也是工具层的第一次成型。傅里叶逆变换、拉普拉斯逆变换，本质都是复平面上的围道积分，方法直接搬过去。<\/p>\n<h2>检查点<\/h2>\n<ul><li>\n判断 <span class=\"katex-inline\">\\frac{\\sin z}{z^3}<\/span> 在 <span class=\"katex-inline\">z=0<\/span> 的奇点类型，并求留数\n<\/li><li>\n算 <span class=\"katex-inline\">\\int_{-\\infty}^{\\infty}\\frac{dx}{1+x^2}<\/span>，写清补弧与留数两步\n<\/li><li>\n说明 <span class=\"katex-inline\">\\int_0^\\infty\\frac{x^{a-1}}{1+x}dx<\/span> 为什么要绕支点，绕完多了什么\n<\/ul>\n<h2>下一步<\/h2>\n<p>进第 5 章，从复平面转到实轴上的积分变换。留数不会消失——逆变换还要回来用它。<\/p>", "ch05": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch00\">第 0 章：开课前的数学工具箱<\/a><\/span> · <span class=\"prereq-rec\"><span class=\"prereq-tag\">拓<\/span> <a href=\"#/chapter/ch04\">第 4 章：级数展开与留数<\/a><\/span><\/div><h1>第 5 章：傅里叶变换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 0 章（级数）\n<\/ul>\n<h2>这一章解决什么问题<\/h2>\n<p>一个函数在空间（或时间）里描述，和它在频率里描述，是同一件事的两种写法。傅里叶变换就是换写法。换过去的好处很直接：求导变成乘 <span class=\"katex-inline\">ik<\/span>，卷积变成乘法，偏微分方程变成代数方程。<\/p>\n<p>这一章从周期函数的傅里叶级数出发，让周期趋于无穷，得到非周期函数的傅里叶积分，再引入 <span class=\"katex-inline\">\\delta<\/span> 函数处理点源。<\/p>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n说清周期趋于无穷时，离散频率如何变成连续频谱\n<\/li><li>\n写出常用变换对：矩形脉冲、单边指数、高斯、<span class=\"katex-inline\">\\delta<\/span>\n<\/li><li>\n用位移、相似、求导、卷积四条性质做题\n<\/li><li>\n用傅里叶变换把热传导方程的初值问题解到积分表达式\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>傅里叶变换把&quot;求导&quot;和&quot;卷积&quot;这两个麻烦动作，换成&quot;乘 <span class=\"katex-inline\">ik<\/span>&quot;和&quot;乘起来&quot;。<\/p>\n<h2>概念链（按依赖顺序）<\/h2>\n<ol><li>\n<strong>c501 傅里叶级数与频谱<\/strong>——周期函数的离散分解，系数就是频谱；前置：c003\n<\/li><li>\n<strong>c502 傅里叶变换与逆变换<\/strong>——周期趋于无穷的极限，<span class=\"katex-inline\">F(k)=\\int f(x)e^{-ikx}dx<\/span>；前置：c501\n<\/li><li>\n<strong>c503 傅里叶变换的性质与卷积定理<\/strong>——位移、缩放、求导、卷积；前置：c502\n<\/li><li>\n<strong>c504 <span class=\"katex-inline\">\\delta<\/span> 函数及其傅里叶表示<\/strong>——点源、筛选性质、变换为常数；前置：c502\n<\/li><li>\n<strong>c505 用傅里叶变换解偏微分方程<\/strong>——热传导初值问题、波动方程；前置：c502、c503\n<\/ol>\n<h2>难点地图<\/h2>\n<ul><li>\n<strong>符号约定与 <span class=\"katex-inline\">2\\pi<\/span> 的位置<\/strong>：教材里有三种写法，混用会差 <span class=\"katex-inline\">2\\pi<\/span> 的整数次幂。本系统统一用 <span class=\"katex-inline\">F(k)=\\int f(x)e^{-ikx}dx<\/span>、<span class=\"katex-inline\">f(x)=\\frac{1}{2\\pi}\\int F(k)e^{ikx}dk<\/span>。\n<\/li><li>\n<strong>卷积定理的适用条件<\/strong>：两个函数都要可变换，卷积要存在。边界情形（常数函数）要单独处理。\n<\/li><li>\n<strong><span class=\"katex-inline\">\\delta<\/span> 不是普通函数<\/strong>：它只在积分号里有意义，单独问&quot;<span class=\"katex-inline\">\\delta(0)<\/span> 等于多少&quot;没有答案。\n<\/ul>\n<h2>与前后章的接口<\/h2>\n<p>第 4 章的围道积分是逆变换的工具；这一章把微分方程搬到频域。第 9 章用它解半无界问题，第 10 章的格林函数在频域里就是传播子。<\/p>\n<h2>检查点<\/h2>\n<ul><li>\n求 <span class=\"katex-inline\">e^{-a|x|}<\/span> 的傅里叶变换，并说明它在 <span class=\"katex-inline\">k=0<\/span> 的值\n<\/li><li>\n用卷积定理把 <span class=\"katex-inline\">\\partial_tu=a^2\\partial_{xx}u<\/span> 的初值问题写成积分\n<\/li><li>\n说明 <span class=\"katex-inline\">f(x-x_0)<\/span> 的频谱与 <span class=\"katex-inline\">f(x)<\/span> 的频谱差什么\n<\/ul>\n<h2>下一步<\/h2>\n<p>第 6 章：拉普拉斯变换。相当于&quot;只取 <span class=\"katex-inline\">t&gt;0<\/span>、再乘一个衰减因子&quot;的傅里叶变换，专门对付初值问题。<\/p>", "ch06": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch00\">第 0 章：开课前的数学工具箱<\/a><\/span> · <span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/chapter/ch05\">第 5 章：傅里叶变换<\/a><\/span><\/div><h1>第 6 章：拉普拉斯变换<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 0 章\n<\/ul>\n<h2>这一章解决什么问题<\/h2>\n<p>傅里叶变换要求函数在全实轴上有定义、可积，但初值问题只关心 <span class=\"katex-inline\">t&gt;0<\/span>，还经常有指数增长（比如 <span class=\"katex-inline\">e^{3t}<\/span>）。拉普拉斯变换把 <span class=\"katex-inline\">t&lt;0<\/span> 切掉、乘上 <span class=\"katex-inline\">e^{-st}<\/span> 压住增长，代价是逆变换要走复平面围道。<\/p>\n<p>它是工程和物理里解初值问题最顺手的工具：微分方程加初始条件，整体打包成一个代数方程。<\/p>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出定义与收敛域，判断哪些函数存在变换\n<\/li><li>\n用性质表求 <span class=\"katex-inline\">t^n<\/span>、<span class=\"katex-inline\">e^{at}<\/span>、<span class=\"katex-inline\">\\sin\\omega t<\/span>、<span class=\"katex-inline\">\\delta(t)<\/span> 的像函数\n<\/li><li>\n用部分分式与卷积定理求逆变换\n<\/li><li>\n把二阶常系数初值问题解成代数方程，再变回时间域\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>拉普拉斯变换把&quot;微分方程 + 初始条件&quot;整体打包成一个代数方程，初始条件自动进分子。<\/p>\n<h2>概念链（按依赖顺序）<\/h2>\n<ol><li>\n<strong>c601 拉普拉斯变换与收敛域<\/strong>——<span class=\"katex-inline\">F(s)=\\int_0^\\infty f(t)e^{-st}dt<\/span>，<span class=\"katex-inline\">\\operatorname{Re}s&gt;\\sigma_0<\/span>；前置：c002\n<\/li><li>\n<strong>c602 拉普拉斯变换的性质<\/strong>——线性、位移、导数、积分、初值终值定理；前置：c601\n<\/li><li>\n<strong>c603 逆变换：部分分式与卷积<\/strong>——极点决定时间域的形状；前置：c602\n<\/li><li>\n<strong>c604 用拉普拉斯变换解初值问题<\/strong>——把 <span class=\"katex-inline\">y&#x27;&#x27;+ay&#x27;+by=f<\/span> 变成 <span class=\"katex-inline\">Y(s)<\/span> 的代数式；前置：c603、c002\n<\/ol>\n<h2>难点地图<\/h2>\n<ul><li>\n<strong>收敛域不能丢<\/strong>：<span class=\"katex-inline\">1/(s-a)<\/span> 在不同收敛域对应右边信号或左边信号，逆变换结果不同。\n<\/li><li>\n<strong>导数性质带初始条件<\/strong>：<span class=\"katex-inline\">\\mathcal{L}[y&#x27;]=sY(s)-y(0)<\/span>，漏掉 <span class=\"katex-inline\">y(0)<\/span> 整题错。\n<\/li><li>\n<strong>重极点的部分分式<\/strong>：<span class=\"katex-inline\">1/(s-a)^2<\/span> 项要单独设系数，不能只写 <span class=\"katex-inline\">A/(s-a)<\/span>。\n<\/ul>\n<h2>与前后章的接口<\/h2>\n<p>第 5 章的频域思想在这里变成复频域。逆变换的围道积分用第 4 章留数。第 9 章用它解半无界热传导和半无限长杆的初值问题。<\/p>\n<h2>检查点<\/h2>\n<ul><li>\n求 <span class=\"katex-inline\">\\mathcal{L}[t]<\/span>、<span class=\"katex-inline\">\\mathcal{L}[e^{at}]<\/span> 及各自收敛域\n<\/li><li>\n解 <span class=\"katex-inline\">y&#x27;+y=1<\/span>、<span class=\"katex-inline\">y(0)=0<\/span>，全程用拉普拉斯变换\n<\/li><li>\n说明为什么不能简单令 <span class=\"katex-inline\">s=i\\omega<\/span> 就把两种变换等同\n<\/ul>\n<h2>下一步<\/h2>\n<p>第 7 章开始真正的物理建模：从守恒律和本构关系导出三类方程。<\/p>", "ch07": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch00\">第 0 章：开课前的数学工具箱<\/a><\/span> · <span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/chapter/ch06\">第 6 章：拉普拉斯变换<\/a><\/span><\/div><h1>第 7 章：方程的建立与定解条件<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 0 章\n<\/ul>\n<h2>这一章解决什么问题<\/h2>\n<p>前面都是工具。这一章开始把物理问题写成方程：弦振动、热传导、静电场，三类方程长得不同，推导套路一样——取一个微元，写守恒，让微元趋于零。<\/p>\n<p>方程只描述&quot;内部怎么变&quot;。要定住唯一的解，还得给初始状态和边界状态，这就是定解条件。这一章把方程的来源和条件的写法一次讲清。<\/p>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n独立导出弦振动方程、一维热传导方程、二维拉普拉斯方程\n<\/li><li>\n写对初始条件：波动方程要位移和速度，热传导只要温度\n<\/li><li>\n区分三类边界条件（Dirichlet、Neumann、Robin）及其物理含义\n<\/li><li>\n用叠加原理把非齐次问题拆成齐次问题\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>方程描述&quot;内部怎么变&quot;，定解条件描述&quot;边界和初始怎么给&quot;，两者缺一，解不唯一。<\/p>\n<h2>概念链（按依赖顺序）<\/h2>\n<ol><li>\n<strong>c701 三类典型数学物理方程<\/strong>——波动、热传导、拉普拉斯/泊松；前置：c001、c004\n<\/li><li>\n<strong>c702 初始条件与三类边界条件<\/strong>——物理含义与数学形式；前置：c701\n<\/li><li>\n<strong>c703 叠加原理与齐次化<\/strong>——非齐次 = 特解 + 齐次通解；边界非齐次先做变量替换；前置：c701\n<\/li><li>\n<strong>c704 定解问题的适定性<\/strong>——存在、唯一、稳定；前置：c702\n<\/ol>\n<h2>难点地图<\/h2>\n<ul><li>\n<strong>初始条件个数由方程对时间的阶数决定<\/strong>：波动方程二阶，要两个；热传导一阶，只要一个。多给一个不是&quot;更充分&quot;，是矛盾。\n<\/li><li>\n<strong>Neumann 边界给的是法向导数<\/strong>：物理上是绝热或自由端，不是&quot;边界值等于零&quot;。\n<\/li><li>\n<strong>非齐次边界不能直接分离变量<\/strong>：必须先找辅助函数把边界搬到零，否则分离出来的常微分方程边界条件不齐次。\n<\/ul>\n<h2>与前后章的接口<\/h2>\n<p>第 5、6 章的变换是解方程的手段；这一章产出待解的问题。第 8 章分离变量、第 9 章行波、第 10 章格林函数，都是对同一批方程的不同解法。<\/p>\n<h2>检查点<\/h2>\n<ul><li>\n说出弦振动方程推导中&quot;微元受力&quot;和&quot;小角近似&quot;分别用在哪一步\n<\/li><li>\n给一根&quot;一端固定、一端自由&quot;的弦，写出两个边界条件\n<\/li><li>\n说明为什么热传导方程不能给两个初始条件\n<\/ul>\n<h2>下一步<\/h2>\n<p>第 8 章：分离变量。把偏微分方程拆成一串常微分方程。<\/p>", "ch08": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch07\">第 7 章：方程的建立与定解条件<\/a><\/span><\/div><h1>第 8 章：分离变量法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：10 小时 | <strong>前置<\/strong>：第 7 章\n<\/ul>\n<h2>这一章解决什么问题<\/h2>\n<p>矩形、圆柱、球里的方程，边界正好是坐标面，解可以写成&quot;各方向函数的乘积&quot;。分离变量把这个假设代进去，每个方向得到一个常微分方程，边界条件挑出本征值和本征函数。<\/p>\n<p>难点不在推导，在边界条件如何决定本征值，以及非齐次项怎么处理。这一章是整门课分量最重的一章，后面的特殊函数全是它的产物。<\/p>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n完整走完&quot;设乘积解 → 分离 → 本征值问题 → 叠加 → 定系数&quot;五步\n<\/li><li>\n解齐次边界下的本征值问题，写出本征函数系\n<\/li><li>\n用本征函数展开处理非齐次方程，用辅助函数处理非齐次边界\n<\/li><li>\n说明正交性为什么保证展开系数唯一\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>分离变量 = 把一个偏微分方程换成无穷多个常微分方程，本征值由边界条件挑出来。<\/p>\n<h2>概念链（按依赖顺序）<\/h2>\n<ol><li>\n<strong>c801 分离变量法的基本步骤<\/strong>——<span class=\"katex-inline\">u=X(x)T(t)<\/span>，两边除以 <span class=\"katex-inline\">u<\/span>，令比值为常数；前置：c702、c002\n<\/li><li>\n<strong>c802 本征值问题与本征函数<\/strong>——<span class=\"katex-inline\">X&#x27;&#x27;+\\lambda X=0<\/span> 加边界，只有特定 <span class=\"katex-inline\">\\lambda<\/span> 有非零解；前置：c801、c002\n<\/li><li>\n<strong>c804 正交性与完备性<\/strong>——不同本征值的本征函数正交，可展开任意函数；前置：c802、c003\n<\/li><li>\n<strong>c803 非齐次方程与非齐次边界<\/strong>——本征函数展开、冲量定理（杜哈梅）、边界齐次化；前置：c802、c703\n<\/li><li>\n<strong>c805 二维与三维分离变量<\/strong>——直角、柱、球坐标下的分离与本征函数选择；前置：c802、c004\n<\/ol>\n<h2>难点地图<\/h2>\n<ul><li>\n<strong>分离常数取正还是负<\/strong>：由边界条件能否给出非零解决定。取错方向，只剩零解，而且很难回头怀疑这一步。\n<\/li><li>\n<strong>非齐次项的展开系数含时间<\/strong>：<span class=\"katex-inline\">f(x,t)=\\sum f_n(t)X_n(x)<\/span>，每一项解一个常微分方程，初始条件要逐项匹配。\n<\/li><li>\n<strong>三维分离有多个常数<\/strong>：它们之间有 <span class=\"katex-inline\">\\lambda=\\mu+\\nu<\/span> 的关系，漏掉这个约束，方程解不出。\n<\/ul>\n<h2>与前后章的接口<\/h2>\n<p>第 7 章给了方程和边界；这一章给出第一种系统解法。第 11、12 章的特殊函数，就是球坐标和柱坐标分离变量后本征方程的解。第 10 章的格林函数在本征展开下与这一章同构。<\/p>\n<h2>检查点<\/h2>\n<ul><li>\n解 <span class=\"katex-inline\">u_t=a^2u_{xx}<\/span>、<span class=\"katex-inline\">u(0,t)=u(l,t)=0<\/span>、<span class=\"katex-inline\">u(x,0)=f(x)<\/span>，写出完整级数解\n<\/li><li>\n说明为什么 <span class=\"katex-inline\">\\lambda<\/span> 必须为正才能满足齐次边界\n<\/li><li>\n给非齐次边界 <span class=\"katex-inline\">u(0,t)=g(t)<\/span>，说出齐次化的辅助函数形式\n<\/ul>\n<h2>下一步<\/h2>\n<p>第 9 章：不分离变量，直接沿特征线走。行波法处理&quot;没有边界&quot;或&quot;半无界&quot;的初值问题。<\/p>", "ch09": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch07\">第 7 章：方程的建立与定解条件<\/a><\/span> · <span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/chapter/ch08\">第 8 章：分离变量法<\/a><\/span><\/div><h1>第 9 章：行波法与积分变换法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 7、8 章\n<\/ul>\n<h2>这一章解决什么问题<\/h2>\n<p>无限长弦上没有边界，分离变量用不上——没有边界就没有离散本征值。波动方程的通解是&quot;右行波加左行波&quot;，初始条件直接决定两个波形，这就是达朗贝尔公式。<\/p>\n<p>半无限长的问题多出一个边界：波传到边界会反射。办法是把初始数据延拓到整条轴，用全无界的公式算，再取回半轴。热传导没有行波，改用积分变换。<\/p>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出达朗贝尔公式，用初始位移和速度求出波形\n<\/li><li>\n画特征线，说明一点的值依赖初始数据的哪一段\n<\/li><li>\n用奇延拓或偶延拓处理固定端和自由端的反射\n<\/li><li>\n用傅里叶正弦变换或拉普拉斯变换解半无界热传导\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>波动方程的解是两个不变形的行波；边界的作用是造出一个镜像波。<\/p>\n<h2>概念链（按依赖顺序）<\/h2>\n<ol><li>\n<strong>c901 达朗贝尔公式与波动方程通解<\/strong>——<span class=\"katex-inline\">u=\\frac12[f(x-at)+f(x+at)]+\\frac{1}{2a}\\int_{x-at}^{x+at}g(s)ds<\/span>；前置：c701、c002\n<\/li><li>\n<strong>c902 特征线、依赖区域与因果性<\/strong>——<span class=\"katex-inline\">x\\pm at=<\/span> 常数，信息沿特征线传播；前置：c901\n<\/li><li>\n<strong>c903 半无界问题与延拓反射法<\/strong>——奇延拓给固定端，偶延拓给自由端；前置：c901、c702\n<\/li><li>\n<strong>c904 积分变换法解半无界问题<\/strong>——对空间做正弦/余弦变换，或对时间做拉普拉斯；前置：c502、c601、c702\n<\/ol>\n<h2>难点地图<\/h2>\n<ul><li>\n<strong>达朗贝尔公式的适用前提<\/strong>：全无界、无源、齐次。有源要加一个积分项，有边界要延拓。\n<\/li><li>\n<strong>延拓的奇偶性由边界类型决定<\/strong>：固定端用奇延拓，自由端用偶延拓。选反了，反射波符号错。\n<\/li><li>\n<strong>半无界热传导的边界项<\/strong>：做正弦变换时 <span class=\"katex-inline\">u(0,t)<\/span> 会进方程，不能当零处理。\n<\/ul>\n<h2>与前后章的接口<\/h2>\n<p>第 8 章的本征展开是&quot;驻波&quot;视角；这一章是&quot;行波&quot;视角，在有限弦上两者等价。第 10 章的格林函数会给出更一般的传播图像。<\/p>\n<h2>检查点<\/h2>\n<ul><li>\n给定三角初始位移、零初速度，画出 <span class=\"katex-inline\">t<\/span> 时刻的波形\n<\/li><li>\n说明固定端反射为什么波形反号\n<\/li><li>\n写出半无界热传导用拉普拉斯变换求解的第一步\n<\/ul>\n<h2>下一步<\/h2>\n<p>第 10 章：格林函数。把&quot;源&quot;和&quot;响应&quot;分开，任何线性问题都能写成源乘格林函数的积分。<\/p>", "ch10": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch07\">第 7 章：方程的建立与定解条件<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch08\">第 8 章：分离变量法<\/a><\/span><\/div><h1>第 10 章：格林函数法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 7、8 章\n<\/ul>\n<h2>这一章解决什么问题<\/h2>\n<p>前面解的都是&quot;给定边界和初始，求全场&quot;。格林函数换个问法：在 <span class=\"katex-inline\">r_0<\/span> 放一个点源，场是什么样？有了这个响应，任何分布源的解都是叠加——一个积分。<\/p>\n<p>它把解方程变成做积分，也把边界的影响单独拎出来：自由空间的基本解加上边界修正项就是格林函数。<\/p>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n用 <span class=\"katex-inline\">\\delta<\/span> 函数写出点源方程 <span class=\"katex-inline\">LG=\\delta(r-r_0)<\/span>\n<\/li><li>\n用镜像法构造半无界、接地平面、接地球面的格林函数\n<\/li><li>\n写出波动方程的推迟格林函数，解释推迟势\n<\/li><li>\n用本征函数展开构造有界区域的格林函数\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>格林函数是&quot;点源引起的场&quot;，线性叠加保证它一个函数管所有源。<\/p>\n<h2>概念链（按依赖顺序）<\/h2>\n<ol><li>\n<strong>c1001 <span class=\"katex-inline\">\\delta<\/span> 函数与基本解<\/strong>——<span class=\"katex-inline\">LG=\\delta(r-r_0)<\/span> 的解，自由空间的响应；前置：c504、c701\n<\/li><li>\n<strong>c1002 泊松方程格林函数与镜像法<\/strong>——接地平面、接地球面的镜像源；前置：c1001、c702\n<\/li><li>\n<strong>c1003 波动方程格林函数与推迟势<\/strong>——<span class=\"katex-inline\">G=\\frac{\\delta(t-r/a)}{4\\pi r}<\/span>；前置：c1001、c901\n<\/li><li>\n<strong>c1004 格林函数的本征函数展开<\/strong>——用区域本征函数系展开 <span class=\"katex-inline\">\\delta<\/span>；前置：c1002、c802\n<\/ol>\n<h2>难点地图<\/h2>\n<ul><li>\n<strong>格林函数要满足齐次边界条件<\/strong>：自由空间基本解不能直接用，要用镜像或本征展开补上边界修正。\n<\/li><li>\n<strong>镜像源的符号<\/strong>：接地导体面放异号镜像，绝热面放同号。判据是边界条件类型，不是&quot;电场排斥&quot;之类的直觉。\n<\/li><li>\n<strong>推迟时间 <span class=\"katex-inline\">t-r/a<\/span><\/strong>：不是 <span class=\"katex-inline\">t<\/span>，因果性在这里体现，写错就得到超前解。\n<\/ul>\n<h2>与前后章的接口<\/h2>\n<p>第 8 章的本征函数、第 9 章的行波在这里汇合。第 11、12 章的特殊函数常用来写球域和圆柱域的格林函数。<\/p>\n<h2>检查点<\/h2>\n<ul><li>\n写出一维半无界热传导的格林函数，说明镜像项符号\n<\/li><li>\n说明波动方程格林函数里 <span class=\"katex-inline\">\\delta(t-r/a)<\/span> 的来源\n<\/li><li>\n用本征展开写出矩形区域泊松方程格林函数的形式\n<\/ul>\n<h2>下一步<\/h2>\n<p>第 11 章：球坐标。分离变量走到球里，勒让德方程自动出现。<\/p>", "ch11": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch08\">第 8 章：分离变量法<\/a><\/span><\/div><h1>第 11 章：勒让德多项式与球谐函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 8 章\n<\/ul>\n<h2>这一章解决什么问题<\/h2>\n<p>球对称问题——球外电势、球形空腔、球面温度分布——必须在球坐标分离变量。径向方程好解，角度方程给出勒让德方程。它的解不是初等函数，必须单独研究：多项式、母函数、递推、正交性。<\/p>\n<p>这一章的核心不是记住公式表，是理解&quot;为什么 <span class=\"katex-inline\">l<\/span> 必须是整数&quot;：解在 <span class=\"katex-inline\">\\theta=0,\\pi<\/span> 要有界，这个要求把连续参数筛成离散的。<\/p>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n在球坐标完成分离变量，写出径向、极角、方位角三个方程\n<\/li><li>\n用母函数或罗德里格斯公式生成勒让德多项式\n<\/li><li>\n用正交性把球面函数展开成 <span class=\"katex-inline\">P_l<\/span> 的级数\n<\/li><li>\n写出连带勒让德函数与球谐函数，说明它们与 <span class=\"katex-inline\">P_l<\/span> 的关系\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>球坐标分离变量把角度部分锁死成勒让德方程；&quot;在极点有界&quot;这个条件把 <span class=\"katex-inline\">l<\/span> 筛成整数。<\/p>\n<h2>概念链（按依赖顺序）<\/h2>\n<ol><li>\n<strong>c1101 球坐标分离变量与勒让德方程<\/strong>——从 <span class=\"katex-inline\">\\Delta u=0<\/span> 到 <span class=\"katex-inline\">(\\sin\\theta\\,\\Theta&#x27;)&#x27;/\\sin\\theta+l(l+1)\\Theta=0<\/span>；前置：c805\n<\/li><li>\n<strong>c1102 勒让德多项式<\/strong>——母函数 <span class=\"katex-inline\">1/\\sqrt{1-2xt+t^2}<\/span>、罗德里格斯公式、递推关系；前置：c1101\n<\/li><li>\n<strong>c1103 勒让德多项式的正交性与展开<\/strong>——<span class=\"katex-inline\">\\int_{-1}^1P_lP_m dx=\\frac{2}{2l+1}\\delta_{lm}<\/span>；前置：c1102、c804\n<\/li><li>\n<strong>c1104 连带勒让德函数与球谐函数<\/strong>——<span class=\"katex-inline\">P_l^m<\/span>、<span class=\"katex-inline\">Y_{lm}<\/span>，方位角给出 <span class=\"katex-inline\">e^{im\\varphi}<\/span>；前置：c1103\n<\/ol>\n<h2>难点地图<\/h2>\n<ul><li>\n<strong>正则奇点决定量子化<\/strong>：勒让德方程在 <span class=\"katex-inline\">x=\\pm1<\/span> 有正则奇点，只有 <span class=\"katex-inline\">l<\/span> 为整数才有有界解。这是&quot;本征值离散&quot;的数学来源。\n<\/li><li>\n<strong>母函数里 <span class=\"katex-inline\">t<\/span> 与 <span class=\"katex-inline\">x<\/span> 的角色<\/strong>：<span class=\"katex-inline\">t^l<\/span> 的系数是 <span class=\"katex-inline\">P_l(x)<\/span>，<span class=\"katex-inline\">x<\/span> 是自变量，<span class=\"katex-inline\">t<\/span> 只是展开参数，容易搞混。\n<\/li><li>\n<strong>球谐归一化因子<\/strong>：<span class=\"katex-inline\">\\sqrt{\\frac{2l+1}{4\\pi}\\frac{(l-m)!}{(l+m)!}}<\/span> 常被漏，导致展开系数整体差常数。\n<\/ul>\n<h2>与前后章的接口<\/h2>\n<p>第 8 章的分离变量框架在这里第一次遇到&quot;非初等本征函数&quot;。第 12 章柱坐标给另一套（贝塞尔）。第 10 章的球域格林函数要用球谐展开。<\/p>\n<h2>检查点<\/h2>\n<ul><li>\n写出球坐标拉普拉斯方程分离变量后的三个常微分方程\n<\/li><li>\n用罗德里格斯公式算出 <span class=\"katex-inline\">P_2(x)<\/span>\n<\/li><li>\n把 <span class=\"katex-inline\">f(\\theta)=1+\\cos\\theta<\/span> 展开成 <span class=\"katex-inline\">P_l<\/span> 级数，说出前两项\n<\/ul>\n<h2>下一步<\/h2>\n<p>第 12 章：柱坐标。同样的套路，换一个本征方程，得到贝塞尔函数。<\/p>", "ch12": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch08\">第 8 章：分离变量法<\/a><\/span> · <span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/chapter/ch11\">第 11 章：勒让德多项式与球谐函数<\/a><\/span><\/div><h1>第 12 章：贝塞尔函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 8 章\n<\/ul>\n<h2>这一章解决什么问题<\/h2>\n<p>圆柱、圆盘、圆管里的问题在柱坐标分离变量，径向方程变成贝塞尔方程。它的解是振荡衰减的贝塞尔函数，本征值由圆柱边界条件决定——不是整数，而是 <span class=\"katex-inline\">J_\\nu<\/span> 的零点。<\/p>\n<p>这一章和上一章结构平行：分离变量 → 本征方程 → 特殊函数 → 正交展开。学完这两章，&quot;特殊函数&quot;就不再是公式表，而是一套固定流程。<\/p>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n完成柱坐标分离变量，写出贝塞尔方程\n<\/li><li>\n分辨 <span class=\"katex-inline\">J_\\nu<\/span> 与 <span class=\"katex-inline\">Y_\\nu<\/span> 在原点、无穷远的行为，知道该丢哪一个\n<\/li><li>\n用递推关系和生成函数算积分\n<\/li><li>\n用带权正交性做傅里叶–贝塞尔展开，写出圆柱区域的解\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>柱坐标的本征值不是整数 <span class=\"katex-inline\">n<\/span>，而是 <span class=\"katex-inline\">J_\\nu<\/span> 的零点；圆柱问题的答案里总出现贝塞尔函数的根，原因就在这里。<\/p>\n<h2>概念链（按依赖顺序）<\/h2>\n<ol><li>\n<strong>c1201 柱坐标分离变量与贝塞尔方程<\/strong>——<span class=\"katex-inline\">x^2R&#x27;&#x27;+xR&#x27;+(x^2-\\nu^2)R=0<\/span>；前置：c805\n<\/li><li>\n<strong>c1202 贝塞尔函数 <span class=\"katex-inline\">J_\\nu<\/span>、<span class=\"katex-inline\">Y_\\nu<\/span> 与递推性质<\/strong>——级数解、奇点行为、递推；前置：c1201\n<\/li><li>\n<strong>c1203 贝塞尔函数的正交性与傅里叶–贝塞尔展开<\/strong>——权重 <span class=\"katex-inline\">x<\/span>，零点定本征值；前置：c1202、c804\n<\/li><li>\n<strong>c1204 修正贝塞尔、球贝塞尔与渐近行为<\/strong>——<span class=\"katex-inline\">I_\\nu<\/span>、<span class=\"katex-inline\">K_\\nu<\/span>、<span class=\"katex-inline\">j_l<\/span>、<span class=\"katex-inline\">n_l<\/span>；前置：c1202\n<\/ol>\n<h2>难点地图<\/h2>\n<ul><li>\n<strong><span class=\"katex-inline\">Y_\\nu<\/span> 在原点的发散<\/strong>：圆柱内部问题必须丢掉它，这个取舍就是&quot;有界性条件&quot;，和第 11 章筛 <span class=\"katex-inline\">l<\/span> 是同一件事。\n<\/li><li>\n<strong>带权正交<\/strong>：贝塞尔函数的正交积分里有权重 <span class=\"katex-inline\">x<\/span>，漏掉权重，展开系数全错。\n<\/li><li>\n<strong>球贝塞尔不是初等函数的例外<\/strong>：<span class=\"katex-inline\">j_l<\/span>、<span class=\"katex-inline\">n_l<\/span> 其实是正弦余弦除以 <span class=\"katex-inline\">x<\/span> 的组合，可以手算，不必查表。\n<\/ul>\n<h2>与前后章的接口<\/h2>\n<p>第 11 章的勒让德是球坐标的本征函数，这一章的贝塞尔是柱坐标的。两者在&quot;本征函数展开&quot;框架里地位相同。第 10 章的圆柱域格林函数要用它。<\/p>\n<h2>检查点<\/h2>\n<ul><li>\n写出柱坐标拉普拉斯方程分离变量后的径向方程\n<\/li><li>\n说明为什么圆柱内部解只保留 <span class=\"katex-inline\">J_\\nu<\/span>\n<\/li><li>\n写出 <span class=\"katex-inline\">J_0<\/span> 的前三个零点，说明它们如何决定本征值\n<\/ul>\n<h2>下一步<\/h2>\n<p>第 13 章：变分法。换一个完全不同的视角——不求方程的解，求泛函的极值。<\/p>", "ch13": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch00\">第 0 章：开课前的数学工具箱<\/a><\/span> · <span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/chapter/ch08\">第 8 章：分离变量法<\/a><\/span><\/div><h1>第 13 章：变分法初步<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 0 章\n<\/ul>\n<h2>这一章解决什么问题<\/h2>\n<p>很多物理规律不是&quot;力等于什么&quot;，而是&quot;某个量取极值&quot;：光线走最短时间、弦取最低势能、粒子走作用量最小的路径。变分法把&quot;极值&quot;写成方程，得到的欧拉–拉格朗日方程往往就是原来的运动方程。<\/p>\n<p>这一章给整门课一个收口：方程可以从极值原理来，也可以反过来用试探函数近似求解。<\/p>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ul><li>\n写出泛函与变分的定义，说清它和普通函数的区别\n<\/li><li>\n推导欧拉–拉格朗日方程\n<\/li><li>\n把哈密顿原理写成作用量极值，导出拉格朗日方程\n<\/li><li>\n用瑞利–里兹法求本征值的近似，并说明为什么是上界\n<\/ul>\n<h2>一句话核心<\/h2>\n<p>变分法把&quot;微分方程&quot;翻译成&quot;某个积分取极值&quot;，反过来也能用试探函数近似求解。<\/p>\n<h2>概念链（按依赖顺序）<\/h2>\n<ol><li>\n<strong>c1301 泛函与变分<\/strong>——输入是函数，输出是数；变分是函数的小扰动；前置：c001\n<\/li><li>\n<strong>c1302 欧拉–拉格朗日方程<\/strong>——<span class=\"katex-inline\">\\frac{d}{dx}\\frac{\\partial L}{\\partial y&#x27;}-\\frac{\\partial L}{\\partial y}=0<\/span>；前置：c1301\n<\/li><li>\n<strong>c1303 变分原理与哈密顿原理<\/strong>——<span class=\"katex-inline\">S=\\int L\\,dt<\/span> 取极值给出运动方程；前置：c1302\n<\/li><li>\n<strong>c1304 瑞利–里兹近似<\/strong>——试探函数代入泛函求极值，得本征值上界；前置：c1302、c803\n<\/ol>\n<h2>难点地图<\/h2>\n<ul><li>\n<strong><span class=\"katex-inline\">\\delta<\/span> 不是微分<\/strong>：<span class=\"katex-inline\">\\delta y<\/span> 是函数空间里的方向，运算规则像微分但不能和 <span class=\"katex-inline\">dy<\/span> 混。\n<\/li><li>\n<strong>边界项必须为零<\/strong>：分部积分产生的边界项对应&quot;固定端点&quot;的变分条件，漏掉它方程不成立。\n<\/li><li>\n<strong>瑞利–里兹给的是上界<\/strong>：试探函数选得差，会高估本征值，而且无法判断差多少。\n<\/ul>\n<h2>与前后章的接口<\/h2>\n<p>第 8 章的本征值问题可以用变分法重写；这一章给整门课一个&quot;从极值原理看方程&quot;的收口。<\/p>\n<h2>检查点<\/h2>\n<ul><li>\n写出最速降线问题的泛函，给出欧拉方程\n<\/li><li>\n从 <span class=\"katex-inline\">L=T-V<\/span> 导出单摆方程\n<\/li><li>\n说明瑞利商为什么给出本征值上界\n<\/ul>\n<h2>下一步<\/h2>\n<p>回到学习路径，做综合检验：任选一个物理场景，从建模到求解走完整条链。<\/p>", "c001": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><h1>偏导数、全微分与链式法则<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 0 章、第 7 章、第 9 章 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>偏导数是&quot;只看一个方向的变化率&quot;，全微分是把各方向的小变化按线性主部加起来；链式法则处理的是&quot;变量本身还依赖别的变量&quot;时的求导。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>这是整门课的地基。建立方程要算微元的变化率，验证解要代回方程，坐标变换要把 <span class=\"katex-inline\">\\frac{\\partial}{\\partial x}<\/span> 换成 <span class=\"katex-inline\">\\frac{\\partial}{\\partial r}<\/span>，全靠它。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n<span class=\"katex-inline\">du=u_x\\,dx+u_t\\,dt<\/span>，可微时这个线性主部就是全部一阶变化。\n<\/li><li>\n复合 <span class=\"katex-inline\">u=f(x-at)<\/span>：<span class=\"katex-inline\">u_t=-af&#x27;<\/span>、<span class=\"katex-inline\">u_x=f&#x27;<\/span>，于是 <span class=\"katex-inline\">u_{tt}=a^2f&#x27;&#x27;=a^2u_{xx}<\/span>——行波解满足波动方程，一行就能验证。\n<\/li><li>\n二阶链式会出两类项：<span class=\"katex-inline\">u_{xx}=f&#x27;&#x27;\\phi_x^2+f&#x27;\\phi_{xx}<\/span>，<span class=\"katex-inline\">f&#x27;<\/span> 那一项最容易漏。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为&quot;偏导就是把别的变量当常数&quot;就够了。复合函数里内层变量随外层变，必须走链式，不能只看显式依赖。\n<\/li><li>\n把 <span class=\"katex-inline\">u_{tt}=a^2u_{xx}<\/span> 当成&quot;算错了符号&quot;，其实是 <span class=\"katex-inline\">a^2<\/span> 来自两次链式的乘积。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：无。后续：c002、c004、c202、c701。<\/p>", "c002": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c001\">偏导数、全微分与链式法则<\/a><\/span><\/div><h1>线性常微分方程与特征根法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 0 章、第 6 章、第 8 章 | <strong>前置<\/strong>：c001\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>常系数线性齐次方程 <span class=\"katex-inline\">y&#x27;&#x27;+py&#x27;+qy=0<\/span> 的解，由特征方程 <span class=\"katex-inline\">\\lambda^2+p\\lambda+q=0<\/span> 的根决定；非齐次方程再加一个特解。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>分离变量的最后一步永远是解一串这样的方程：时间方向一个，空间方向一个。第 6 章的拉普拉斯变换本质上是把它代数化，但特征根法仍是理解解的形状的基准。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n两个不同实根 <span class=\"katex-inline\">\\lambda_1,\\lambda_2<\/span>：<span class=\"katex-inline\">y=C_1e^{\\lambda_1t}+C_2e^{\\lambda_2t}<\/span>。\n<\/li><li>\n重根 <span class=\"katex-inline\">\\lambda<\/span>：<span class=\"katex-inline\">y=(C_1+C_2t)e^{\\lambda t}<\/span>——第二个解靠乘以 <span class=\"katex-inline\">t<\/span> 凑出来。\n<\/li><li>\n共轭复根 <span class=\"katex-inline\">\\alpha\\pm i\\beta<\/span>：<span class=\"katex-inline\">y=e^{\\alpha t}(C_1\\cos\\beta t+C_2\\sin\\beta t)<\/span>，振荡的来源。\n<\/li><li>\n非齐次 <span class=\"katex-inline\">y&#x27;&#x27;+py&#x27;+qy=f(t)<\/span>：通解 = 齐次通解 + 任一特解。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n重根时写 <span class=\"katex-inline\">C_1e^{\\lambda t}+C_2e^{\\lambda t}<\/span>，两个常数其实合并成一个，解空间只有一维。\n<\/li><li>\n把特征根当成&quot;解的零点&quot;，其实根决定的是指数/振荡的形态。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c001。后续：c601、c801、c901。<\/p>", "c003": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><h1>无穷级数与收敛半径<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 0 章、第 4 章、第 5 章、第 8 章 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>幂级数 <span class=\"katex-inline\">\\sum a_n(z-z_0)^n<\/span> 在一个以 <span class=\"katex-inline\">z_0<\/span> 为心的圆内绝对收敛、圆外发散，这个圆的半径叫收敛半径。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>复变部分的泰勒展开、洛朗展开，傅里叶级数，分离变量后的本征函数展开，全是级数。判断&quot;展开到哪一层成立&quot;，就是在判断收敛半径。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n比值法：<span class=\"katex-inline\">R=\\lim|a_n/a_{n+1}|<\/span>；根值法：<span class=\"katex-inline\">R=1/\\limsup|a_n|^{1/n}<\/span>。\n<\/li><li>\n圆内绝对收敛，圆外发散，圆周上要单独判断（可能条件收敛，也可能处处发散）。\n<\/li><li>\n解析函数的泰勒级数，收敛半径等于&quot;到最近奇点的距离&quot;——不是定义域的边界。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为收敛半径由&quot;项数多少&quot;决定。它只看系数的增长速度。\n<\/li><li>\n以为圆周上一定收敛。<span class=\"katex-inline\">\\sum z^n<\/span> 在 <span class=\"katex-inline\">|z|=1<\/span> 上除 <span class=\"katex-inline\">z=-1<\/span> 外都发散。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：无。后续：c401、c402、c501、c804。<\/p>", "c004": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c001\">偏导数、全微分与链式法则<\/a><\/span><\/div><h1>矢量分析与场论记号<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 0 章、第 7 章、第 8 章 | <strong>前置<\/strong>：c001\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>梯度、散度、旋度是 <span class=\"katex-inline\">\\nabla<\/span> 算子的三种作用方式，分别描述&quot;变化最快的方向&quot;、&quot;源的强度&quot;、&quot;旋转的强度&quot;。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>建立方程时，守恒律写成 <span class=\"katex-inline\">\\nabla\\cdot\\vec J+\\partial_t\\rho=0<\/span>，本构关系写成 <span class=\"katex-inline\">\\vec J=-k\\nabla u<\/span>。不会把 <span class=\"katex-inline\">\\nabla<\/span> 翻译成坐标分量，方程就落不到纸上。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n直角坐标：<span class=\"katex-inline\">\\nabla u=(u_x,u_y,u_z)<\/span>，<span class=\"katex-inline\">\\nabla\\cdot\\vec A=A_x^x+A_y^y+A_z^z<\/span>，<span class=\"katex-inline\">\\nabla\\times\\vec A<\/span> 按行列式展开。\n<\/li><li>\n高斯定理：<span class=\"katex-inline\">\\int_V\\nabla\\cdot\\vec A\\,dV=\\int_S\\vec A\\cdot d\\vec S<\/span>，散度定理把体积分变面积分。\n<\/li><li>\n拉普拉斯算子 <span class=\"katex-inline\">\\Delta=\\nabla\\cdot\\nabla<\/span>，在直角坐标是 <span class=\"katex-inline\">u_{xx}+u_{yy}+u_{zz}<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把 <span class=\"katex-inline\">\\nabla<\/span> 当成一个普通矢量单独使用。它必须作用在函数上才有意义。\n<\/li><li>\n以为柱坐标、球坐标的 <span class=\"katex-inline\">\\nabla<\/span> 只是换字母。实际上要带 <span class=\"katex-inline\">1/r<\/span>、<span class=\"katex-inline\">1/(r\\sin\\theta)<\/span> 这些度量因子。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c001。后续：c701、c805、c1101、c1201。<\/p>", "c101": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><h1>复数与复平面运算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>复数是 <span class=\"katex-inline\">z=x+iy<\/span>，也是平面上的点、从原点出发的箭头；写成 <span class=\"katex-inline\">z=re^{i\\theta}<\/span> 后，乘法变成&quot;模相乘、角相加&quot;。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>整个复变部分的坐标系。后面说&quot;解析&quot;、&quot;围道&quot;、&quot;留数&quot;，都在这个平面上发生。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n欧拉公式 <span class=\"katex-inline\">e^{i\\theta}=\\cos\\theta+i\\sin\\theta<\/span>，把三角与指数接上，是复变函数全部便利的来源。\n<\/li><li>\n乘法：<span class=\"katex-inline\">z_1z_2=r_1r_2e^{i(\\theta_1+\\theta_2)}<\/span>；除法：模相除、角相减。\n<\/li><li>\n开方：<span class=\"katex-inline\">z^{1/n}<\/span> 有 <span class=\"katex-inline\">n<\/span> 个根，均匀分布在半径 <span class=\"katex-inline\">r^{1/n}<\/span> 的圆上，相位差 <span class=\"katex-inline\">2\\pi/n<\/span>。\n<\/li><li>\n共轭 <span class=\"katex-inline\">\\bar z=x-iy<\/span>，<span class=\"katex-inline\">z\\bar z=|z|^2<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n认为 <span class=\"katex-inline\">\\sqrt{z^2}=z<\/span>。在复数里这只对一半分支成立，<span class=\"katex-inline\">\\sqrt{z^2}=|z|<\/span> 更接近真相。\n<\/li><li>\n把 <span class=\"katex-inline\">\\arg z<\/span> 当单值函数。它有无限多个值，相差 <span class=\"katex-inline\">2\\pi<\/span> 的整数倍。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：无。后续：c102、c103、c104、c204。<\/p>", "c102": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c101\">复数与复平面运算<\/a><\/span><\/div><h1>复变函数的极限与连续<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章 | <strong>前置<\/strong>：c101\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>当 <span class=\"katex-inline\">z<\/span> 从任意方向、任意路径趋近 <span class=\"katex-inline\">z_0<\/span> 时，<span class=\"katex-inline\">f(z)<\/span> 都趋近同一个复数 <span class=\"katex-inline\">w_0<\/span>，才叫极限存在；极限存在且等于函数值，才叫连续。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>复变函数的&quot;可导&quot;要求比实函数强，根源就在这个&quot;任意方向&quot;的要求上。第 2 章的解析性从这里长出来。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n<span class=\"katex-inline\">f=u+iv<\/span> 连续 ⇔ <span class=\"katex-inline\">u<\/span>、<span class=\"katex-inline\">v<\/span> 两个二元实函数都连续。\n<\/li><li>\n有界闭区域上的连续函数有界，且能取到最大模——这是第 3 章最大模原理的实函数版本。\n<\/li><li>\n极限存在要求所有路径一致；只要找到两条路径给出不同的值，就能否定极限。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n沿实轴和沿虚轴两条路极限相同，就断定极限存在。路径有无数条，两条不够。\n<\/li><li>\n把&quot;函数在一点有定义&quot;当成&quot;连续&quot;。还要极限存在且等于该值。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c101。后续：c201、c301。<\/p>", "c104": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c101\">复数与复平面运算<\/a><\/span><\/div><h1>复球面与无穷远点<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章、第 4 章 | <strong>前置<\/strong>：c101\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把复平面通过球极投影贴到一个球面上，平面上每个点对应球面上一点，唯独&quot;无穷远&quot;对应北极；加上这个点，平面变成扩充复平面。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它让&quot;<span class=\"katex-inline\">z\\to\\infty<\/span>&quot;有了严格的邻域语言：<span class=\"katex-inline\">|z|&gt;R<\/span> 就是无穷远点的邻域。第 4 章讨论&quot;函数在无穷远点的留数&quot;要用它。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n<span class=\"katex-inline\">w=1/z<\/span> 把 <span class=\"katex-inline\">z=0<\/span> 和 <span class=\"katex-inline\">z=\\infty<\/span> 互换，把单位圆内外互换。\n<\/li><li>\n&quot;<span class=\"katex-inline\">f<\/span> 在无穷远点解析&quot;定义为 <span class=\"katex-inline\">f(1/w)<\/span> 在 <span class=\"katex-inline\">w=0<\/span> 解析；判断时先做这个替换。\n<\/li><li>\n无穷远点是一个点，不是&quot;很大的数&quot;，所以可以谈它是不是奇点。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把 <span class=\"katex-inline\">\\infty<\/span> 当成极限过程而不是点。谈&quot;<span class=\"katex-inline\">\\infty<\/span> 处的留数&quot;时，它是点。\n<\/li><li>\n以为无穷远点的邻域是&quot;小圆&quot;，正好相反，是半径任意大的圆外部。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c101。后续：c403、c405。<\/p>", "c103": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c101\">复数与复平面运算<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c102\">复变函数的极限与连续<\/a><\/span><\/div><h1>多值函数与分支切割<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1、2、4 章 | <strong>前置<\/strong>：c101、c102\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一个 <span class=\"katex-inline\">z<\/span> 对应多个 <span class=\"katex-inline\">w<\/span> 的对应关系叫多值函数；绕某个点一圈回来后函数值不复原，这个点叫支点，从支点引出的线叫分支切割，切开后才能选出单值分支。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p><span class=\"katex-inline\">\\sqrt z<\/span>、<span class=\"katex-inline\">\\ln z<\/span>、<span class=\"katex-inline\">z^\\alpha<\/span> 都是多值的。不处理分支，第 2 章初等函数没法定义，第 4 章支点积分会算错。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n<span class=\"katex-inline\">\\sqrt[n]{z}<\/span> 在 <span class=\"katex-inline\">z=0<\/span> 与 <span class=\"katex-inline\">z=\\infty<\/span> 是支点，绕原点一圈相位变 <span class=\"katex-inline\">2\\pi/n<\/span>，需要 <span class=\"katex-inline\">n<\/span> 叶才能铺满。\n<\/li><li>\n<span class=\"katex-inline\">\\ln z=\\ln|z|+i(\\arg z+2k\\pi)<\/span>，绕一圈多 <span class=\"katex-inline\">2\\pi i<\/span>，无穷多叶。\n<\/li><li>\n分支切割从支点连到另一个支点或无穷远；切法不同，选出的分支不同，但描述的是同一个多值函数。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把分支切割当成&quot;人为删掉一条线&quot;。它标记的是绕不过去的结构，函数在切口两侧的值确实不同。\n<\/li><li>\n以为换一种切法会得到不同的函数。得到的是同一多值函数的不同单值分支。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c101、c102。后续：c204、c405。<\/p>", "c201": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c102\">复变函数的极限与连续<\/a><\/span><\/div><h1>复导数与解析函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章 | <strong>前置<\/strong>：c102\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>复导数 <span class=\"katex-inline\">f&#x27;(z_0)=\\lim_{\\Delta z\\to0}\\frac{f(z_0+\\Delta z)-f(z_0)}{\\Delta z}<\/span> 要求极限与 <span class=\"katex-inline\">\\Delta z<\/span> 趋近的方式无关；若 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">z_0<\/span> 的某个邻域内处处可导，就说 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">z_0<\/span> 解析。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>&quot;解析&quot;是整门课的核心资格证。只有解析函数才有柯西定理、柯西公式、幂级数展开；不解析的点正是第 4 章要数的奇点。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n解析 ⇒ 无限次可导 ⇒ 在邻域内可展成幂级数。这是复变函数比实函数&quot;好&quot;的地方。\n<\/li><li>\n解析函数的实部与虚部都是调和函数（第 2 章 c203）。\n<\/li><li>\n可导但不在邻域内可导，只能叫&quot;在一点可导&quot;，不叫解析。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把&quot;某点可导&quot;等同于&quot;该点解析&quot;。解析是邻域性质，要求周围一圈都可导。\n<\/li><li>\n以为 <span class=\"katex-inline\">f(z)=\\bar z<\/span> 只是&quot;不常见&quot;，其实它处处连续、处处不可导。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c102。后续：c202、c203、c302、c401。<\/p>", "c202": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c201\">复导数与解析函数<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c001\">偏导数、全微分与链式法则<\/a><\/span><\/div><h1>柯西–黎曼方程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章 | <strong>前置<\/strong>：c201、c001\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>设 <span class=\"katex-inline\">f=u+iv<\/span>，<span class=\"katex-inline\">f<\/span> 在一点可导的充要条件是 <span class=\"katex-inline\">u,v<\/span> 可微且满足 <span class=\"katex-inline\">u_x=v_y<\/span>、<span class=\"katex-inline\">u_y=-v_x<\/span>；这一对方程就是柯西–黎曼方程。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它把&quot;复可导&quot;翻译成&quot;两个实函数的一阶偏导关系&quot;，是判定解析性的唯一实用工具，也是构造解析函数的入口。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n极坐标形式：<span class=\"katex-inline\">u_r=\\frac1r v_\\theta<\/span>，<span class=\"katex-inline\">v_r=-\\frac1r u_\\theta<\/span>，在圆域问题上更好用。\n<\/li><li>\n已知 <span class=\"katex-inline\">u<\/span> 求 <span class=\"katex-inline\">v<\/span>：用 <span class=\"katex-inline\">dv=-u_y dx+u_x dy<\/span> 沿路径积分，或凑全微分；结果差一个常数。\n<\/li><li>\n满足柯西–黎曼方程且偏导连续，就得到解析函数。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把第二个方程写成 <span class=\"katex-inline\">u_y=v_x<\/span>。符号错一个，整章判断全反。\n<\/li><li>\n以为满足柯西–黎曼方程就一定解析。还要 <span class=\"katex-inline\">u,v<\/span> 可微，缺这一条可能只有形式上的偏导相等。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c201、c001。后续：c203、c205、c401。<\/p>", "c203": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c202\">柯西–黎曼方程<\/a><\/span><\/div><h1>调和函数与共轭调和函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、3、7 章 | <strong>前置<\/strong>：c202\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>满足拉普拉斯方程 <span class=\"katex-inline\">\\Delta u=0<\/span> 的二元函数叫调和函数；若 <span class=\"katex-inline\">v<\/span> 使 <span class=\"katex-inline\">u+iv<\/span> 解析，则 <span class=\"katex-inline\">v<\/span> 是 <span class=\"katex-inline\">u<\/span> 的共轭调和函数。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>它把复变函数和二维静电场、稳态温度场直接接上：电势是调和函数，流函数是它的共轭。第 7 章的拉普拉斯方程在这里第一次露面。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n解析函数的实部和虚部都调和，且互为共轭。\n<\/li><li>\n单连通区域内给定调和 <span class=\"katex-inline\">u<\/span>，一定存在共轭 <span class=\"katex-inline\">v<\/span>（差常数）；多连通区域可能多值。\n<\/li><li>\n等势线 <span class=\"katex-inline\">u=\\text{const}<\/span> 与流线 <span class=\"katex-inline\">v=\\text{const}<\/span> 正交——这就是保角性的物理版本。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n以为任何调和函数都能配出单值共轭。区域有洞时，绕洞一圈 <span class=\"katex-inline\">v<\/span> 可能不还原。\n<\/li><li>\n把&quot;共轭&quot;理解成复共轭。这里是&quot;共轭调和&quot;，是两个实函数的关系。\n<\/ul>\n<h2>相关概念<\/h2>\n<p>前置：c202。后续：c305、c701、c205。<\/p>", "c204": "<div class=\"source-badge\">📖 出处：通用主线（自拟框架）<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c103\">多值函数与分支切割<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c201\">复导数与解析函数<\/a><\/span><\/div><h1>初等解析函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、4 章 | <strong>前置<\/strong>：c103、c201\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>指数、对数、幂、三角、双曲函数在复平面上的定义；它们大多由 <span class=\"katex-inline\">e^z<\/span> 和 <span class=\"katex-inline\">\\ln z<\/span> 组合出来，因此继承了周期性或多值性。<\/p>\n<h2>它在体系中的位置<\/h2>\n<p>第 4 章算留数、第 5 章做傅里叶变换，用的都是这批函数的性质。不知道 <span class=\"katex-inline\">\\sin z<\/span> 在复平面无界，就会把留数估计错。<\/p>\n<h2>核心结论<\/h2>\n<ul><li>\n<span class=\"katex-inline\">e^z=e^x(\\cos y+i\\sin y)<\/span>，周期 <span class=\"katex-inline\">2\\pi i<\/span>，且 <span class=\"katex-inline\">e^z\\ne0<\/span> 对任意有限 <span class=\"katex-inline\">z<\/span> 成立。\n<\/li><li>\n<span class=\"katex-inline\">\\ln z=\\ln|z|+i\\arg z<\/span> 多值；主值取 <span class=\"katex-inline\">-\\pi&lt;\\arg z\\le\\pi<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\sin z=\\frac{e^{iz}-e^{-iz}}{2i}<\/span>，在复平面无界；<span class=\"katex-inline\">|\\sin z|\\le1<\/span> 只在实轴成立。\n<\/li><li>\n<span class=\"katex-inline\">z^\\alpha=e^{\\alpha\\ln z}<\/span>，<span class=\"katex-inline\">\\alpha<\/span> 非整数时在原点与无穷远有支点。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n把实轴的 <span class=\"katex-inline\">|\\sin z|\\le1<\/span>、<span class=\"katex-inline\">|\\cos z|\\le1<\/span> 搬到复平面。沿虚轴走，它们指数增长。\n<\/li><li>\n以为 <span class=\"katex-inline\
